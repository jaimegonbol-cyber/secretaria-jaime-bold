    --sombra:0 1px 3px rgba(18,56,50,.08), 0 1px 2px rgba(18,56,50,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--areia);
    color:var(--texto);
    height:100vh;
  }
  h1,h2,h3{font-weight:700;letter-spacing:-.01em;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--terracota);color:white;}

  /* ---------- LOGIN / SET PASSWORD ---------- */
  .tela-auth{
    height:100vh;height:100dvh;min-height:100vh;overflow-y:auto;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 20% -10%, #15325C22, transparent),
               radial-gradient(900px 500px at 100% 110%, #2E6BB81a, transparent),
               var(--areia);
    padding:24px;
  }
  .cartao-auth{
    background:var(--branco);border:1px solid var(--borda);border-radius:16px;
    padding:40px 36px;width:100%;max-width:400px;box-shadow:var(--sombra);
    text-align:center;margin:auto;
  }
  .cartao-auth .campo{text-align:left;}
  .selo{
    width:52px;height:52px;border-radius:50%;
    background-image:var(--logo-url);background-size:contain;background-repeat:no-repeat;background-position:center;
    margin:0 auto 18px;
  }
  .cartao-auth h1{font-size:20px;color:var(--verde-escuro);margin-bottom:4px;}
  .cartao-auth p.sub{color:var(--texto-suave);font-size:14px;margin:0 0 24px;}
  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:13px;font-weight:600;color:var(--texto);margin-bottom:6px;}
  .campo input, .campo select{
    width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:8px;
    font-size:14px;background:var(--areia);color:var(--texto);outline:none;
    transition:border-color .15s, background .15s;
  }
  .campo input:focus, .campo select:focus{border-color:var(--verde);background:white;}
  .botao{
    width:100%;padding:12px;border-radius:8px;border:none;font-weight:700;font-size:14px;
    background:var(--verde);color:white;transition:background .15s, transform .08s;
  }
  .botao:hover{background:var(--verde-escuro);}
  .botao:active{transform:scale(.98);}
  .botao.terracota{background:var(--terracota);}
  .botao.terracota:hover{background:var(--terracota-escuro);}
  .botao.secundario{background:transparent;border:1px solid var(--borda);color:var(--texto);}
  .botao.secundario:hover{background:var(--areia-escura);}
  .botao.pequeno{padding:7px 12px;font-size:13px;width:auto;}
  .botao:disabled{opacity:.55;cursor:not-allowed;}
  .msg-erro{background:#FBEAE5;color:var(--erro);border:1px solid #F0C8BC;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .msg-ok{background:#E7F4EC;color:var(--sucesso);border:1px solid #BFE2CC;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;}

  /* ---------- SELETOR DE DATA CUSTOMIZADO (calendário com legenda) ---------- */
  .seletor-data-wrap{position:relative;}
  .seletor-data-campo{
    width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:8px;
    font-size:14px;background:var(--areia);color:var(--texto);cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .seletor-data-campo:hover{border-color:var(--verde);}
  .calendario-popup{
    position:absolute;top:calc(100% + 6px);left:0;z-index:80;background:var(--branco);
    border:1px solid var(--borda);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.14);
    padding:14px;width:290px;
  }
  .cal-cabecalho{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-cabecalho strong{font-size:13.5px;color:var(--texto);text-transform:capitalize;}
  .cal-nav{background:none;border:none;cursor:pointer;font-size:15px;color:var(--texto-suave);padding:2px 8px;border-radius:6px;}
  .cal-nav:hover{background:var(--areia-escura);}
  .cal-semana{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--texto-suave);margin-bottom:4px;font-weight:600;}
  .cal-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dia{
    text-align:center;padding:7px 0;border-radius:7px;font-size:12.5px;cursor:pointer;
    background:var(--branco);color:var(--texto);border:1px solid transparent;
  }
  .cal-dia.fora-mes{color:#C7C2B4;}
  .cal-dia.nao-letivo{background:#DCE9FB;color:#1a4d8f;}
  .cal-dia.passado-letivo{background:#E1F0E4;color:#1f6b39;}
  .cal-dia.chamada-feita{background:#2E7D5B;color:#fff;font-weight:600;}
  .cal-dia.chamada-parcial{background:#D98A1F;color:#fff;font-weight:600;}
  .cal-dia.chamada-pendente{background:#B4432E;color:#fff;font-weight:600;}
  .cal-dia.futuro{background:var(--branco);}
  .cal-dia.hoje{border-color:var(--terracota);font-weight:700;}
  .cal-dia.selecionado{background:var(--terracota) !important;color:#fff !important;font-weight:700;box-shadow:0 0 0 2px var(--terracota-escuro) inset;}
  .cal-dia:hover{outline:2px solid var(--terracota);outline-offset:-2px;}
  .cal-legenda{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;font-size:11px;color:var(--texto-suave);}
  .cal-legenda span{display:inline-flex;align-items:center;gap:4px;}
  .cal-legenda i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .cal-legenda i.nao-letivo{background:#DCE9FB;}
  .cal-legenda i.passado-letivo{background:#E1F0E4;}
  .cal-legenda i.chamada-feita{background:#2E7D5B;}
  .cal-legenda i.chamada-parcial{background:#D98A1F;}
  .cal-legenda i.chamada-pendente{background:#B4432E;}
  .cal-legenda i.futuro{background:var(--branco);border:1px solid var(--borda);}

  /* ---------- APP SHELL ---------- */
  .shell{display:flex;height:100vh;}
  .nav{
    width:252px;background:var(--verde-escuro);color:#EAF3F0;padding:20px 14px;
    display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;
  }
  .nav .marca{display:flex;align-items:center;gap:10px;padding:8px 4px 24px;}
  .nav .marca .selo{margin:0;width:50px;height:50px;flex-shrink:0;}
  .nav .marca div{font-size:14.5px;font-weight:700;line-height:1.35;white-space:nowrap;}
  .nav .marca span{display:block;font-weight:400;font-size:12px;opacity:.7;white-space:nowrap;}
  .nav a{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:#CFE3DD;text-decoration:none;font-size:14px;font-weight:600;margin-bottom:2px;
    cursor:pointer;transition:background .12s;
  }
  .nav a:hover{background:#1B4B43;}
  .nav a.ativo{background:var(--terracota);color:white;}
  .nav .rodape{margin-top:auto;padding-top:14px;border-top:1px solid #1F544A;font-size:12px;color:#9FC0B7;}
  .nav .rodape .usuario{font-weight:700;color:#EAF3F0;margin-bottom:8px;font-size:13px;}
  .tag-papel{
    display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;background:#1F544A;color:#B9D9CF;padding:2px 7px;border-radius:99px;margin-top:4px;
  }
  .principal{flex:1;min-width:0;padding:6px 34px 10px;max-width:100%;overflow-y:auto;overflow-x:auto;}
  .cabecalho-pagina{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:12px;}
  .subtabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1px solid var(--borda);padding-bottom:2px;}
  .aba-cadastro{
    background:none;border:none;padding:9px 4px;margin-right:14px;font-size:14px;font-weight:700;
    color:var(--texto-suave);border-bottom:2.5px solid transparent;cursor:pointer;
  }
  .aba-cadastro:hover{color:var(--verde-escuro);}
  .aba-cadastro.ativa{color:var(--verde-escuro);border-bottom-color:var(--terracota);}
  .cabecalho-pagina h2{font-size:22px;color:var(--verde-escuro);}
  .cabecalho-pagina p{color:var(--texto-suave);font-size:13px;margin-top:3px;}

  /* cards / stats */
  .grade-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .stat{background:white;border:1px solid var(--borda);border-radius:12px;padding:16px 18px;box-shadow:var(--sombra);}
  .stat .n{font-size:26px;font-weight:800;color:var(--verde-escuro);}
  .stat .l{font-size:12.5px;color:var(--texto-suave);font-weight:600;margin-top:2px;}

  /* painel geral compacto */
  .stats-compactas{display:grid;grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));gap:8px;margin-bottom:8px;}
  .stat-mini{border-radius:9px;padding:9px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .botao-status{border:1px solid var(--borda);background:#fff;border-radius:8px;cursor:pointer;color:var(--texto);font-weight:600;}
  .botao-status:hover{background:var(--areia-escura);}
  .botao-status.ativo.verde{background:#E1F0E4;border-color:#BFE2CC;color:#1f6b39;}
  .botao-status.ativo.vermelho{background:#FBEAE5;border-color:#F0C8BC;color:var(--erro);}
  .botao-status.ativo.laranja{background:#FCEEDD;border-color:#F0D6B0;color:#9a5b12;}
  .botao-status.ativo.azul{background:#DCEBF8;border-color:#B7D4EC;color:#1D5B8C;}
  #btn-frequencia-funcionarios.status-verde{background:#E1F0E4;border-color:#BFE2CC;color:#1f6b39;font-weight:700;}
  #btn-frequencia-funcionarios.status-laranja{background:#FCEEDD;border-color:#F0D6B0;color:#9a5b12;font-weight:700;}
  #btn-frequencia-funcionarios.status-vermelho{background:#FBEAE5;border-color:#F0C8BC;color:var(--erro);font-weight:700;}
  .stat-mini .n{font-size:21px;font-weight:800;color:var(--verde-escuro);line-height:1.15;}
  .stat-mini .l{font-size:11.5px;color:var(--texto-suave);font-weight:600;margin-top:1px;line-height:1.2;}
  .grade-painel-geral{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;align-items:start;}
  .grade-painel-geral > .painel{min-width:0;}
  .lista-pendentes-compacta{display:flex;flex-direction:column;}
  .item-pendente{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #F0ECE0;font-size:12px;}
  .item-pendente:last-child{border-bottom:none;}
  .item-pendente .ip-data{color:var(--texto-suave);white-space:nowrap;flex:0 0 62px;}
  .item-pendente .ip-doc{flex:1;min-width:0;font-weight:600;color:var(--texto);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-pendente .ip-aluno{flex:1;min-width:0;color:var(--texto-suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grade-graficos{display:grid;grid-template-columns:0.85fr 1.15fr;gap:12px;}
  .grade-graficos > .caixa-grafico{min-width:0;}
  .caixa-grafico{padding:10px 12px 4px;}
  .caixa-grafico h4{font-size:14px;color:var(--texto-suave);font-weight:700;margin:0 0 8px;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:break-word;}
  @media (max-width:900px){
    .grade-painel-geral{grid-template-columns:1fr;}
    .grade-graficos{grid-template-columns:1fr;}
  }

  .painel{background:white;border:1px solid var(--borda);border-radius:12px;box-shadow:var(--sombra);overflow:hidden;}
  .painel .barra{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--borda);flex-wrap:wrap;}
  .barra input[type=text], .barra select{
    padding:8px 12px;border:1px solid var(--borda);border-radius:7px;font-size:13.5px;background:var(--areia);min-width:180px;
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;padding:10px 16px;background:var(--areia);color:var(--texto-suave);
    font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;border-bottom:1px solid var(--borda);
    position:sticky;top:0;
  }
  tbody td{padding:11px 16px;border-bottom:1px solid #F0ECE0;color:var(--texto);}
  tbody tr:hover{background:#FBFAF6;cursor:pointer;}
  tbody tr:hover td.col-acoes{background:#FBFAF6;}
  tbody tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;}
  .pill.verde{background:#E1E9F4;color:var(--verde-escuro);}
  .pill.azul{background:#DCEBF8;color:#1D5B8C;}
  .pill.laranja{background:#DCE9F8;color:var(--terracota-escuro);}
  .pill.cinza{background:#EAE7DD;color:var(--texto-suave);}
  .pill.vermelho{background:#FBEAE5;color:var(--erro);}
  .col-acoes{width:1%;white-space:nowrap;text-align:right;position:sticky;right:0;background:white;box-shadow:-6px 0 6px -6px rgba(0,0,0,.12);}
  thead th.col-acoes{background:var(--areia);}
  .btn-icone{
    background:none;border:1px solid var(--borda);border-radius:6px;padding:5px 8px;font-size:13px;
    cursor:pointer;margin-left:6px;color:var(--texto-suave);line-height:1;
  }
  .btn-icone:hover{background:var(--areia-escura);color:var(--verde-escuro);}
  .btn-icone.perigo:hover{background:#FBEAE5;color:var(--erro);border-color:#F0C8BC;}
  .vazio{padding:50px 20px;text-align:center;color:var(--texto-suave);font-size:14px;}

  /* modal */
  .fundo-modal{position:fixed;inset:0;background:#12211ecc;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:50;}
  .modal{background:white;border-radius:14px;max-width:640px;width:100%;padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{font-size:18px;color:var(--verde-escuro);margin-bottom:2px;}
  .modal .fechar{position:absolute;}
  .modal-topo{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .modal-topo button{background:none;border:none;font-size:20px;color:var(--texto-suave);line-height:1;}
  .grade-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .ficha-linha{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F0ECE0;font-size:13.5px;}
  .ficha-linha span:first-child{color:var(--texto-suave);}
  .ficha-linha span:last-child{font-weight:600;text-align:right;}
  .secao-titulo{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--terracota-escuro);font-weight:800;margin:20px 0 6px;}
  .secao-titulo:first-child{margin-top:0;}

  .carregando{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--texto-suave);font-size:14px;}
  .spinner{width:18px;height:18px;border:2px solid var(--borda);border-top-color:var(--verde);border-radius:50%;animation:girar .7s linear infinite;margin-right:10px;}
  @keyframes girar{to{transform:rotate(360deg);}}

  .btn-sair-mobile{display:none;}
  .btn-voltar-painel{
    position:sticky;top:0;z-index:20;display:inline-flex;align-items:center;gap:6px;
    background:white;border:1px solid var(--borda);border-radius:99px;padding:7px 14px;
    font-size:13px;font-weight:700;color:var(--verde-escuro);cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.08);margin-bottom:12px;
  }
  .btn-voltar-painel:hover{background:var(--areia);}

  @media (max-width:760px){
    .shell{flex-direction:column;}
    .nav{width:100%;flex-direction:row;align-items:center;overflow-x:auto;}
    .nav .marca{padding:6px 12px 6px 0;}
    .nav .rodape{display:none;}
    .principal{padding:18px;}
    .grade-2{grid-template-columns:1fr;}
    .btn-sair-mobile{
      display:block;position:fixed;top:10px;right:10px;z-index:50;
      background:var(--erro);color:#fff;border:none;border-radius:99px;
      padding:8px 16px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25);
      cursor:pointer;
    }
  }
  .tabela-compacta{font-size:11.5px;}
  .tabela-compacta thead th{padding:7px 8px;font-size:10px;white-space:nowrap;}
  .tabela-compacta tbody td{padding:6px 8px;line-height:1.35;}
  .tabela-compacta .pill{font-size:10px;padding:1px 7px;}
</style>
</head>

// Data de "hoje" no fuso horário LOCAL do navegador — nunca usar new Date().toISOString()
// pra isso, pois toISOString() converte pra UTC e pode "pular" pro dia seguinte à noite
// (ex: 21h no horário de Brasília já é 00h em UTC), fazendo hoje parecer amanhã.
function hojeISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Mesma ideia de hojeISO(), mas pra converter um Date qualquer (não só "agora") — usado em
// laços que percorrem um intervalo de datas dia a dia.
function dataObjParaISO(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function tratarLinkConvite(){
  const hash = window.location.hash;
  if(hash.includes('access_token')){
    const params = new URLSearchParams(hash.slice(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    const type = params.get('type');
    if(access_token && (type === 'invite' || type === 'recovery' || type === 'signup')){
      await supabase.auth.setSession({ access_token, refresh_token });
      history.replaceState(null, '', window.location.pathname);
      return type;
    }
  }
  return null;
}

async function carregarPerfil(userId){
  const { data, error } = await supabase.from('perfis').select('*').eq('id', userId).single();
  if(error) return null;
  return data;
}

async function iniciar(){
  raiz.innerHTML = `<div class="carregando"><div class="spinner"></div>Carregando…</div>`;
  const tipoLink = await tratarLinkConvite();
  const { data: { session } } = await supabase.auth.getSession();
  ESTADO.sessao = session;

  if(session){
    ESTADO.perfil = await carregarPerfil(session.user.id);
  }

  if(tipoLink && session){
    renderizarDefinirSenha(tipoLink === 'recovery');
    return;
  }
  if(!session){
    renderizarLogin();
    return;
  }
  if(!ESTADO.perfil || ESTADO.perfil.status !== 'ativo'){
    renderizarSemAcesso();
    return;
  }
  await carregarDadosBase();
  renderizarApp();
}

supabase.auth.onAuthStateChange((evento) => {
  if(evento === 'SIGNED_OUT'){ ESTADO = {...ESTADO, sessao:null, perfil:null, carregado:false}; renderizarLogin(); }
});

        <button class="botao terracota" type="submit" id="btn-troca-senha">Salvar nova senha</button>
      </form>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('form-troca-senha').addEventListener('submit', async (e) => {
    e.preventDefault();
    const atual = document.getElementById('senha-atual').value;
    const nova = document.getElementById('senha-nova').value;
    const conf = document.getElementById('senha-nova-conf').value;
    const msg = document.getElementById('msg-troca-senha');
    const btn = document.getElementById('btn-troca-senha');
    if(nova !== conf){
      msg.innerHTML = `<div class="msg-erro">As senhas novas não coincidem.</div>`;
      return;
    }
    btn.disabled = true; btn.textContent = 'Salvando…';

    // reautentica com a senha atual antes de trocar, por segurança
    const { error: erroLogin } = await supabase.auth.signInWithPassword({ email: ESTADO.perfil.email, password: atual });
    if(erroLogin){
      msg.innerHTML = `<div class="msg-erro">Senha atual incorreta.</div>`;
      btn.disabled = false; btn.textContent = 'Salvar nova senha';
      return;
    }
    const { error } = await supabase.auth.updateUser({ password: nova });
    if(error){
      msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Salvar nova senha';
      return;
    }
    msg.innerHTML = `<div class="msg-ok">Senha atualizada com sucesso.</div>`;
    setTimeout(() => modal.remove(), 1400);
  });
}

function categoriaEnsinoTurma(turma){
  const nome = (turma?.nome || '').toUpperCase();
  const ensino = (turma?.ensino || '').toUpperCase();
  if(ensino.includes('INFANTIL') || /GRUPO\s*(IV|V|4|5)\b/.test(nome)) return 'infantil';
  const base = extrairSerie(turma?.nome || '').toUpperCase();
  const m = base.match(/^(\d+)º/);
  if(m){
    const n = parseInt(m[1], 10);
    if(n>=1 && n<=5) return 'iniciais';
    if(n>=6 && n<=9) return 'finais';
  }
  return 'outro';
}

function ordemCronologicaTurma(nomeTurma){
  const base = extrairSerie(nomeTurma || '').toUpperCase();
  if(/GRUPO\s*(IV|4)\b/.test(base)) return 4;
  if(/GRUPO\s*(V|5)\b/.test(base)) return 5;
  const m = base.match(/^(\d+)º/);
  if(m) return 10 + parseInt(m[1], 10);
  return 99;
}

  el.innerHTML = `
    <div class="cabecalho-pagina" style="margin-bottom:6px;"><div><h2>Painel geral</h2><p>Ano letivo 2026 · visão consolidada da secretaria</p></div></div>
    <div class="stats-compactas">${statsHtml}</div>
    <div class="grade-painel-geral">
      <div class="painel">
        <div class="barra" style="padding:10px 14px;"><strong style="font-size:13.5px;">Documentos pendentes</strong></div>
        <div id="painel-docs-pendentes" class="lista-pendentes-compacta" style="max-height:${alturaPainelGraficos}px;overflow-y:auto;">
          <p style="padding:14px;color:var(--texto-suave);font-size:13px;">Carregando…</p>
        </div>
      </div>
      <div class="painel">
        <div class="barra" style="padding:10px 14px;"><strong style="font-size:13.5px;">Distribuição dos estudantes</strong></div>
        <div class="grade-graficos" style="padding:10px 12px;">
          <div class="caixa-grafico">
            <h4>Por etapa de ensino</h4>
            <div style="position:relative;height:${alturaGraficoEtapa}px;"><canvas id="grafico-etapa"></canvas></div>
          </div>
          <div class="caixa-grafico">
            <h4>Estudantes por turma</h4>
            <div style="height:${alturaPainelGraficos}px;overflow-y:auto;">
              <div style="position:relative;height:${alturaBarrasTurmas}px;"><canvas id="grafico-turmas"></canvas></div>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  carregarDocsPendentesPainel();

  if(graficoEtapaChart){ graficoEtapaChart.destroy(); graficoEtapaChart = null; }
  if(graficoTurmasChart){ graficoTurmasChart.destroy(); graficoTurmasChart = null; }

  // plugin simples para escrever a quantidade no fim de cada barra horizontal
  const pluginRotuloBarra = {
    id: 'rotuloBarra',
    afterDatasetsDraw(chart){
      const { ctx } = chart;
      chart.data.datasets.forEach((dataset, dsIndex) => {
        const meta = chart.getDatasetMeta(dsIndex);
        meta.data.forEach((barra, i) => {
          const valor = dataset.data[i];
          ctx.save();
          ctx.fillStyle = '#182635';
          ctx.font = '700 13px Arial';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(valor, barra.x + 8, barra.y);
          ctx.restore();
        });
      });
    },
  };

  // escurece uma cor hex por um fator (para simular a sombra lateral do gráfico 3D)
  function escurecerCor(hex, fator){
    const c = (hex || '#999999').replace('#','');
    const r = Math.round(parseInt(c.substring(0,2),16) * fator);
    const g = Math.round(parseInt(c.substring(2,4),16) * fator);
    const b = Math.round(parseInt(c.substring(4,6),16) * fator);
    return `rgb(${r},${g},${b})`;
  }

  // plugin que desenha a "lateral" extrudada de cada fatia, simulando um gráfico de pizza 3D
  const profundidadePizza3D = 11;
  const pluginPizza3D = {
    id: 'pizza3d',
    beforeDatasetsDraw(chart){
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      const dataset = chart.data.datasets[0];
      for(let camada = profundidadePizza3D; camada >= 1; camada--){
        meta.data.forEach((arco, i) => {
          const valor = dataset.data[i];
          if(!valor) return;
          const { x, y, startAngle, endAngle, outerRadius } = arco.getProps(
            ['x','y','startAngle','endAngle','outerRadius'], true
          );
          ctx.save();
          ctx.beginPath();
          ctx.fillStyle = escurecerCor(dataset.backgroundColor[i], 0.62);
          ctx.moveTo(x, y + camada);
          ctx.arc(x, y + camada, outerRadius, startAngle, endAngle);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        });
      }
    },
  };

  // plugin para destacar o percentual dentro de cada fatia da pizza
  const pluginPercentualRosca = {
    id: 'percentualRosca',
    afterDatasetsDraw(chart){
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      const dataset = chart.data.datasets[0];
      const totalGeral = dataset.data.reduce((a,b) => a+b, 0) || 1;
      meta.data.forEach((arco, i) => {
        const valor = dataset.data[i];
        if(!valor) return;
        const pct = ((valor / totalGeral) * 100).toFixed(1).replace('.', ',');
        const { x, y, startAngle, endAngle, outerRadius } = arco.getProps(
          ['x','y','startAngle','endAngle','outerRadius'], true
        );
        const anguloMeio = (startAngle + endAngle) / 2;
        const raioMeio = outerRadius * 0.62;
        const px = x + Math.cos(anguloMeio) * raioMeio;
        const py = y + Math.sin(anguloMeio) * raioMeio;
        ctx.save();
        ctx.font = '800 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.miterLimit = 2;
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000000';
        ctx.strokeText(`${pct}%`, px, py);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`${pct}%`, px, py);
        ctx.restore();
      });
    },
  };

  const ctxEtapa = document.getElementById('grafico-etapa');
  if(ctxEtapa){
    graficoEtapaChart = new Chart(ctxEtapa, {
      type: 'pie',
      data: {
        labels: ['Ed. Infantil','Anos Iniciais','Anos Finais'],
        datasets: [{ data: [infantil, anosIniciais, anosFinais], backgroundColor: ['#FFC300','#E63946','#1E88E5'], borderWidth:0, radius:'82%' }],
      },
      plugins:[pluginPizza3D, pluginPercentualRosca],
      options: {
        maintainAspectRatio:false,
        layout:{ padding:{ bottom: profundidadePizza3D + 18, top: 4 } },
        plugins:{
          legend:{
            position:'bottom', align:'start',
            labels:{
              boxWidth:13, font:{ size:13, weight:'bold' }, padding:11,
              generateLabels(chart){
                const dataset = chart.data.datasets[0];
                const totalGeral = dataset.data.reduce((a,b) => a+b, 0) || 1;
                return chart.data.labels.map((label, i) => {
                  const valor = dataset.data[i];
                  const pct = ((valor / totalGeral) * 100).toFixed(1).replace('.', ',');
                  return {
                    text: `${label}: ${valor} (${pct}%)`,
                    fillStyle: dataset.backgroundColor[i],
                    strokeStyle: dataset.backgroundColor[i],
                    hidden: false,
                    index: i,
                  };
                });
              },
            },
          },
        },
      },
    });
  }
  const maiorValorTurma = Math.max(1, ...turmasOrdenadas.map(t => t.total));
  const folgaEixoTurmas = Math.ceil((maiorValorTurma * 1.25) / 5) * 5;

  const ctxTurmas = document.getElementById('grafico-turmas');
  if(ctxTurmas){
    graficoTurmasChart = new Chart(ctxTurmas, {
      type: 'bar',
      data: {
        labels: turmasOrdenadas.map(t => t.rotulo),
        datasets: [{ data: turmasOrdenadas.map(t => t.total), backgroundColor: '#2E6BB8', borderRadius:4 }],
      },
      options: {
        indexAxis: 'y',
        maintainAspectRatio:false,
        layout:{ padding:{ right:12, left:4 } },
        plugins:{ legend:{ display:false } },
        scales:{
          x:{ suggestedMax: folgaEixoTurmas, ticks:{ font:{ size:12.5 }, precision:0 }, grid:{ color:'#EFEBE0' } },
          y:{ ticks:{ font:{ size:12.5 }, crossAlign:'start', align:'start' }, grid:{ display:false } },
        },
      },
      plugins:[pluginRotuloBarra],
    });
  }
}

function renderizarCadastro(el){
  const podeDiasLetivos = ESTADO.perfil.role === 'admin' || ESTADO.perfil.role === 'secretaria';
  if(ESTADO.subCadastro === 'dias_letivos' && !podeDiasLetivos) ESTADO.subCadastro = 'alunos';
  const abas = [

    ...(podeDiasLetivos ? [{ id:'dias_letivos', label:'Dias Letivos' }] : []),
    { id:'arquivo_morto', label:'Arquivo Inativo' },
  ];
  const barra = abas.map(a => `<button class="aba-cadastro ${ESTADO.subCadastro===a.id?'ativa':''}" data-aba="${a.id}">${a.label}</button>`).join('');
  el.innerHTML = `<div class="subtabs">${barra}</div><div id="conteudo-cadastro"></div>`;

  if(ESTADO.subCadastro === 'turmas') renderizarTurmas(alvo);

  else if(ESTADO.subCadastro === 'arquivo_morto') renderizarArquivoMorto(alvo);
  else renderizarAlunos(alvo);
}

const RESPONSAVEL_ROTULOS = { mae: 'Mãe', pai: 'Pai', responsavel: 'Responsável', avo: 'Avó/Avô', outro: 'Outro' };

async function exportarAlunosSelecionadosXLSX(btn){
  const msg = document.getElementById('msg-export-alunos');
  const idsSelecionados = ESTADO.alunosSelecionadosExport;
  if(!idsSelecionados.length) return;
  btn.disabled = true; btn.textContent = 'Gerando planilha…';
  if(msg) msg.innerHTML = '';
  try{
    const { data: vinculos, error } = await supabase.from('aluno_responsavel')
      .select('aluno_id, tipo, principal, responsaveis(nome, telefone)')
      .in('aluno_id', idsSelecionados);
    if(error) throw error;

    const responsaveisPorAluno = {};
    (vinculos || []).forEach(v => {
      if(!responsaveisPorAluno[v.aluno_id]) responsaveisPorAluno[v.aluno_id] = [];
      responsaveisPorAluno[v.aluno_id].push(v);
    });

    const linhas = idsSelecionados.map(id => {
      const a = ESTADO.alunos.find(x => x.id === id);
      if(!a) return null;
      const respAluno = (responsaveisPorAluno[id] || []).sort((x,y) => (y.principal?1:0) - (x.principal?1:0));
      const filiacao = respAluno.map(v => `${v.responsaveis?.nome || ''} (${RESPONSAVEL_ROTULOS[v.tipo] || v.tipo})`).filter(t => t.trim().length > 3).join(' / ');
      const endereco = [a.endereco, a.numero, a.bairro, [a.cidade, a.uf].filter(Boolean).join('/'), a.cep ? `CEP ${a.cep}` : null]
        .filter(Boolean).join(', ');
      const telefone = a.telefone || respAluno.find(v => v.responsaveis?.telefone)?.responsaveis?.telefone || '';
      return {
        'Nome completo': a.nome || '',
        'Filiação / Responsável': filiacao,
        'Data de Nascimento': fmtData(a.data_nascimento) || '',
        'CPF': a.cpf || '',
        'Endereço': endereco,
        'Telefone para contato': telefone,
      };
    }).filter(Boolean);

    const XLSX = await import('https://esm.sh/xlsx@0.18.5');
    const planilha = XLSX.utils.json_to_sheet(linhas);
    planilha['!cols'] = [{wch:32},{wch:34},{wch:16},{wch:16},{wch:44},{wch:20}];
    const livro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(livro, planilha, 'Estudantes');
    const nomeArquivo = `dados-estudantes-${hojeISO()}.xlsx`;
    XLSX.writeFile(livro, nomeArquivo);

    if(msg) msg.innerHTML = `<div class="msg-ok" style="margin:0;">Planilha gerada com ${linhas.length} estudante(s).</div>`;
  } catch(err){
    if(msg) msg.innerHTML = `<div class="msg-erro" style="margin:0;">Erro ao gerar planilha: ${esc(err.message || String(err))}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '📊 Exportar planilha (.xlsx)';
  }
}

function alunosFiltrados(){
  const busca = ESTADO.buscaAlunos.trim().toLowerCase();
  return ESTADO.alunos.filter(a => {
    if(ESTADO.filtroTurma && a.turma_id !== ESTADO.filtroTurma) return false;
    if(ESTADO.filtroSituacao && (a.situacao||'matriculado') !== ESTADO.filtroSituacao) return false;
    if(busca && !a.nome.toLowerCase().includes(busca) && !(a.cpf||'').includes(busca)) return false;
    return true;
  });
}

      <div style="font-size:13px;color:var(--texto-suave);">

      </div>

    <div class="painel">

      const conjunto = new Set(ESTADO.alunosSelecionadosExport);

    const btnLimparSelecao = document.getElementById('btn-limpar-selecao-export');

    const btnExportarAlunos = document.getElementById('btn-exportar-alunos');
    if(btnExportarAlunos) btnExportarAlunos.addEventListener('click', () => exportarAlunosSelecionadosXLSX(btnExportarAlunos));

  el.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', (e) => {
    if(e.target.closest('[data-editar-aluno], [data-excluir-aluno], .chk-exportar-aluno')) return;
    abrirFichaAluno(tr.dataset.id);

  el.querySelectorAll('[data-editar-aluno]').forEach(b => b.addEventListener('click', () => {
    abrirModalAluno(ESTADO.alunos.find(a => a.id === b.dataset.editarAluno));
  }));
  el.querySelectorAll('[data-excluir-aluno]').forEach(b => b.addEventListener('click', async () => {

    const { error } = await supabase.from('alunos').delete().eq('id', b.dataset.excluirAluno);
    if(error){ alert('Erro ao excluir: ' + error.message); return; }
    await carregarDadosBase();
    renderizarApp();
  }));
}

async function carregarMunicipios(uf, municipioAtual){
  const selectNat = document.getElementById('ed-naturalidade');
  if(!selectNat) return;
  if(!uf){
    selectNat.innerHTML = `<option value="">Selecione a UF primeiro</option>`;
    selectNat.disabled = true;
    return;
  }
  selectNat.disabled = true;
  selectNat.innerHTML = `<option value="">Carregando…</option>`;
  try{
    const resp = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios`);
    const municipios = await resp.json();
    const nomeAtualNorm = (municipioAtual||'').trim().toUpperCase();
    const encontrado = municipios.some(m => m.nome.toUpperCase() === nomeAtualNorm);
    let opcoes = `<option value="">—</option>`;
    if(municipioAtual && !encontrado){
      opcoes += `<option value="${esc(municipioAtual)}" selected>${esc(municipioAtual)}</option>`;
    }
    opcoes += municipios.map(m => `<option value="${esc(m.nome.toUpperCase())}" ${m.nome.toUpperCase()===nomeAtualNorm?'selected':''}>${esc(m.nome)}</option>`).join('');
    selectNat.innerHTML = opcoes;
    selectNat.disabled = false;
  } catch(err){
    selectNat.innerHTML = `<option value="${esc(municipioAtual||'')}" selected>${esc(municipioAtual || 'Erro ao carregar municípios')}</option>`;
    selectNat.disabled = false;
  }
}

function cpfValido(cpf){
  cpf = (cpf || '').replace(/\D/g, '');
  if(cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let soma = 0;
  for(let i = 0; i < 9; i++) soma += parseInt(cpf[i], 10) * (10 - i);
  let resto = (soma * 10) % 11;
  if(resto === 10 || resto === 11) resto = 0;
  if(resto !== parseInt(cpf[9], 10)) return false;
  soma = 0;
  for(let i = 0; i < 10; i++) soma += parseInt(cpf[i], 10) * (11 - i);
  resto = (soma * 10) % 11;
  if(resto === 10 || resto === 11) resto = 0;
  return resto === parseInt(cpf[10], 10);
}

async function buscarCep(cep){
  const msg = document.getElementById('msg-cep');
  const cepLimpo = (cep || '').replace(/\D/g, '');
  if(cepLimpo.length !== 8){ if(msg) msg.textContent = ''; return; }
  if(msg) msg.textContent = 'Buscando…';
  try{
    const resp = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
    const dados = await resp.json();
    if(dados.erro){
      if(msg) msg.textContent = 'CEP não encontrado.';
      return;
    }
    const campoEndereco = document.getElementById('ed-endereco');
    const campoBairro = document.getElementById('ed-bairro');
    const campoCidade = document.getElementById('ed-cidade');
    const campoUf = document.getElementById('ed-uf');
    if(campoEndereco && !campoEndereco.value.trim()) campoEndereco.value = dados.logradouro || '';
    if(campoBairro) campoBairro.value = dados.bairro || '';
    if(campoCidade) campoCidade.value = dados.localidade || '';
    if(campoUf) campoUf.value = dados.uf || '';
    if(msg) msg.textContent = '';
  } catch(err){
    if(msg) msg.textContent = 'Não foi possível buscar o CEP.';
  }
}

  document.getElementById('ed-doenca').addEventListener('change', (e) => {

  document.getElementById('ed-transporte').addEventListener('change', (e) => {

      nome_mae: document.getElementById('ed-mae').value.trim() || null,

    if(error){ msgAM.innerHTML = `<div class="msg-erro" style="margin-bottom:10px;">${esc(error.message)}</div>`; btnAM.disabled = false; btnAM.textContent = 'Cadastrar no Arquivo Inativo'; return; }

      document.getElementById('ed-cpf').focus();
      return;

      nome: document.getElementById('ed-nome').value.trim(),
      nome_social: campoTexto('ed-nome-social'),
      turma_id: document.getElementById('ed-turma').value || null,
      situacao: document.getElementById('ed-situacao').value,
      data_situacao: ['transferido','cancelado'].includes(document.getElementById('ed-situacao').value) ? (document.getElementById('ed-data-situacao').value || null) : null,
      ensino: campoTexto('ed-ensino'),
      turno: document.getElementById('ed-turno').value || null,
      data_nascimento: document.getElementById('ed-nascimento').value || null,
      sexo: document.getElementById('ed-sexo').value || null,
      cor_raca: document.getElementById('ed-cor').value || null,

      uf_naturalidade: campoTexto('ed-uf-nat'),

      rg: campoTexto('ed-rg'),
      rg_orgao_emissor: campoTexto('ed-rg-orgao'),
      rg_data_expedicao: document.getElementById('ed-rg-data').value || null,
      rg_uf: campoTexto('ed-rg-uf'),
      cert_nascimento_numero: campoTexto('ed-cert-numero'),
      cert_nascimento_folha: campoTexto('ed-cert-folha'),
      cert_nascimento_livro: campoTexto('ed-cert-livro'),
      cert_nascimento_data: document.getElementById('ed-cert-data').value || null,
      cert_nascimento_cartorio: campoTexto('ed-cert-cartorio'),
      sus: campoTexto('ed-sus'),
      nis: campoTexto('ed-nis'),
      codigo_educacenso: campoTexto('ed-educacenso'),
      endereco: campoTexto('ed-endereco'),
      numero: campoTexto('ed-numero'),
      bairro: campoTexto('ed-bairro'),
      zona: campoTexto('ed-zona'),
      cidade: campoTexto('ed-cidade'),
      cep: campoTexto('ed-cep'),
      uf: campoTexto('ed-uf'),
      telefone: campoTexto('ed-telefone'),
      email: campoTexto('ed-email'),
      fator_rh: campoTexto('ed-rh'),
      alergia: document.getElementById('ed-alergia').value || null,
      descricao_alergia: document.getElementById('ed-alergia').value === 'Sim' ? (document.getElementById('ed-descricao-alergia').value.trim() || null) : null,
      diabetes: document.getElementById('ed-diabetes').value || null,
      hipertensao: document.getElementById('ed-hipertensao').value || null,
      transtorno: document.getElementById('ed-transtorno').value || null,
      superdotacao: document.getElementById('ed-superdotacao').value || null,
      doenca: document.getElementById('ed-doenca').value || null,
      descricao_doenca: document.getElementById('ed-doenca').value === 'Sim' ? (document.getElementById('ed-descricao-doenca').value.trim() || null) : null,
      data_matricula: document.getElementById('ed-data-matricula').value || null,
      aee: document.getElementById('ed-aee').checked,
      descricao_aee: document.getElementById('ed-aee').checked ? (Array.from(document.querySelectorAll('.cid-aee:checked')).map(c => c.value).join(', ') || null) : null,
      cids_aee: document.getElementById('ed-aee').checked ? Array.from(document.querySelectorAll('.cid-aee:checked')).map(c => c.value) : [],
      bolsa_familia: document.getElementById('ed-bolsa').checked,
      transporte_escolar: document.getElementById('ed-transporte').value || null,
      transporte_rota: document.getElementById('ed-transporte').value === 'Sim' ? (document.getElementById('ed-transporte-rota').value.trim() || null) : null,
      autoriza_uso_imagem: document.getElementById('ed-autoriza-imagem').value || null,
      autorizacao_saida: document.getElementById('ed-autoriza-saida').value || null,
      autorizacao_saida_nome: document.getElementById('ed-autoriza-saida').value === 'Sim' ? (document.getElementById('ed-autoriza-saida-nome').value.trim() || null) : null,
      tamanho_blusa: document.getElementById('ed-tam-blusa').value || null,
      tamanho_short: document.getElementById('ed-tam-short').value || null,
      tamanho_calcado: document.getElementById('ed-tam-calcado').value || null,
      doc_certidao_rg_cpf: document.getElementById('doc-certidao').checked,
      doc_transferencia: document.getElementById('doc-transferencia').checked,
      doc_comprovante_residencia: document.getElementById('doc-comprovante').checked,
      doc_rg_pais_cartao_vacina: document.getElementById('doc-rg-pais').checked,
      doc_fator_rh: document.getElementById('doc-fator-rh').checked,
      doc_foto_3x4: document.getElementById('doc-foto').checked,
      doc_laudo_medico: document.getElementById('doc-laudo').checked,
      doc_outros: document.getElementById('doc-outros').checked ? (document.getElementById('doc-outros-texto').value.trim() || null) : null,
    };
    const nomeMae = document.getElementById('ed-mae').value.trim();
    const telMae = document.getElementById('ed-mae-tel').value.trim() || null;
    const nomePai = document.getElementById('ed-pai').value.trim();
    const telPai = document.getElementById('ed-pai-tel').value.trim() || null;
    const nomeResp = document.getElementById('ed-resp').value.trim();
    const telResp = document.getElementById('ed-resp-tel').value.trim() || null;
    const btn = document.getElementById('btn-salvar-aluno');
    btn.disabled = true; btn.textContent = 'Salvando…';

    let alunoId = editando ? a.id : null;
    if(editando){
      const { error } = await supabase.from('alunos').update(dados).eq('id', a.id);
      if(error){
        document.getElementById('msg-editar-aluno').innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
        btn.disabled = false; btn.textContent = 'Salvar alterações';
        return;
      }
    } else {
      const { data: novoAluno, error } = await supabase.from('alunos').insert(dados).select().single();
      if(error){
        document.getElementById('msg-editar-aluno').innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
        btn.disabled = false; btn.textContent = 'Cadastrar estudante';
        return;
      }
      alunoId = novoAluno.id;
    }

    async function salvarResponsavel(nome, telefone, vinculoId, tipo, profissao, cpf, rg){
      if(!nome) return;
      if(vinculoId){
        await supabase.from('responsaveis').update({ nome, telefone, profissao, cpf, rg }).eq('id', vinculoId);
      } else {
        const { data: novoResp } = await supabase.from('responsaveis').insert({ nome, telefone, profissao, cpf, rg }).select().single();
        if(novoResp) await supabase.from('aluno_responsavel').insert({ aluno_id: alunoId, responsavel_id: novoResp.id, tipo, principal: tipo === 'mae' });
      }
    }
    await salvarResponsavel(nomeMae, telMae, vinculoMaeId, 'mae', document.getElementById('ed-mae-profissao').value.trim() || null, document.getElementById('ed-mae-cpf').value.trim() || null, document.getElementById('ed-mae-rg').value.trim() || null);
    await salvarResponsavel(nomePai, telPai, vinculoPaiId, 'pai', document.getElementById('ed-pai-profissao').value.trim() || null, document.getElementById('ed-pai-cpf').value.trim() || null, document.getElementById('ed-pai-rg').value.trim() || null);
    await salvarResponsavel(nomeResp, telResp, vinculoRespId, 'responsavel_legal', null, document.getElementById('ed-resp-cpf').value.trim() || null, document.getElementById('ed-resp-rg').value.trim() || null);

    const arquivoFoto = document.getElementById('ed-foto').files[0];
    if(arquivoFoto){
      const extensao = arquivoFoto.name.split('.').pop();
      const caminho = `${alunoId}/foto.${extensao}`;
      const { error: erroUpload } = await supabase.storage.from('fotos-estudantes').upload(caminho, arquivoFoto, { upsert: true });
      if(!erroUpload){
        const { data: urlAssinada } = await supabase.storage.from('fotos-estudantes').createSignedUrl(caminho, EXPIRACAO_LINK_STORAGE);
        if(urlAssinada) await supabase.from('alunos').update({ foto_url: urlAssinada.signedUrl }).eq('id', alunoId);
      }
    }

    modal.remove();
    await carregarDadosBase();
    renderizarApp();
  });
}

function preservarFoco(id){ const campo = document.getElementById(id); if(campo){ const v = campo.value; campo.focus(); campo.value=''; campo.value=v; } }

function situacaoPill(s){
  if(s === 'matriculado') return '<span class="pill azul">Matriculado</span>';
  if(s === 'transferido') return '<span class="pill cinza">Transferido</span>';
  if(s === 'cancelado') return '<span class="pill vermelho">Cancelado</span>';
  return '<span class="pill cinza">—</span>';
}

function tipoLabel(t){
  if(t === 'mae') return 'Mãe';
  if(t === 'pai') return 'Pai';
  if(t === 'responsavel_legal') return 'Responsável legal';
  return 'Outro';
}

async function abrirFichaAluno(id){
  const a = ESTADO.alunos.find(x => x.id === id);
  if(!a) return;
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-topo">
        <div style="display:flex;gap:14px;align-items:center;">
          ${a.foto_url ? `<img src="${esc(a.foto_url)}" style="width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--borda);flex-shrink:0;" />` : ''}
          <div><h3>${esc(a.nome)}</h3><p style="color:var(--texto-suave);font-size:13px;margin-top:2px;">${esc(a.turmas?.nome||'—')} · ${esc(a.turmas?.turno||a.turno||'—')}</p></div>

        <button data-fechar>✕</button>

      <div class="ficha-linha"><span>CPF</span><span>${esc(a.cpf||'—')}</span></div>
      <div class="ficha-linha"><span>Sexo</span><span>${rotuloSexo(a.sexo)}</span></div>
      <div class="ficha-linha"><span>Naturalidade</span><span>${esc(a.naturalidade||'—')}${a.uf_naturalidade?'/'+esc(a.uf_naturalidade):''}</span></div>
      <div class="ficha-linha"><span>Matrícula</span><span>${fmtData(a.data_matricula)}</span></div>
      <div class="secao-titulo">Endereço e contato</div>
      <div class="ficha-linha"><span>Endereço</span><span>${esc(a.endereco||'—')}${a.numero?', '+esc(a.numero):''}</span></div>
      <div class="ficha-linha"><span>Bairro / CEP</span><span>${esc(a.bairro||'—')} · ${esc(a.cep||'—')}</span></div>
      <div class="ficha-linha"><span>Telefone</span><span>${esc(a.telefone||'—')}</span></div>
      <div class="secao-titulo">Saúde e necessidades</div>
      <div class="ficha-linha"><span>AEE</span><span>${a.aee ? 'Sim' : 'Não'}${a.descricao_aee?' — '+esc(a.descricao_aee):''}</span></div>
      <div class="ficha-linha"><span>Alergia</span><span>${esc(a.alergia||'—')}</span></div>
      <div class="ficha-linha"><span>Fator RH</span><span>${esc(a.fator_rh||'—')}</span></div>
      <div class="ficha-linha"><span>Bolsa Família</span><span>${a.bolsa_familia ? 'Sim' : 'Não'}</span></div>
      <div class="ficha-linha"><span>Autoriza saída sem responsável</span><span>${a.autorizacao_saida === 'Sim' ? ('Sim' + (a.autorizacao_saida_nome ? ' — acompanhado(a) de '+esc(a.autorizacao_saida_nome) : ' — sozinho(a)')) : (a.autorizacao_saida || '—')}</span></div>
      <div class="secao-titulo">Responsáveis</div>
      <div id="ficha-responsaveis"><p style="color:var(--texto-suave);font-size:13px;">Carregando…</p></div>

        <button class="botao secundario pequeno" data-fechar>Fechar</button>
        <button class="botao secundario pequeno" data-imprimir-ficha>🖨️ Imprimir ficha</button>
        <button class="botao secundario pequeno" data-imprimir-autorizacoes>🖨️ Autorizações</button>
        <button class="botao terracota pequeno" data-editar-ficha>Editar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  modal.querySelector('[data-editar-ficha]').addEventListener('click', () => { modal.remove(); abrirModalAluno(a); });
  modal.querySelector('[data-imprimir-ficha]').addEventListener('click', () => imprimirFichaMatricula(a));
  modal.querySelector('[data-imprimir-autorizacoes]').addEventListener('click', () => imprimirAutorizacoes(a));

  const { data: vinculos, error } = await supabase
    .from('aluno_responsavel')
    .select('tipo, principal, responsaveis(nome, telefone, profissao, cpf)')
    .eq('aluno_id', id)
    .order('principal', { ascending: false });

function renderizarTurmas(el){
  const contagem = {};
  ESTADO.alunos.forEach(a => { contagem[a.turma_id] = (contagem[a.turma_id]||0)+1; });
  const ehAdmin = ESTADO.perfil.role === 'admin';
  const linhas = ESTADO.turmas.map(t => `
    <tr data-id="${t.id}">
      <td>${esc(t.nome)}</td>
      <td>${esc(t.ensino||'—')}</td>
      <td>${esc(t.turno||'—')}</td>
      <td>${contagem[t.id]||0} estudante(s)</td>
      <td class="col-acoes">
        <button class="btn-icone" data-editar-turma="${t.id}" title="Editar">✏️</button>
        ${ehAdmin ? `<button class="btn-icone perigo" data-excluir-turma="${t.id}" title="Excluir">🗑️</button>` : ''}
      </td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="cabecalho-pagina">
      <div><h2>Turmas</h2><p>${ESTADO.turmas.length} turmas cadastradas em 2026</p></div>
      <button class="botao terracota pequeno" id="btn-nova-turma">+ Nova turma</button>
    </div>
    <div class="painel">
      <div style="overflow-x:auto;"><table><thead><tr><th>Turma</th><th>Ensino</th><th>Turno</th><th>Estudantes</th><th class="col-acoes"></th></tr></thead><tbody>${linhas}</tbody></table></div>
    </div>`;

function abrirModalEditarTurma(turma){

  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <div class="modal-topo"><h3>${editando ? 'Editar turma' : 'Nova turma'}</h3><button data-fechar>✕</button></div>

      <form id="form-turma">

        <div class="campo"><label>Ensino</label><input type="text" id="turma-ensino" value="${editando ? esc(turma.ensino||'') : ''}" placeholder="Ex: Ensino Fundamental" /></div>
        <div class="campo"><label>Turno</label>
          <select id="turma-turno">
            <option value="MANHÃ" ${editando && turma.turno==='MANHÃ'?'selected':''}>Manhã</option>
            <option value="TARDE" ${editando && turma.turno==='TARDE'?'selected':''}>Tarde</option>
            <option value="NOITE" ${editando && turma.turno==='NOITE'?'selected':''}>Noite</option>
          </select>
        </div>
        <div class="campo"><label>Ano letivo</label><input type="number" id="turma-ano" value="${editando ? turma.ano_letivo : 2026}" /></div>
        <button class="botao terracota" type="submit" id="btn-salvar-turma">${editando ? 'Salvar alterações' : 'Criar turma'}</button>
      </form>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('form-turma').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = document.getElementById('turma-nome').value.trim();
    const ensino = document.getElementById('turma-ensino').value.trim() || null;
    const turno = document.getElementById('turma-turno').value;
    const ano_letivo = parseInt(document.getElementById('turma-ano').value, 10) || 2026;
    const btn = document.getElementById('btn-salvar-turma');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const { error } = editando
      ? await supabase.from('turmas').update({ nome, ensino, turno, ano_letivo }).eq('id', turma.id)
      : await supabase.from('turmas').insert({ nome, ensino, turno, ano_letivo });
    if(error){
      document.getElementById('msg-turma').innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
      btn.disabled = false; btn.textContent = editando ? 'Salvar alterações' : 'Criar turma';
      return;
    }
    modal.remove();
    await carregarDadosBase();
    renderizarApp();
  });
}

const CAPACIDADE_PASTA_ARQUIVO_MORTO = 150;

async function proximoRegistroArquivoMorto(){
  const { data: ultimoPorNumero } = await supabase.from('arquivo_morto').select('numero').order('numero', { ascending:false }).limit(1);
  const numero = (ultimoPorNumero && ultimoPorNumero[0] && ultimoPorNumero[0].numero) ? ultimoPorNumero[0].numero + 1 : 1;

  const { data: ultimoRegistro } = await supabase.from('arquivo_morto').select('pasta').order('created_at', { ascending:false }).limit(1);
  let pastaAtual = ultimoRegistro && ultimoRegistro[0] ? ultimoRegistro[0].pasta : null;
  let numeroPasta = 1;
  if(pastaAtual){
    const m = pastaAtual.match(/(\d+)/);
    if(m) numeroPasta = parseInt(m[1], 10);
    const { count } = await supabase.from('arquivo_morto').select('id', { count:'exact', head:true }).eq('pasta', pastaAtual);
    if((count || 0) >= CAPACIDADE_PASTA_ARQUIVO_MORTO) numeroPasta += 1;
  }
  return { numero, pasta: `PASTA ${numeroPasta}` };
}

async function statusDiasFuncionarios(primeiroDiaMes, ultimoDiaMes, feriadosMes){
  const mapaFeriados = {};
  (feriadosMes||[]).forEach(f => { mapaFeriados[f.data] = f; });
  const { data: registrosMes } = await supabase.from('frequencia_funcionarios').select('funcionario_id, data')
    .gte('data', primeiroDiaMes).lte('data', ultimoDiaMes);
  const { data: feriasMes } = await supabase.from('ferias_funcionarios').select('funcionario_id, data_inicio, data_fim')
    .lte('data_inicio', ultimoDiaMes).gte('data_fim', primeiroDiaMes);
  const { data: convocacoesMes } = await supabase.from('convocacoes_dia_nao_letivo').select('data, funcoes')
    .gte('data', primeiroDiaMes).lte('data', ultimoDiaMes);
  const porDia = {};
  (registrosMes||[]).forEach(r => { (porDia[r.data] = porDia[r.data] || new Set()).add(r.funcionario_id); });

  const ativos = ESTADO.funcionarios.filter(f => f.ativo);
  const [anoIni, mesIni] = primeiroDiaMes.split('-').map(Number);
  const ultimoDiaNum = new Date(anoIni, mesIni, 0).getDate();
  const hojeIso = hojeISO();
  const resultado = {};
  for(let d=1; d<=ultimoDiaNum; d++){
    const iso = `${anoIni}-${String(mesIni).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(iso > hojeIso) continue; // dias futuros não têm status ainda
    const diaSemana = new Date(anoIni, mesIni-1, d).getDay();
    if(diaSemana === 0 || diaSemana === 6) continue; // fim de semana: mantém a cor padrão de não letivo
    const feriado = mapaFeriados[iso];
    if(feriado && (feriado.tipo === 'feriado' || feriado.tipo === 'ponto_facultativo')) continue; // ninguém tem expediente
    const ehRecesso = !!feriado && feriado.tipo === 'recesso';
    const ehSuspensao = !!feriado && feriado.tipo === 'suspensao_aulas';
    const aplicaveis = ativos.filter(f => {
      if(!funcionarioSegueDiaUtil(f) && ehRecesso && !funcionarioConvocadoNoDia(f, iso, convocacoesMes)) return false;
      if(ehSuspensao && !turnoAfetaSuspensao(f.turno, feriado.turno_afetado)) return false;
      if(funcionarioEmFerias(f.id, iso, feriasMes)) return false;
      return true;
    });
    if(!aplicaveis.length) continue;
    const registradosHoje = porDia[iso] || new Set();
    const qtdRegistrados = aplicaveis.filter(f => registradosHoje.has(f.id)).length;
    resultado[iso] = qtdRegistrados === 0 ? 'nenhuma' : (qtdRegistrados === aplicaveis.length ? 'completa' : 'parcial');
  }
  return resultado;
}

async function carregarStatusFrequenciaHoje(){
  const btn = document.getElementById('btn-frequencia-funcionarios');
  if(!btn) return;
  btn.classList.remove('status-verde','status-laranja','status-vermelho');
  const hoje = hojeISO();
  const diaSemana = new Date(hoje + 'T00:00:00').getDay();
  if(diaSemana === 0 || diaSemana === 6){ btn.title = 'Fim de semana — sem expediente'; return; }

  const { data: feriadoHoje } = await supabase.from('feriados').select('*').eq('data', hoje).maybeSingle();
  if(feriadoHoje && (feriadoHoje.tipo === 'feriado' || feriadoHoje.tipo === 'ponto_facultativo')){
    btn.title = 'Feriado/Ponto Facultativo — sem expediente';
    return;
  }
  const ehRecesso = !!feriadoHoje && feriadoHoje.tipo === 'recesso';
  const ehSuspensao = !!feriadoHoje && feriadoHoje.tipo === 'suspensao_aulas';
  const ativos = ESTADO.funcionarios.filter(f => f.ativo);
  const { data: feriasHoje } = await supabase.from('ferias_funcionarios').select('funcionario_id, data_inicio, data_fim').lte('data_inicio', hoje).gte('data_fim', hoje);
  const { data: convocacoesHoje } = await supabase.from('convocacoes_dia_nao_letivo').select('data, funcoes').eq('data', hoje);
  const aplicaveis = ativos.filter(f => {
    if(!funcionarioSegueDiaUtil(f) && ehRecesso && !funcionarioConvocadoNoDia(f, hoje, convocacoesHoje)) return false;
    if(ehSuspensao && !turnoAfetaSuspensao(f.turno, feriadoHoje.turno_afetado)) return false;
    if(funcionarioEmFerias(f.id, hoje, feriasHoje)) return false;
    return true;
  });
  if(!aplicaveis.length){ btn.title = 'Sem funcionários com expediente hoje'; return; }

  const { data: registrosHoje } = await supabase.from('frequencia_funcionarios').select('funcionario_id').eq('data', hoje);
  const registrados = new Set((registrosHoje||[]).map(r => r.funcionario_id));
  const qtd = aplicaveis.filter(f => registrados.has(f.id)).length;

  if(qtd === 0){ btn.classList.add('status-vermelho'); btn.title = 'Nenhuma chamada realizada hoje'; }
  else if(qtd === aplicaveis.length){ btn.classList.add('status-verde'); btn.title = 'Frequência de hoje atualizada'; }
  else { btn.classList.add('status-laranja'); btn.title = `Frequência de hoje incompleta (${qtd} de ${aplicaveis.length})`; }
}
