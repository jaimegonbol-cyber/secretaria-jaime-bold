function formatarDataBR(iso){
  const [ano, mes, dia] = iso.split('-');
  return `${dia}/${mes}/${ano}`;
}

// ---------------------------------------------------------------
// Seletor de data customizado (calendário colorido: azul = não letivo,
// verde = dias letivos até hoje, branco = datas futuras)
// ---------------------------------------------------------------
const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SELETORES_DATA = {};

/**
 * containerId: id de um <div> vazio onde o seletor será montado.
 * dataInicialIso: valor inicial (pode ser '' para campo vazio/opcional).
 * onSelecionar: callback(novoIso) chamado quando o usuário escolhe/limpa uma data.
 * opcoes:
 *   inputId       -> se informado, cria um <input type="hidden"> com esse id, sincronizado
 *                     (permite que o restante do formulário continue lendo o valor por getElementById(id).value)
 *   permiteLimpar -> mostra botão "Limpar" no popup (padrão: false)
 *   rotuloVazio   -> texto exibido quando não há data selecionada
 * Retorna um controlador { definir(iso), obter() } também acessível via SELETORES_DATA[containerId].
 */
function criarSeletorData(containerId, dataInicialIso, onSelecionar, opcoes){
  opcoes = opcoes || {};
  const container = document.getElementById(containerId);
  if(!container) return;
  const permiteLimpar = !!opcoes.permiteLimpar;
  const rotuloVazio = opcoes.rotuloVazio || 'Selecione a data';
  let dataSelecionada = dataInicialIso || '';
  const base = dataSelecionada || new Date().toISOString().slice(0,10);
  const [anoIni, mesIni] = base.split('-').map(Number);
  let mesExibido = mesIni; // 1-12
  let anoExibido = anoIni;
  let aberto = false;

  container.innerHTML = `
    ${opcoes.inputId ? `<input type="hidden" id="${opcoes.inputId}" value="${dataSelecionada}" />` : ''}
    <div class="seletor-data-campo" id="${containerId}-campo">
      <span id="${containerId}-label">${dataSelecionada ? formatarDataBR(dataSelecionada) : rotuloVazio}</span>
      <span>📅</span>
    </div>
    <div class="calendario-popup" id="${containerId}-popup" style="display:none;"></div>`;

  const campo = document.getElementById(`${containerId}-campo`);
  const popup = document.getElementById(`${containerId}-popup`);
  const label = document.getElementById(`${containerId}-label`);

  function aplicarValor(iso){
    dataSelecionada = iso || '';
    if(opcoes.inputId){
      const inputOculto = document.getElementById(opcoes.inputId);
      if(inputOculto){
        inputOculto.value = dataSelecionada;
        inputOculto.dispatchEvent(new Event('change', { bubbles:true }));
      }
    }
    label.textContent = dataSelecionada ? formatarDataBR(dataSelecionada) : rotuloVazio;
  }

  async function renderizarPopup(){
    const primeiroDiaMes = `${anoExibido}-${String(mesExibido).padStart(2,'0')}-01`;
    const ultimoDiaNum = new Date(anoExibido, mesExibido, 0).getDate();
    const ultimoDiaMes = `${anoExibido}-${String(mesExibido).padStart(2,'0')}-${String(ultimoDiaNum).padStart(2,'0')}`;
    const { data: feriadosMes } = await supabase.from('feriados').select('data, tipo, descricao').gte('data', primeiroDiaMes).lte('data', ultimoDiaMes);
    const setFeriados = new Set((feriadosMes||[]).map(f => f.data));

    let setChamadaFeita = null;
    if(opcoes.turmaId){
      const { data: chamadasMes } = await supabase.from('frequencia').select('data')
        .eq('turma_id', opcoes.turmaId).gte('data', primeiroDiaMes).lte('data', ultimoDiaMes);
      setChamadaFeita = new Set((chamadasMes||[]).map(f => f.data));
    }

    let mapaStatusDias = null;
    if(opcoes.statusDiasFn){
      mapaStatusDias = await opcoes.statusDiasFn(primeiroDiaMes, ultimoDiaMes, feriadosMes||[]);
    }

    const hojeIso = new Date().toISOString().slice(0,10);
    const primeiroDiaSemana = new Date(anoExibido, mesExibido-1, 1).getDay(); // 0=domingo
    const celulas = [];
    for(let i=0;i<primeiroDiaSemana;i++) celulas.push(null);
    for(let d=1; d<=ultimoDiaNum; d++) celulas.push(d);

    const diasHtml = celulas.map(d => {
      if(d === null) return `<div class="cal-dia fora-mes"></div>`;
      const iso = `${anoExibido}-${String(mesExibido).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const diaSemana = new Date(anoExibido, mesExibido-1, d).getDay();
      const ehFimDeSemana = diaSemana === 0 || diaSemana === 6;
      const naoLetivo = ehFimDeSemana || setFeriados.has(iso);
      let classe = 'futuro';
      if(naoLetivo){
        classe = 'nao-letivo';
      } else if(mapaStatusDias){
        const status = mapaStatusDias[iso];
        if(status === 'completa') classe = 'chamada-feita';
        else if(status === 'parcial') classe = 'chamada-parcial';
        else if(status === 'nenhuma') classe = 'chamada-pendente';
        else classe = iso <= hojeIso ? 'passado-letivo' : 'futuro';
      } else if(iso <= hojeIso){
        if(setChamadaFeita){
          classe = setChamadaFeita.has(iso) ? 'chamada-feita' : 'chamada-pendente';
        } else {
          classe = 'passado-letivo';
        }
      }
      const extras = [
        iso === hojeIso ? 'hoje' : '',
        iso === dataSelecionada ? 'selecionado' : '',
      ].filter(Boolean).join(' ');
      return `<div class="cal-dia ${classe} ${extras}" data-dia-iso="${iso}">${d}</div>`;
    }).join('');

    popup.innerHTML = `
      <div class="cal-cabecalho">
        <button type="button" class="cal-nav" id="${containerId}-mes-ant">‹</button>
        <strong>${MESES_PT[mesExibido-1]} de ${anoExibido}</strong>
        <button type="button" class="cal-nav" id="${containerId}-mes-prox">›</button>
      </div>
      <div class="cal-semana"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
      <div class="cal-dias">${diasHtml}</div>
      <div class="cal-legenda">
        <span><i class="nao-letivo"></i>Não letivo</span>
        ${mapaStatusDias
          ? `<span><i class="chamada-feita"></i>Atualizada</span><span><i class="chamada-parcial"></i>Incompleta</span><span><i class="chamada-pendente"></i>Nenhuma</span>`
          : setChamadaFeita
          ? `<span><i class="chamada-feita"></i>Chamada feita</span><span><i class="chamada-pendente"></i>Chamada pendente</span>`
          : `<span><i class="passado-letivo"></i>Letivo (até hoje)</span>`}
        <span><i class="futuro"></i>Futuro</span>
      </div>
      ${permiteLimpar ? `<button type="button" class="botao secundario pequeno" id="${containerId}-limpar" style="width:100%;margin-top:10px;">Limpar data</button>` : ''}`;

    document.getElementById(`${containerId}-mes-ant`).addEventListener('click', (e) => {
      e.stopPropagation();
      mesExibido--; if(mesExibido < 1){ mesExibido = 12; anoExibido--; }
      renderizarPopup();
    });
    document.getElementById(`${containerId}-mes-prox`).addEventListener('click', (e) => {
      e.stopPropagation();
      mesExibido++; if(mesExibido > 12){ mesExibido = 1; anoExibido++; }
      renderizarPopup();
    });
    popup.querySelectorAll('[data-dia-iso]').forEach(el2 => el2.addEventListener('click', (e) => {
      e.stopPropagation();
      aplicarValor(el2.dataset.diaIso);
      fecharPopup();
      if(onSelecionar) onSelecionar(dataSelecionada);
    }));
    if(permiteLimpar){
      document.getElementById(`${containerId}-limpar`).addEventListener('click', (e) => {
        e.stopPropagation();
        aplicarValor('');
        fecharPopup();
        if(onSelecionar) onSelecionar('');
      });
    }
  }

  function abrirPopup(){
    aberto = true;
    popup.style.display = '';
    renderizarPopup();
    document.addEventListener('click', fecharAoClicarFora);
  }
  function fecharPopup(){
    aberto = false;
    popup.style.display = 'none';
    document.removeEventListener('click', fecharAoClicarFora);
  }
  function fecharAoClicarFora(e){
    if(!container.contains(e.target)) fecharPopup();
  }

  campo.addEventListener('click', (e) => {
    e.stopPropagation();
    if(aberto) fecharPopup(); else abrirPopup();
  });

  const controlador = {
    definir(iso){ aplicarValor(iso); },
    obter(){ return dataSelecionada; },
  };
  SELETORES_DATA[containerId] = controlador;
  return controlador;
}

function renderizarFrequencia(el){
  const abas = [
    { id:'chamada', label:'Chamada diária' },
    { id:'dias_letivos', label:'Dias letivos' },
    { id:'historico', label:'Histórico' },
  ];
  const barra = abas.map(a => `<button class="aba-cadastro ${ESTADO.subFrequencia===a.id?'ativa':''}" data-aba="${a.id}">${a.label}</button>`).join('');
  el.innerHTML = `
    <div class="cabecalho-pagina" style="margin-bottom:10px;"><div><h2>Frequência</h2><p>Dias letivos e chamada diária dos estudantes</p></div></div>
    <div class="subtabs" style="margin-bottom:10px;">${barra}</div>
    <div id="conteudo-frequencia"></div>`;
  el.querySelectorAll('.aba-cadastro').forEach(b => b.addEventListener('click', () => {
    ESTADO.subFrequencia = b.dataset.aba; renderizarFrequencia(el);
  }));
  const alvo = el.querySelector('#conteudo-frequencia');
  if(ESTADO.subFrequencia === 'chamada') renderizarChamada(alvo);
  else if(ESTADO.subFrequencia === 'historico') renderizarHistoricoFrequencia(alvo);
  else renderizarDiasLetivos(alvo);
}

async function renderizarDiasLetivos(el){
  el.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Carregando…</p>`;
  const ano = ESTADO.diasLetivosAno;
  const podeEditar = ESTADO.perfil.role === 'admin';
  const [{ data }, { data: feriadosData }] = await Promise.all([
    supabase.from('dias_letivos').select('*').eq('ano_letivo', ano),
    supabase.from('feriados').select('*').order('data'),
  ]);
  ESTADO.feriados = feriadosData || [];
  const porMes = {};
  (data||[]).forEach(d => { porMes[d.mes] = d.quantidade_dias; });
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const campos = meses.map((nome, i) => {
    const mes = i+1;
    const valor = porMes[mes] ?? '';
    return `<div class="campo" style="margin-bottom:0;"><label>${nome}</label><input type="number" min="0" max="31" class="dl-mes" data-mes="${mes}" value="${valor}" ${podeEditar?'':'disabled'} /></div>`;
  }).join('');
  const feriadosDoAno = ESTADO.feriados.filter(f => f.data.startsWith(String(ano)));
  const linhasFeriados = feriadosDoAno.map(f => `
    <tr data-id="${f.id}">
      <td>${formatarDataBR(f.data)}</td>
      <td>${f.tipo === 'feriado' ? 'Feriado' : f.tipo === 'ponto_facultativo' ? 'Ponto Facultativo' : 'Recesso Escolar'}</td>
      <td>${esc(f.descricao || '')}</td>
      <td>${ESTADO.perfil.role === 'admin' ? `<button class="botao secundario pequeno" data-remover-feriado="${f.id}" style="width:auto;padding:4px 10px;">Remover</button>` : ''}</td>
    </tr>`).join('');
  el.innerHTML = `
    ${!podeEditar ? `<p style="font-size:12.5px;color:var(--texto-suave);margin:0 0 10px;">Somente o Administrador pode editar os dias letivos e os feriados. Esta tela está em modo de visualização.</p>` : ''}
    <div class="painel">
      <div class="barra" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:10px 14px;">
        <strong style="font-size:14px;">Dias letivos por mês</strong>
        <div style="display:flex;align-items:center;gap:8px;">
          <label style="margin:0;font-size:13px;white-space:nowrap;">Ano letivo</label>
          <input type="number" id="dl-ano" value="${ano}" style="width:90px;padding:6px 8px;border:1px solid var(--borda);border-radius:8px;" />
        </div>
      </div>
      <div style="padding:10px 14px;">
        <div class="grade-2" style="grid-template-columns:repeat(6, 1fr);gap:8px;">
          ${campos}
        </div>
        <div id="msg-dias-letivos" style="margin-top:6px;"></div>
        ${podeEditar ? `<button class="botao terracota pequeno" id="btn-salvar-dias-letivos" style="margin-top:8px;width:auto;">Salvar dias letivos</button>` : ''}
      </div>
    </div>
    <div class="painel" style="margin-top:10px;">
      <div class="barra" style="padding:10px 14px;"><strong style="font-size:14px;">Feriados e Pontos Facultativos — ${ano}</strong></div>
      <div style="padding:10px 14px;">
        ${podeEditar ? `<div class="grade-2" style="grid-template-columns:140px 140px 170px 1fr auto;gap:8px;align-items:end;">
          <div class="campo" style="margin-bottom:0;"><label>Data início</label><div id="fer-data-container" class="seletor-data-wrap"></div></div>
          <div class="campo" style="margin-bottom:0;"><label>Data fim (opcional)</label><div id="fer-data-fim-container" class="seletor-data-wrap"></div></div>
          <div class="campo" style="margin-bottom:0;"><label>Tipo</label><select id="fer-tipo"><option value="feriado">Feriado</option><option value="ponto_facultativo">Ponto Facultativo</option><option value="recesso">Recesso Escolar</option></select></div>
          <div class="campo" style="margin-bottom:0;"><label>Descrição</label><input type="text" id="fer-descricao" placeholder="Ex: Recesso de julho" /></div>
          <button class="botao terracota pequeno" id="btn-add-feriado" style="width:auto;height:38px;">Adicionar</button>
        </div>` : ''}
        <div id="msg-feriados" style="margin-top:6px;"></div>
        ${feriadosDoAno.length
          ? `<table style="margin-top:6px;"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th></th></tr></thead><tbody>${linhasFeriados}</tbody></table>`
          : `<p style="color:var(--texto-suave);font-size:13.5px;margin-top:6px;">Nenhum feriado/ponto facultativo cadastrado em ${ano}.</p>`}
      </div>
    </div>`;
  document.getElementById('dl-ano').addEventListener('change', (e) => {
    ESTADO.diasLetivosAno = parseInt(e.target.value, 10) || new Date().getFullYear();
    renderizarDiasLetivos(el);
  });
  if(podeEditar){
    criarSeletorData('fer-data-container', '', null, { inputId:'fer-data', permiteLimpar:false, rotuloVazio:'Selecione a data' });
    criarSeletorData('fer-data-fim-container', '', null, { inputId:'fer-data-fim', permiteLimpar:true, rotuloVazio:'(opcional)' });
  }
  if(podeEditar){
  document.getElementById('btn-salvar-dias-letivos').addEventListener('click', async () => {
    const btn = document.getElementById('btn-salvar-dias-letivos');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const linhas = Array.from(el.querySelectorAll('.dl-mes')).map(inp => ({
      ano_letivo: ano,
      mes: parseInt(inp.dataset.mes, 10),
      quantidade_dias: parseInt(inp.value, 10) || 0,
    }));
    const { error } = await supabase.from('dias_letivos').upsert(linhas, { onConflict: 'ano_letivo,mes' });
    const msg = document.getElementById('msg-dias-letivos');
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; }
    else{ msg.innerHTML = `<div class="msg-ok">Dias letivos salvos.</div>`; }
    btn.disabled = false; btn.textContent = 'Salvar dias letivos';
  });
  document.getElementById('btn-add-feriado').addEventListener('click', async () => {
    const msg = document.getElementById('msg-feriados');
    const dataInicio = document.getElementById('fer-data').value;
    const dataFim = document.getElementById('fer-data-fim').value;
    if(!dataInicio){ msg.innerHTML = `<div class="msg-erro">Informe a data.</div>`; return; }
    if(dataFim && dataFim < dataInicio){ msg.innerHTML = `<div class="msg-erro">A data fim deve ser igual ou posterior à data início.</div>`; return; }
    const tipo = document.getElementById('fer-tipo').value;
    const descricao = document.getElementById('fer-descricao').value.trim() || null;
    const btn = document.getElementById('btn-add-feriado');
    btn.disabled = true; btn.textContent = 'Adicionando…';
    const registros = [];
    let cursor = new Date(dataInicio + 'T00:00:00');
    const fim = new Date((dataFim || dataInicio) + 'T00:00:00');
    while(cursor <= fim){
      registros.push({ data: cursor.toISOString().slice(0,10), tipo, descricao });
      cursor.setDate(cursor.getDate() + 1);
    }
    const { error } = await supabase.from('feriados').upsert(registros, { onConflict: 'data' });
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Adicionar'; return; }
    renderizarDiasLetivos(el);
  });
  }
  el.querySelectorAll('[data-remover-feriado]').forEach(b => b.addEventListener('click', async () => {
    await supabase.from('feriados').delete().eq('id', b.dataset.removerFeriado);
    renderizarDiasLetivos(el);
  }));
}

async function renderizarChamada(el){
  const podeRegistrar = ESTADO.perfil.role === 'admin' || ESTADO.perfil.role === 'coordenacao';
  const opcoesTurma = ESTADO.turmas.map(t => `<option value="${t.id}" ${ESTADO.chamadaTurma===t.id?'selected':''}>${esc(t.nome)} · ${esc(t.turno)}</option>`).join('');
  const { data: feriadosData } = await supabase.from('feriados').select('*').eq('data', ESTADO.chamadaData).maybeSingle();
  const diaSemana = new Date(ESTADO.chamadaData + 'T00:00:00').getDay();
  const ehFimDeSemana = diaSemana === 0 || diaSemana === 6;
  const diaNaoLetivo = ehFimDeSemana || !!feriadosData;
  let motivoNaoLetivo = '';
  if(ehFimDeSemana) motivoNaoLetivo = diaSemana === 0 ? 'domingo' : 'sábado';
  else if(feriadosData) motivoNaoLetivo = (feriadosData.tipo === 'feriado' ? 'Feriado' : feriadosData.tipo === 'ponto_facultativo' ? 'Ponto Facultativo' : 'Recesso Escolar') + (feriadosData.descricao ? ` — ${esc(feriadosData.descricao)}` : '');

  el.innerHTML = `
    <div class="painel">
      <div class="barra" style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:10px 14px;">
        <div class="campo" style="margin:0;min-width:220px;"><label>Turma</label><select id="ch-turma"><option value="">Selecione a turma</option>${opcoesTurma}</select></div>
        <div class="campo" style="margin:0;min-width:150px;"><label>Data</label><div id="ch-data" class="seletor-data-wrap"></div></div>
      </div>
      <div style="padding:10px 14px;">
        <div class="campo" style="margin-bottom:8px;">
          <label>Tipo do dia</label>
          <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:4px;font-size:13.5px;">
            <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="ch-tipo-dia" value="normal" ${ESTADO.chamadaTipoDia==='normal'?'checked':''} style="width:auto;" />Dia letivo normal</label>
            <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="ch-tipo-dia" value="feriado" ${ESTADO.chamadaTipoDia==='feriado'?'checked':''} style="width:auto;" />Feriado</label>
            <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="ch-tipo-dia" value="ponto_facultativo" ${ESTADO.chamadaTipoDia==='ponto_facultativo'?'checked':''} style="width:auto;" />Ponto Facultativo</label>
            <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="ch-tipo-dia" value="outros" ${ESTADO.chamadaTipoDia==='outros'?'checked':''} style="width:auto;" />Outros</label>
          </div>
        </div>
        <div id="ch-conteudo"></div>
        <div id="msg-chamada" style="margin-top:8px;"></div>
      </div>
    </div>`;

  document.getElementById('ch-turma').addEventListener('change', e => { ESTADO.chamadaTurma = e.target.value; renderizarChamada(el); });
  criarSeletorData('ch-data', ESTADO.chamadaData, (novaData) => { ESTADO.chamadaData = novaData; renderizarChamada(el); }, { turmaId: ESTADO.chamadaTurma || null });
  el.querySelectorAll('input[name="ch-tipo-dia"]').forEach(r => r.addEventListener('change', e => { ESTADO.chamadaTipoDia = e.target.value; renderizarChamada(el); }));

  const conteudo = document.getElementById('ch-conteudo');

  // Feriado / Ponto Facultativo / Outros -> aplica a TODOS os estudantes no dia
  if(ESTADO.chamadaTipoDia !== 'normal'){
    const rotulos = { feriado:'Feriado', ponto_facultativo:'Ponto Facultativo', outros:'Outros' };
    conteudo.innerHTML = `
      <p style="font-size:13.5px;color:var(--texto-suave);margin-bottom:12px;">Ao aplicar, <strong>todos os estudantes cadastrados</strong> serão marcados como <strong>${rotulos[ESTADO.chamadaTipoDia]}</strong> na data ${formatarDataBR(ESTADO.chamadaData)}.</p>
      ${ESTADO.chamadaTipoDia === 'outros' ? `<div class="campo" style="max-width:420px;"><label>Descrição</label><input type="text" id="ch-texto-outros" value="${esc(ESTADO.chamadaTextoOutros)}" placeholder="Ex: Recesso escolar" /></div>` : ''}
      ${podeRegistrar
        ? `<button class="botao terracota pequeno" id="btn-aplicar-todos" style="margin-top:12px;width:auto;">Aplicar a todos os estudantes</button>`
        : `<p style="margin-top:10px;color:var(--erro);font-size:13.5px;">Apenas Coordenação/Apoio Escolar ou Administrador podem registrar a chamada.</p>`}
    `;
    if(podeRegistrar){
      document.getElementById('btn-aplicar-todos').addEventListener('click', async () => {
        const btn = document.getElementById('btn-aplicar-todos');
        btn.disabled = true; btn.textContent = 'Aplicando…';
        const campoTexto = document.getElementById('ch-texto-outros');
        const texto = ESTADO.chamadaTipoDia === 'outros' ? ((campoTexto && campoTexto.value.trim()) || null) : null;
        ESTADO.chamadaTextoOutros = texto || '';
        const linhas = ESTADO.alunos.filter(a => a.situacao !== 'transferido' && a.situacao !== 'cancelado').map(a => ({
          aluno_id: a.id,
          turma_id: a.turma_id || null,
          data: ESTADO.chamadaData,
          status: ESTADO.chamadaTipoDia,
          texto_outros: texto,
          dias_justificados: null,
          registrado_por: ESTADO.perfil.id,
        }));
        const msg = document.getElementById('msg-chamada');
        const { error } = await supabase.from('frequencia').upsert(linhas, { onConflict: 'aluno_id,data' });
        if(error) msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
        else msg.innerHTML = `<div class="msg-ok">Frequência aplicada para todos os estudantes.</div>`;
        btn.disabled = false; btn.textContent = 'Aplicar a todos os estudantes';
      });
    }
    return;
  }

  // Dia letivo normal -> chamada individual por turma
  if(diaNaoLetivo){
    conteudo.innerHTML = `<p style="color:var(--erro);font-size:13.5px;">Não é possível registrar chamada em ${formatarDataBR(ESTADO.chamadaData)}: dia não letivo (${motivoNaoLetivo}). Se precisar registrar a frequência desse dia, use as opções Feriado/Ponto Facultativo/Outros acima.</p>`;
    return;
  }
  if(!ESTADO.chamadaTurma){
    const msgSucesso = ESTADO.chamadaMsgSucesso;
    ESTADO.chamadaMsgSucesso = null;
    conteudo.innerHTML = `
      ${msgSucesso ? `<div class="msg-ok">${esc(msgSucesso)}</div>` : ''}
      <p style="color:var(--texto-suave);font-size:13.5px;">Selecione uma turma para iniciar a chamada.</p>`;
    return;
  }
  conteudo.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Carregando chamada…</p>`;
  const alunosTurma = ESTADO.alunos.filter(a => a.turma_id === ESTADO.chamadaTurma && a.situacao !== 'transferido' && a.situacao !== 'cancelado');
  let registros = [];
  if(alunosTurma.length){
    const resp = await supabase.from('frequencia').select('*').eq('data', ESTADO.chamadaData).in('aluno_id', alunosTurma.map(a => a.id));
    registros = resp.data || [];
  }
  const porAluno = {};
  registros.forEach(r => { porAluno[r.aluno_id] = r; });

  const linhas = alunosTurma.map(a => {
    const reg = porAluno[a.id];
    const status = reg?.status || 'presente';
    const dias = reg?.dias_justificados || '';
    const disabled = podeRegistrar ? '' : 'disabled';
    return `
      <tr data-aluno="${a.id}">
        <td style="padding:5px 12px;font-size:13px;">${esc(a.nome)}</td>
        <td style="padding:5px 12px;">
          <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;">
            <label style="display:flex;align-items:center;gap:4px;color:#2E7D32;font-weight:600;"><input type="radio" name="st-${a.id}" value="presente" ${status==='presente'?'checked':''} style="width:auto;accent-color:#2E7D32;" ${disabled} />Presente</label>
            <label style="display:flex;align-items:center;gap:4px;color:var(--erro);font-weight:600;"><input type="radio" name="st-${a.id}" value="falta" ${status==='falta'?'checked':''} style="width:auto;accent-color:var(--erro);" ${disabled} />Falta</label>
            <label style="display:flex;align-items:center;gap:4px;"><input type="radio" name="st-${a.id}" value="falta_justificada" ${status==='falta_justificada'?'checked':''} style="width:auto;" ${disabled} />Falta Justificada</label>
          </div>
        </td>
        <td style="padding:5px 12px;"><input type="number" min="1" max="60" class="input-dias-justificados" data-aluno="${a.id}" value="${dias}" placeholder="dias" ${disabled} style="width:70px;padding:4px 6px;${status==='falta_justificada'?'':'visibility:hidden;'}" /></td>
      </tr>`;
  }).join('');

  conteudo.innerHTML = `
    ${alunosTurma.length
      ? `<table style="font-size:13px;"><thead><tr><th style="padding:6px 12px;">Estudante</th><th style="padding:6px 12px;">Situação</th><th style="padding:6px 12px;">Nº dias (se justificada)</th></tr></thead><tbody>${linhas}</tbody></table>`
      : `<p style="color:var(--texto-suave);font-size:13.5px;">Nenhum estudante nessa turma.</p>`}
    ${!podeRegistrar ? `<p style="margin-top:10px;color:var(--erro);font-size:13.5px;">Apenas Coordenação/Apoio Escolar ou Administrador podem registrar a chamada.</p>` : ''}
    ${podeRegistrar && alunosTurma.length ? `<button class="botao terracota pequeno" id="btn-salvar-chamada" style="margin-top:12px;width:auto;">Salvar chamada</button>` : ''}
  `;

  conteudo.querySelectorAll('input[type="radio"]').forEach(r => {
    r.addEventListener('change', (e) => {
      const alunoId = e.target.name.replace('st-','');
      const campoDias = conteudo.querySelector(`.input-dias-justificados[data-aluno="${alunoId}"]`);
      if(campoDias) campoDias.style.visibility = e.target.value === 'falta_justificada' ? 'visible' : 'hidden';
    });
  });

  if(podeRegistrar && alunosTurma.length){
    document.getElementById('btn-salvar-chamada').addEventListener('click', async () => {
      const btn = document.getElementById('btn-salvar-chamada');
      btn.disabled = true; btn.textContent = 'Salvando…';
      const linhasSalvar = [];
      const dataBase = new Date(ESTADO.chamadaData + 'T00:00:00');
      for(const a of alunosTurma){
        const radioMarcado = conteudo.querySelector(`input[name="st-${a.id}"]:checked`);
        const status = radioMarcado ? radioMarcado.value : 'presente';
        const campoDias = conteudo.querySelector(`.input-dias-justificados[data-aluno="${a.id}"]`);
        const nDias = status === 'falta_justificada' ? (parseInt(campoDias.value, 10) || 1) : null;
        linhasSalvar.push({ aluno_id:a.id, turma_id:a.turma_id||null, data:ESTADO.chamadaData, status, registrado_por:ESTADO.perfil.id, dias_justificados:nDias, texto_outros:null });
        if(status === 'falta_justificada' && nDias > 1){
          for(let i=1;i<nDias;i++){
            const d = new Date(dataBase); d.setDate(d.getDate()+i);
            linhasSalvar.push({ aluno_id:a.id, turma_id:a.turma_id||null, data:d.toISOString().slice(0,10), status:'falta_justificada', registrado_por:ESTADO.perfil.id, dias_justificados:nDias, texto_outros:null });
          }
        }
      }
      const msg = document.getElementById('msg-chamada');
      const { error } = await supabase.from('frequencia').upsert(linhasSalvar, { onConflict: 'aluno_id,data' });
      if(error){
        msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
        btn.disabled = false; btn.textContent = 'Salvar chamada';
        return;
      }
      ESTADO.chamadaMsgSucesso = 'Chamada salva com sucesso.';
      ESTADO.chamadaTurma = '';
      renderizarChamada(el);
    });
  }
}

async function renderizarHistoricoFrequencia(el){
  const opcoesAlunos = ESTADO.alunos.slice().sort((a,b) => a.nome.localeCompare(b.nome))
    .map(a => `<option value="${a.id}" ${ESTADO.histAlunoId===a.id?'selected':''}>${esc(a.nome)}</option>`).join('');

  el.innerHTML = `
    <div class="painel">
      <div class="barra" style="padding:10px 14px;">
        <div class="campo" style="margin:0;min-width:280px;"><label>Estudante</label><select id="hist-aluno"><option value="">Selecione o estudante</option>${opcoesAlunos}</select></div>
      </div>
      <div id="hist-conteudo" style="padding:12px 14px;"></div>
    </div>`;

  document.getElementById('hist-aluno').addEventListener('change', e => { ESTADO.histAlunoId = e.target.value; renderizarHistoricoFrequencia(el); });

  const conteudo = document.getElementById('hist-conteudo');
  if(!ESTADO.histAlunoId){
    conteudo.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Selecione um estudante para ver o histórico de frequência.</p>`;
    return;
  }
  conteudo.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Carregando…</p>`;

  const { data: historico } = await supabase.from('frequencia_mensal_historico').select('*').eq('aluno_id', ESTADO.histAlunoId).order('ano_letivo').order('mes');
  if(!historico || !historico.length){
    conteudo.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Nenhum histórico de frequência encontrado para este estudante.</p>`;
    return;
  }
  const { data: diasLetivosTodos } = await supabase.from('dias_letivos').select('*');
  const mapaDias = {};
  (diasLetivosTodos||[]).forEach(d => { mapaDias[`${d.ano_letivo}-${d.mes}`] = d.quantidade_dias; });

  const linhas = historico.map(h => {
    const totalDias = mapaDias[`${h.ano_letivo}-${h.mes}`];
    const percentual = totalDias ? Math.max(0, Math.round(((totalDias - h.faltas) / totalDias) * 100)) : null;
    return `<tr>
      <td>${MESES_EXTENSO[h.mes-1]}/${h.ano_letivo}</td>
      <td>${h.faltas}</td>
      <td>${totalDias ?? '—'}</td>
      <td>${percentual !== null ? percentual + '%' : '—'}</td>
    </tr>`;
  }).join('');

  conteudo.innerHTML = `
    <table><thead><tr><th>Mês</th><th>Faltas</th><th>Dias letivos</th><th>% Frequência</th></tr></thead><tbody>${linhas}</tbody></table>
    <p style="color:var(--texto-suave);font-size:12px;margin-top:8px;">O percentual só é calculado quando os dias letivos do mês estão cadastrados na aba "Dias letivos".</p>
  `;
}

const MESES_EXTENSO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function dataPorExtenso(iso){
  if(!iso) return '____________________';
  const [ano, mes, dia] = iso.split('-');
  return `${parseInt(dia,10)} de ${MESES_EXTENSO[parseInt(mes,10)-1].toLowerCase()} de ${ano}`;
}

async function calcularPercentualFrequencia(alunoId, ano, mes){
  const { data: dl } = await supabase.from('dias_letivos').select('quantidade_dias').eq('ano_letivo', ano).eq('mes', mes).maybeSingle();
  const totalDias = dl?.quantidade_dias || 0;
  if(!totalDias) return null;
  const { data: hist } = await supabase.from('frequencia_mensal_historico').select('faltas').eq('aluno_id', alunoId).eq('ano_letivo', ano).eq('mes', mes).maybeSingle();
  let totalFaltas;
  if(hist){
    totalFaltas = hist.faltas;
  } else {
    const ultimoDia = new Date(ano, mes, 0).getDate();
    const inicio = `${ano}-${String(mes).padStart(2,'0')}-01`;
    const fim = `${ano}-${String(mes).padStart(2,'0')}-${String(ultimoDia).padStart(2,'0')}`;
    const { data: faltas } = await supabase.from('frequencia').select('status').eq('aluno_id', alunoId).gte('data', inicio).lte('data', fim).in('status', ['falta','falta_justificada']);
    totalFaltas = (faltas||[]).length;
  }
  return Math.max(0, Math.round(((totalDias - totalFaltas) / totalDias) * 100));
}

function extrairSerie(nomeTurma){
  return (nomeTurma || '').replace(/\s+[A-Z]$/,'').trim();
}

function calcularSerieSeguinte(serieAtual){
  const m = serieAtual.match(/^(\d+)º\s*ANO/i);
  if(!m) return '';
  const n = parseInt(m[1], 10);
  if(n === 9) return '1º ANO DO ENSINO MÉDIO';
  if(n < 9) return `${n+1}º ANO`;
  return '';
}

function formatarNota(valor){
  const limpo = (valor || '').toString().trim();
  if(!limpo || limpo === '-' || limpo === '—' || limpo.toLowerCase() === 'sem dados') return '—';
  return esc(limpo);
}

    </tr>`;
  }).join('');

  const linhasParcial = COMPONENTES_FICHA_NOTAS.map(([chave, nome]) => {
    const v = partes[chave] || {};
    const campo = (nomeCampo, largura) => `<input type="text" id="fn-parcial-${chave}-${nomeCampo}" value="${esc(v[nomeCampo]||'')}" style="width:${largura}px;text-align:center;padding:4px;" />`;
    return `<tr>
      <td style="text-align:left;padding-left:8px;">${esc(nome)}</td>
      <td>${campo('exame1',50)}</td><td>${campo('exame2',50)}</td><td>${campo('exame3',50)}</td>
      <td>${campo('resultado',90)}</td>
    </tr>`;
  }).join('');

  conteudo.innerHTML = `
    <p style="font-size:13px;color:var(--texto-suave);margin:0 0 12px;">
      Estudante: <b>${esc(aluno?.nome || '')}</b> · Ano letivo: <b>${ESTADO.fichaNotasAno}</b>
    </p>

    <div class="painel" style="margin-bottom:14px;">
      <div class="barra" style="padding:8px 14px;"><strong style="font-size:13px;">Preencher automaticamente a partir de um arquivo</strong></div>
      <div style="padding:12px 14px;">
        <p style="font-size:12.5px;color:var(--texto-suave);margin:0 0 8px;">Anexe a foto ou o PDF de uma ficha já preenchida (frente e/ou verso). O sistema lê o documento e preenche os campos abaixo automaticamente — confira antes de salvar. <b>Aceita PDF ou foto/imagem.</b> Se o arquivo for Word (.doc/.docx), salve-o como PDF antes de anexar (Arquivo → Salvar como → PDF).</p>
        <input type="file" id="fn-anexo" accept="image/*,application/pdf" />

      </div>
    </div>

    <div id="msg-ficha-notas" style="margin-bottom:10px;"></div>

    <div class="secao-titulo">Notas por bimestre</div>
    <div style="overflow-x:auto;">
    <table class="tabela-compacta"><thead><tr>
      <th>Componente</th><th>I Bim.</th><th>II Bim.</th><th>III Bim.</th><th>IV Bim.</th><th>Rec. Final</th><th>Nota Final</th><th>Resultado</th>
    </tr></thead><tbody>${linhasNotas}</tbody></table>
    </div>

    <div class="secao-titulo">Resumo anual</div>
    <div class="grade-2" style="grid-template-columns:repeat(4,1fr);gap:12px;">
      <div class="campo"><label>Carga horária total</label><input type="text" id="fn-carga-horaria" value="${esc(registro?.carga_horaria_total||'')}" placeholder="Ex: 800 h" /></div>
      <div class="campo"><label>Quantidade de faltas</label><input type="text" id="fn-faltas" value="${esc(registro?.quantidade_faltas||'')}" /></div>
      <div class="campo"><label>Percentual de frequência</label><input type="text" id="fn-frequencia" value="${esc(registro?.percentual_frequencia||'')}" placeholder="Ex: 85%" /></div>
      <div class="campo"><label>Resultado final</label>
        <select id="fn-resultado-final">
          <option value="" ${!registro?.resultado_final?'selected':''}>—</option>
          <option value="aprovado" ${registro?.resultado_final==='aprovado'?'selected':''}>Aprovado</option>
          <option value="progressao_parcial" ${registro?.resultado_final==='progressao_parcial'?'selected':''}>Progressão Parcial</option>
          <option value="retido" ${registro?.resultado_final==='retido'?'selected':''}>Retido</option>
          <option value="cursando" ${registro?.resultado_final==='cursando'?'selected':''}>Cursando</option>
        </select>
      </div>
    </div>

    <div class="secao-titulo">Registro das notas da progressão parcial (verso)</div>
    <div style="overflow-x:auto;">
    <table class="tabela-compacta"><thead><tr>
      <th>Componente</th><th>Nota do 1º Exame</th><th>Nota do 2º Exame</th><th>Nota do 3º Exame</th><th>Resultado</th>
    </tr></thead><tbody>${linhasParcial}</tbody></table>
    </div>

    <div class="secao-titulo">Exame especial (verso)</div>
    <div class="grade-2" style="grid-template-columns:repeat(2,1fr);gap:12px;">
      <div class="campo"><label>Componente I</label><input type="text" id="fn-exame-comp1-nome" value="${esc(exameEsp.componente1Nome||'')}" placeholder="Nome do componente" /></div>
      <div class="campo"><label>Nota</label><input type="text" id="fn-exame-comp1-nota" value="${esc(exameEsp.componente1Nota||'')}" /></div>
      <div class="campo"><label>Componente II</label><input type="text" id="fn-exame-comp2-nome" value="${esc(exameEsp.componente2Nome||'')}" placeholder="Nome do componente" /></div>
      <div class="campo"><label>Nota</label><input type="text" id="fn-exame-comp2-nota" value="${esc(exameEsp.componente2Nota||'')}" /></div>
      <div class="campo" style="grid-column:1 / -1;"><label>Situação após exame especial</label>
        <select id="fn-exame-situacao">
          <option value="" ${!exameEsp.situacao?'selected':''}>—</option>
          <option value="plena" ${exameEsp.situacao==='plena'?'selected':''}>Progressão Plena</option>
          <option value="retido" ${exameEsp.situacao==='retido'?'selected':''}>Retido</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">
      <button class="botao terracota pequeno" id="btn-salvar-ficha-notas" style="width:auto;">Salvar</button>
      <button class="botao secundario pequeno" id="btn-gerar-ficha-notas" style="width:auto;">Gerar Ficha (frente e verso)</button>
    </div>
  `;

  function coletarDadosFicha(){
    const notasColetadas = {};
    const parciaisColetadas = {};
    COMPONENTES_FICHA_NOTAS.forEach(([chave]) => {
      notasColetadas[chave] = {
        b1: document.getElementById(`fn-notas-${chave}-b1`).value.trim(),
        b2: document.getElementById(`fn-notas-${chave}-b2`).value.trim(),
        b3: document.getElementById(`fn-notas-${chave}-b3`).value.trim(),
        b4: document.getElementById(`fn-notas-${chave}-b4`).value.trim(),
        recFinal: document.getElementById(`fn-notas-${chave}-recFinal`).value.trim(),
        notaFinal: document.getElementById(`fn-notas-${chave}-notaFinal`).value.trim(),
        resultado: document.getElementById(`fn-notas-${chave}-resultado`).value,
      };
      parciaisColetadas[chave] = {
        exame1: document.getElementById(`fn-parcial-${chave}-exame1`).value.trim(),
        exame2: document.getElementById(`fn-parcial-${chave}-exame2`).value.trim(),
        exame3: document.getElementById(`fn-parcial-${chave}-exame3`).value.trim(),
        resultado: document.getElementById(`fn-parcial-${chave}-resultado`).value.trim(),
      };
    });
    return {
      aluno_id: ESTADO.fichaNotasAlunoId,
      ano_civil: ESTADO.fichaNotasAno,
      serie: aluno?.turmas ? extrairSerie(aluno.turmas.nome) : null,
      carga_horaria_total: document.getElementById('fn-carga-horaria').value.trim() || null,
      quantidade_faltas: document.getElementById('fn-faltas').value.trim() || null,
      percentual_frequencia: document.getElementById('fn-frequencia').value.trim() || null,
      resultado_final: document.getElementById('fn-resultado-final').value || null,
      notas: notasColetadas,
      progressao_parcial: parciaisColetadas,
      exame_especial: {
        componente1Nome: document.getElementById('fn-exame-comp1-nome').value.trim(),
        componente1Nota: document.getElementById('fn-exame-comp1-nota').value.trim(),
        componente2Nome: document.getElementById('fn-exame-comp2-nome').value.trim(),
        componente2Nota: document.getElementById('fn-exame-comp2-nota').value.trim(),
        situacao: document.getElementById('fn-exame-situacao').value,
      },
      atualizado_em: new Date().toISOString(),
    };
  }

  document.getElementById('fn-anexo').addEventListener('change', async (e) => {
    const arquivo = e.target.files[0];
    const msgExtracao = document.getElementById('msg-extracao-ficha');
    if(!arquivo) return;
    msgExtracao.style.color = 'var(--texto-suave)';
    msgExtracao.textContent = 'Lendo o documento e extraindo os dados…';
    try{
      const base64Data = await new Promise((res, rej) => {
        const leitor = new FileReader();
        leitor.onload = () => res(leitor.result.split(',')[1]);
        leitor.onerror = () => rej(new Error('Falha ao ler o arquivo'));
        leitor.readAsDataURL(arquivo);
      });
      const { data: resposta, error } = await supabase.functions.invoke('extrair-ficha-notas', {
        body: { mediaType: arquivo.type, base64Data },
      });
      if(error || !resposta || resposta.error){
        msgExtracao.style.color = 'var(--erro)';
        msgExtracao.textContent = (resposta && resposta.error) || 'Não foi possível extrair os dados do documento.';
        return;
      }
      const dados = resposta.dados || {};

      if(dados.estudante_nome && aluno?.nome && normalizarNomeParaComparacao(dados.estudante_nome) !== normalizarNomeParaComparacao(aluno.nome)){
        msgExtracao.style.color = 'var(--erro)';
        msgExtracao.textContent = `Atenção: o documento parece ser de "${dados.estudante_nome}", mas o estudante selecionado é "${aluno.nome}". Os campos foram preenchidos mesmo assim — confira com cuidado antes de salvar.`;
      } else {
        msgExtracao.style.color = 'var(--verde-escuro, #2E7D32)';
        msgExtracao.textContent = 'Dados extraídos! Confira os campos antes de salvar.';
      }

      const preencher = (id, valor) => { const campo = document.getElementById(id); if(campo && valor !== null && valor !== undefined && valor !== '') campo.value = valor; };

      preencher('fn-carga-horaria', dados.carga_horaria_total);
      preencher('fn-faltas', dados.quantidade_faltas);
      preencher('fn-frequencia', dados.percentual_frequencia);
      preencher('fn-resultado-final', dados.resultado_final);

      const notasExtraidas = dados.notas || {};
      const parciaisExtraidos = dados.progressao_parcial || {};
      COMPONENTES_FICHA_NOTAS.forEach(([chave]) => {
        const v = notasExtraidas[chave] || {};
        preencher(`fn-notas-${chave}-b1`, v.b1);
        preencher(`fn-notas-${chave}-b2`, v.b2);
        preencher(`fn-notas-${chave}-b3`, v.b3);
        preencher(`fn-notas-${chave}-b4`, v.b4);
        preencher(`fn-notas-${chave}-recFinal`, v.recFinal);
        preencher(`fn-notas-${chave}-notaFinal`, v.notaFinal);
        preencher(`fn-notas-${chave}-resultado`, v.resultado);
        const p = parciaisExtraidos[chave] || {};
        preencher(`fn-parcial-${chave}-exame1`, p.exame1);
        preencher(`fn-parcial-${chave}-exame2`, p.exame2);
        preencher(`fn-parcial-${chave}-exame3`, p.exame3);
        preencher(`fn-parcial-${chave}-resultado`, p.resultado);
      });

      const exameEspExtraido = dados.exame_especial || {};
      preencher('fn-exame-comp1-nome', exameEspExtraido.componente1Nome);
      preencher('fn-exame-comp1-nota', exameEspExtraido.componente1Nota);
      preencher('fn-exame-comp2-nome', exameEspExtraido.componente2Nome);
      preencher('fn-exame-comp2-nota', exameEspExtraido.componente2Nota);
      preencher('fn-exame-situacao', exameEspExtraido.situacao);
    } catch(err){
      msgExtracao.style.color = 'var(--erro)';
      msgExtracao.textContent = 'Erro ao processar o anexo: ' + err.message;
    }
  });

  document.getElementById('btn-salvar-ficha-notas').addEventListener('click', async () => {
    const msg = document.getElementById('msg-ficha-notas');
    const btn = document.getElementById('btn-salvar-ficha-notas');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const dados = coletarDadosFicha();
    const { error } = await supabase.from('fichas_notas').upsert(dados, { onConflict: 'aluno_id,ano_civil' });
    btn.disabled = false; btn.textContent = 'Salvar';
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }
    msg.innerHTML = `<div class="msg-ok">Ficha salva com sucesso.</div>`;

  document.getElementById('btn-gerar-ficha-notas').addEventListener('click', async () => {
    const msg = document.getElementById('msg-ficha-notas');
    const dados = coletarDadosFicha();
    const { error } = await supabase.from('fichas_notas').upsert(dados, { onConflict: 'aluno_id,ano_civil' });
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }
    gerarFichaNotasDocumento(aluno, dados);
  });
}

async function gerarFichaNotasDocumento(aluno, registro){
  const { data: vinculos } = await supabase.from('aluno_responsavel').select('tipo, responsaveis(nome)').eq('aluno_id', aluno.id);
  const mae = (vinculos||[]).find(v => v.tipo === 'mae');
  const pai = (vinculos||[]).find(v => v.tipo === 'pai');
  const filiacao = [pai?.responsaveis?.nome, mae?.responsaveis?.nome].filter(Boolean).join(' E ') || '—';
  const serieTexto = registro.serie || (aluno.turmas ? extrairSerie(aluno.turmas.nome) : '____');
  const notas = registro.notas || {};
  const partes = registro.progressao_parcial || {};
  const exameEsp = registro.exame_especial || {};
  const nn = (v) => (v===undefined||v===null||v==='') ? '' : esc(v);
  const preenchido = (v) => !!(v && String(v).trim());
  // qualquer coisa que não seja um número (com vírgula ou ponto) digitada na Nota Final é tratada como texto de
  // resultado (ex: "cursando", "aprovado"...) e nunca é impressa na coluna de Nota Final, só na de Resultado
  const notaFinalEhNumero = (texto) => /^\d+([.,]\d+)?$/.test(texto);

  const linhasNotas = COMPONENTES_FICHA_NOTAS.map(([chave, nome]) => {
    const v = notas[chave] || {};
    const todosBimestresPreenchidos = preenchido(v.b1) && preenchido(v.b2) && preenchido(v.b3) && preenchido(v.b4);
    const notaFinalTexto = (v.notaFinal || '').toString().trim();
    const notaFinalEhTextoDeResultado = preenchido(notaFinalTexto) && !notaFinalEhNumero(notaFinalTexto);
    // a Nota Final só é impressa se: (a) for um número de verdade, e (b) os 4 bimestres estiverem completos
    const notaFinalExibir = (!notaFinalEhTextoDeResultado && todosBimestresPreenchidos) ? v.notaFinal : '';
    // se o Resultado estiver vazio mas alguém digitou um texto (tipo "cursando") na Nota Final por engano, ele aparece aqui, no lugar certo
    const resultadoExibir = v.resultado ? v.resultado.toUpperCase() : (notaFinalEhTextoDeResultado ? notaFinalTexto.toUpperCase() : '');
    return `<tr>
      <td style="text-align:left;padding-left:6px;">${esc(nome)}</td>
      <td><b>${nn(v.b1)}</b></td><td><b>${nn(v.b2)}</b></td><td><b>${nn(v.b3)}</b></td><td><b>${nn(v.b4)}</b></td>
      <td><b>${nn(v.recFinal)}</b></td><td><b>${nn(notaFinalExibir)}</b></td>
      <td><b>${esc(resultadoExibir)}</b></td>
    </tr>`;
  }).join('');
  // diagonal na 1ª página: só cruza III/IV bimestre + média + rec.final + nota final se nenhum componente tiver esses campos preenchidos
  // (ou seja, o ano letivo ainda está em andamento e essas colunas realmente não têm o que mostrar)
  const semDadosSegundoSemestre = COMPONENTES_FICHA_NOTAS.every(([chave]) => {
    const v = notas[chave] || {};
    const notaFinalTexto = (v.notaFinal || '').toString().trim();
    const notaFinalConta = preenchido(notaFinalTexto) && notaFinalEhNumero(notaFinalTexto);
    return !preenchido(v.b3) && !preenchido(v.b4) && !preenchido(v.recFinal) && !notaFinalConta;
  });

  const linhasParcial = COMPONENTES_FICHA_NOTAS.map(([chave, nome]) => `<tr>
      <td style="text-align:left;padding-left:6px;">${esc(nome)}</td>
      <td><b>${nn((partes[chave]||{}).exame1)}</b></td><td><b>${nn((partes[chave]||{}).exame2)}</b></td><td><b>${nn((partes[chave]||{}).exame3)}</b></td><td><b>${nn((partes[chave]||{}).resultado)}</b></td>
    </tr>`).join('');
  // diagonal na 2ª página: cruza a tabela inteira (exceto a coluna do componente) se nenhum componente tiver nota de progressão parcial lançada
  const semDadosProgressaoParcial = COMPONENTES_FICHA_NOTAS.every(([chave]) => {
    const v = partes[chave] || {};
    return !preenchido(v.exame1) && !preenchido(v.exame2) && !preenchido(v.exame3) && !preenchido(v.resultado);
  });

  const mapaResultadoFinal = { aprovado:'APROVADO', progressao_parcial:'PROGRESSÃO PARCIAL', retido:'RETIDO', cursando:'CURSANDO' };

  // colunas da tabela de notas por bimestre (somam 100%) — usadas nas duas tabelas (cabeçalho e corpo) para ficarem alinhadas
  const colgroupNotas = `<colgroup>
    <col style="width:19%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:7%">
    <col style="width:8%"><col style="width:7%"><col style="width:7%"><col style="width:31%">
  </colgroup>`;
  // colunas da tabela de progressão parcial (somam 100%)
  const colgroupParcial = `<colgroup>
    <col style="width:24%"><col style="width:17%"><col style="width:17%"><col style="width:17%"><col style="width:25%">
  </colgroup>`;

  const janela = window.open('', '_blank');
  janela.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8" />
    <title>Ficha Individual das Notas - ${esc(aluno.nome)}</title>
    <style>

      .cabecalho-doc{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
      .cabecalho-doc img{width:58px;height:58px;flex-shrink:0;}
      .cabecalho-doc .orgao{flex:1;text-align:center;margin:0;line-height:1.3;}
      .cabecalho-doc .orgao b{font-size:16px;display:block;}
      .cabecalho-doc .orgao span{font-size:13px;}
      .cabecalho-doc .ano-box{flex-shrink:0;border:1.5px solid #333;padding:10px 22px;font-size:19px;font-weight:bold;}
      .titulo-doc{text-align:center;font-size:15.5px;font-weight:bold;text-transform:uppercase;margin:4px 0 14px;line-height:1.4;}
      .info-escola{border:1px solid #333;padding:13px 16px;margin-bottom:16px;font-size:12.5px;line-height:2;}
      .secao-nome{font-weight:bold;font-size:13px;margin:16px 0 6px;text-transform:uppercase;}
      table.ficha{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.3px;}
      table.ficha th, table.ficha td{border:1px solid #333;padding:9px 5px;text-align:center;word-wrap:break-word;}
      table.ficha th{background:#f2f2f2;font-size:11px;padding:8px 4px;}
      table.ficha.corpo{margin-top:-1px;margin-bottom:14px;}
      .resumo-anual{width:100%;border-collapse:collapse;font-size:12.3px;margin-bottom:14px;}
      .resumo-anual th, .resumo-anual td{border:1px solid #333;padding:11px 10px;text-align:center;}
      .resumo-anual th{background:#f2f2f2;font-size:11.3px;}
      .quebra-pagina{page-break-before:always;break-before:page;}
      .doc-data{text-align:right;margin:22px 0 32px;font-size:13px;}
      .assinaturas-duplas{display:flex;justify-content:space-around;gap:24px;text-align:center;font-size:13px;line-height:1.4;margin-top:26px;}
      .assinaturas-duplas div{border-top:1px solid #333;padding-top:6px;width:240px;}
      .exame-especial{width:100%;border-collapse:collapse;font-size:12.3px;margin-bottom:8px;}
      .exame-especial th, .exame-especial td{border:1px solid #333;padding:10px 10px;}
      .envolt-diagonal{position:relative;}
      .diagonal-tabela{position:absolute;top:0;bottom:0;pointer-events:none;
        background-image:linear-gradient(to bottom right, transparent calc(50% - 0.6px), #333 calc(50% - 0.6px), #333 calc(50% + 0.6px), transparent calc(50% + 0.6px));}
    </style>
    </head><body>
      <div class="cabecalho-doc">
        <img src="${LOGO_PREFEITURA_URL}" alt="Logo Prefeitura do Paulista" />
        <p class="orgao"><b>PREFEITURA DO MUNICÍPIO DO PAULISTA</b><span>SECRETARIA DE EDUCAÇÃO</span></p>
        <div class="ano-box">${ESTADO.fichaNotasAno}</div>
      </div>
      <div class="titulo-doc">Ficha Individual de Registro das Notas do<br/>Ensino Fundamental e EJA</div>
      <div class="info-escola">
        <b>UNIDADE DE ENSINO</b> ESCOLA MUNICIPAL JAIME GONÇALVES BOLD &nbsp;&nbsp; <b>CÓDIGO DO INEP</b> Nº 26116847<br/>
        <b>ENDEREÇO</b> Rua Marechal Hermes, Nº 108 – CEP: 53403-450 – Vila Torres Galvão, Paulista/PE &nbsp;&nbsp; <b>TELEFONE</b> (81) 3437-0833<br/>
        <b>ESTUDANTE:</b> <u>${esc(aluno.nome)}</u> &nbsp;&nbsp; <b>DATA DE NASC.</b> ${aluno.data_nascimento ? formatarDataBR(aluno.data_nascimento) : '—'}<br/>
        <b>DO</b> ${esc(serieTexto)} <b>ANO/FASE DO(A) ENSINO FUNDAMENTAL</b> &nbsp;&nbsp; <b>FILHO(A) DE</b> ${filiacao}.
      </div>

      </div>

      <table class="resumo-anual">

function normalizarNomeParaComparacao(nome){
  return (nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toUpperCase().replace(/\s+/g, ' ');
}

function renderizarInsercaoAta(el){
  el.innerHTML = `
    <div class="painel">
      <div class="barra" style="padding:10px 14px;"><strong style="font-size:14px;">Inserir ata com vários estudantes</strong></div>
      <div style="padding:14px;">
        <p style="font-size:13px;color:var(--texto-suave);margin:0 0 10px;">Anexe a foto ou PDF de uma ata de resultados finais com vários estudantes. O sistema lê o documento e casa cada nome com os estudantes <b>já matriculados</b> nesta escola — só esses recebem as notas.</p>
        <div class="campo" style="margin-bottom:0;">
          <input type="file" id="ata-anexo" accept="image/*,application/pdf" />
        </div>
        <div id="msg-ata" style="margin-top:10px;"></div>
        <div id="ata-revisao" style="margin-top:14px;"></div>
      </div>
    </div>`;

  document.getElementById('ata-anexo').addEventListener('change', async (e) => {
    const arquivo = e.target.files[0];
    const msg = document.getElementById('msg-ata');
    const revisao = document.getElementById('ata-revisao');
    revisao.innerHTML = '';
    if(!arquivo) return;
    msg.innerHTML = `<p style="color:var(--texto-suave);font-size:13px;">Lendo a ata e identificando os estudantes…</p>`;
    try{
      const base64Data = await new Promise((res, rej) => {
        const leitor = new FileReader();
        leitor.onload = () => res(leitor.result.split(',')[1]);
        leitor.onerror = () => rej(new Error('Falha ao ler o arquivo'));
        leitor.readAsDataURL(arquivo);
      });
      const { data: resposta, error } = await supabase.functions.invoke('extrair-ata', {
        body: { mediaType: arquivo.type, base64Data },
      });
      if(error || !resposta || resposta.error){
        msg.innerHTML = `<p style="color:var(--erro);font-size:13px;">${esc((resposta && resposta.error) || 'Não foi possível extrair os dados da ata.')}</p>`;
        return;
      }
      const dadosAta = resposta.dados || {};
      const estudantesAta = Array.isArray(dadosAta.estudantes) ? dadosAta.estudantes : [];
      if(!estudantesAta.length){
        msg.innerHTML = `<p style="color:var(--erro);font-size:13px;">Nenhum estudante foi identificado nessa ata.</p>`;
        return;

      msg.innerHTML = `<p style="color:var(--texto-suave);font-size:13px;">${estudantesAta.length} estudante(s) identificado(s) na ata. Confira o casamento abaixo antes de importar.</p>`;

    } catch(err){
      msg.innerHTML = `<p style="color:var(--erro);font-size:13px;">Erro ao processar o anexo: ${esc(err.message)}</p>`;
    }
  });
}

  const mapaAlunosPorNome = {};

async function preencherSeriesAutomaticamente(aluno){
  if(!aluno) return { ok:false, motivo:'sem_aluno' };
  const turma = ESTADO.turmas.find(t => t.id === aluno.turma_id);
  if(!turma) return { ok:false, motivo:'sem_turma' };
  const serieTextoAtual = extrairSerie(turma.nome);
  const m = serieTextoAtual.match(/^(\d+)º\s*ANO/i);
  if(!m) return { ok:false, motivo:'serie_nao_reconhecida' };
  const numeroAtual = parseInt(m[1], 10);
  if(numeroAtual < 1 || numeroAtual > 9) return { ok:false, motivo:'fora_do_fundamental' };

  const anoVigente = new Date().getFullYear();
  const { data: existentes } = await supabase.from('historico_escolar_anual').select('id, ano_civil, carga_horaria_anual').eq('aluno_id', aluno.id);
  const mapaExistentes = new Map((existentes||[]).map(r => [r.ano_civil, r]));

  const linhasNovas = [];
  const atualizacoesCarga = [];
  for(let numero=1; numero<=numeroAtual; numero++){
    const anoCivil = anoVigente - (numeroAtual - numero);
    const cargaHoraria = numero <= 5 ? '800 h' : '1080 h';
    const existente = mapaExistentes.get(anoCivil);
    if(!existente){
      linhasNovas.push({ aluno_id: aluno.id, ano_civil: anoCivil, serie: `${numero}º ANO`, carga_horaria_anual: cargaHoraria });
    } else if(!existente.carga_horaria_anual || !existente.carga_horaria_anual.trim()){
      atualizacoesCarga.push({ id: existente.id, carga_horaria_anual: cargaHoraria });
    }
  }
  if(linhasNovas.length){
    await supabase.from('historico_escolar_anual').upsert(linhasNovas, { onConflict: 'aluno_id,ano_civil' });
  }
  for(const atualizacao of atualizacoesCarga){
    await supabase.from('historico_escolar_anual').update({ carga_horaria_anual: atualizacao.carga_horaria_anual }).eq('id', atualizacao.id);
  }
  return { ok:true };
}

    const registro = registros.find(r => r.id === b.dataset.editarAno);

        const valor = dados[campo.dataset.campo];
        if(valor !== null && valor !== undefined && valor !== '') campo.value = valor;
      });
      msgExtracao.textContent = 'Dados extraídos! Confira os campos antes de salvar.';
      msgExtracao.style.color = 'var(--verde-escuro, #2E7D32)';
    } catch(err){
      msgExtracao.textContent = 'Erro ao processar o anexo: ' + err.message;
      msgExtracao.style.color = 'var(--erro)';
    }
  });
  document.getElementById('btn-usar-esta-escola').addEventListener('click', () => {
    document.getElementById('he-unidade').value = 'ESCOLA MUNICIPAL JAIME GONÇALVES BOLD';
    document.getElementById('he-cidade').value = 'PAULISTA';
    document.getElementById('he-uf').value = 'PE';
  });
  document.getElementById('btn-cancelar-ano-historico').addEventListener('click', () => {
    ESTADO.histEscEditando = null;
    formEl.innerHTML = '';
  });
  document.getElementById('btn-salvar-ano-historico').addEventListener('click', async () => {
    const btn = document.getElementById('btn-salvar-ano-historico');
    const anoCivil = parseInt(document.getElementById('he-ano-civil').value, 10);
    const msg = document.getElementById('msg-form-historico');
    if(!anoCivil){ msg.innerHTML = `<div class="msg-erro">Informe o ano civil.</div>`; return; }
    btn.disabled = true; btn.textContent = 'Salvando…';
    const dados = {
      aluno_id: ESTADO.histEscAlunoId,
      ano_civil: anoCivil,
      serie: document.getElementById('he-serie').value.trim() || null,
      unidade_ensino: document.getElementById('he-unidade').value.trim() || null,
      cidade: document.getElementById('he-cidade').value.trim() || null,
      uf: document.getElementById('he-uf').value || null,
      carga_horaria_anual: document.getElementById('he-carga').value.trim() || null,
      frequencia_anual: document.getElementById('he-freq').value.trim() || null,
      progressao: document.getElementById('he-progressao').value || null,
      observacoes: document.getElementById('he-obs').value.trim() || null,
    };
    document.querySelectorAll('.he-materia').forEach(campo => {
      dados[campo.dataset.campo] = campo.value.trim() || null;
    });
    document.querySelectorAll('.he-materia-nome').forEach(campo => {
      dados[campo.dataset.campoNome] = campo.value.trim() || null;
    });
    const { error } = await supabase.from('historico_escolar_anual').upsert(dados, { onConflict: 'aluno_id,ano_civil' });
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Salvar'; return; }
    ESTADO.histEscEditando = null;
    renderizarBancoHistorico(conteudo, elPai);
  });
}

async function gerarHistoricoEscolarDocumento(aluno, anos){
  const { data: vinculos } = await supabase.from('aluno_responsavel').select('tipo, responsaveis(nome)').eq('aluno_id', aluno.id);
  const mae = (vinculos||[]).find(v => v.tipo === 'mae');
  const pai = (vinculos||[]).find(v => v.tipo === 'pai');
  const nomeMae = mae?.responsaveis?.nome || '____________________';
  const nomePai = pai?.responsaveis?.nome || '____________________';
  const ultimoRegistro = anos[anos.length-1] || null;
  const estaCursandoAnoAtual = ultimoRegistro?.progressao === 'cursando';
  const registroConcluido = estaCursandoAnoAtual ? anos[anos.length-2] : ultimoRegistro;
  const serieMaisRecente = registroConcluido?.serie || '____';
  const textoSituacaoAtual = estaCursandoAnoAtual
    ? ` O(a) estudante encontra-se cursando o(a) <b>${esc(ultimoRegistro.serie || '____')}</b> no ano letivo de <b>${esc(String(ultimoRegistro.ano_civil || ''))}</b>.`
    : '';
  const textoObservacoes = anos.filter(r => r.observacoes && r.observacoes.trim())
    .map(r => esc(r.observacoes.trim())).join('<br/><br/>');

  const materiasBNC = MATERIAS_HISTORICO.slice(0, 7);
  const materiasDiv = MATERIAS_HISTORICO.slice(7);
  const CAMPOS_DISCIPLINA_LIVRE = { nota_extra_1: 'nome_extra_1', nota_extra_2: 'nome_extra_2' };
  function nomeDisciplinaLivre(campoNomeLivre){
    const registro = anos.find(r => (r[campoNomeLivre] || '').trim());
    return registro ? registro[campoNomeLivre].trim() : '';
  }
  const cabecalhoMaterias = [...materiasBNC, ...materiasDiv].map(([campo, nome]) => {
    const campoNomeLivre = CAMPOS_DISCIPLINA_LIVRE[campo];
    const rotulo = campoNomeLivre ? nomeDisciplinaLivre(campoNomeLivre) : nome;
    return `<th class="materia-vertical">${esc(rotulo)}</th>`;
  }).join('');

  const NOMES_SERIE = {
    1: ['1º ANO'],
    2: ['2º ANO', '1ª SÉRIE'],
    3: ['3º ANO', '2ª SÉRIE', 'FASE I'],
    4: ['4º ANO', '3ª SÉRIE'],

    8: ['8º ANO', '7ª SÉRIE'],
    9: ['9º ANO', '8ª SÉRIE', 'FASE IV'],
  };
  function rotuloSerieHtml(numero, cursada){
    return NOMES_SERIE[numero].map((nome, i) => `<div style="white-space:nowrap;">(<span style="visibility:${cursada && i===0 ? 'visible' : 'hidden'};">X</span>) ${nome}</div>`).join('');
  }

  const registrosPorSerie = {};
  anos.forEach(r => {

  const blocosAnos = `${linhaCabecalho}${blocosSeries}`;

      <div class="campo"><label>Data da solicitação</label><input type="date" id="sol-data" value="${new Date().toISOString().slice(0,10)}" /></div>

      <button class="botao terracota pequeno" id="btn-salvar-solicitacao" style="margin-top:16px;width:auto;">Registrar solicitação</button>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('sol-tipo').addEventListener('change', (e) => {
    document.getElementById('campo-sol-outro').style.display = e.target.value === 'Outro' ? '' : 'none';
  });
  document.getElementById('sol-turma').addEventListener('change', (e) => {
    const turmaId = e.target.value;
    const selectAluno = document.getElementById('sol-aluno');
    Array.from(selectAluno.options).forEach(opt => {
      opt.hidden = turmaId && opt.value && opt.dataset.turma !== turmaId;
    });
    if(selectAluno.selectedOptions[0]?.hidden) selectAluno.value = '';
  });
  document.getElementById('sol-aluno').addEventListener('change', (e) => {
    const turmaDoAluno = e.target.selectedOptions[0]?.dataset.turma;
    if(turmaDoAluno) document.getElementById('sol-turma').value = turmaDoAluno;
  });

  document.getElementById('btn-salvar-solicitacao').addEventListener('click', async () => {
    const msg = document.getElementById('msg-nova-solicitacao');
    const tipo = document.getElementById('sol-tipo').value;
    const outro = document.getElementById('sol-outro').value.trim();
    const solicitante = document.getElementById('sol-solicitante').value.trim();
    if(!solicitante){ msg.innerHTML = `<div class="msg-erro">Informe o nome do solicitante.</div>`; return; }
    if(tipo === 'Outro' && !outro){ msg.innerHTML = `<div class="msg-erro">Digite qual documento está sendo solicitado.</div>`; return; }
    const btn = document.getElementById('btn-salvar-solicitacao');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const dados = {
      tipo_documento: tipo,
      documento_outro: tipo === 'Outro' ? outro : null,
      aluno_id: document.getElementById('sol-aluno').value || null,
      turma_id: document.getElementById('sol-turma').value || null,
      telefone_solicitante: document.getElementById('sol-telefone').value.trim() || null,
      nome_solicitante: solicitante,
      data_solicitacao: document.getElementById('sol-data').value || new Date().toISOString().slice(0,10),
      observacoes: document.getElementById('sol-obs').value.trim() || null,
      registrado_por: ESTADO.perfil.id,
    };
    const { error } = await supabase.from('solicitacoes_documentos').insert(dados);
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Registrar solicitação'; return; }
    modal.remove();
    ESTADO.solicMsgSucesso = 'Solicitação registrada com sucesso.';
    renderizarSolicitacoes(elLista);
  });
}

async function carregarListaSolicitacoes(el){
  const lista = document.getElementById('lista-solicitacoes');
  lista.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Carregando…</p>`;
  let query = supabase.from('solicitacoes_documentos')
    .select('*, alunos(nome), turmas(nome), registrado:registrado_por(nome), concluido:concluido_por(nome)')
    .order('data_solicitacao', { ascending:false });
  if(ESTADO.solicFiltroStatus) query = query.eq('status', ESTADO.solicFiltroStatus);
  const { data, error } = await query;
  if(error){ lista.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }
  if(!data || !data.length){
    lista.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Nenhuma solicitação encontrada.</p>`;
    return;
  }
  const linhas = data.map(s => `
    <tr data-id="${s.id}">
      <td style="white-space:nowrap;">${fmtData(s.data_solicitacao)}</td>
      <td>${esc(s.tipo_documento === 'Outro' ? (s.documento_outro || 'Outro') : s.tipo_documento)}</td>
      <td>${esc(s.turmas?.nome || '—')}</td>
      <td>${esc(s.alunos?.nome || '—')}</td>
      <td>${esc(s.nome_solicitante)}${s.telefone_solicitante ? '<br/><span style="color:var(--texto-suave);">'+esc(s.telefone_solicitante)+'</span>' : ''}</td>
      <td title="${esc(s.registrado?.nome || '')}">${esc((s.registrado?.nome || '—').split(' ')[0])}</td>
      <td style="white-space:nowrap;">${s.status === 'concluido'
        ? `<span class="pill verde">Concluído</span>`
        : `<span class="pill vermelho">Pendente</span>`}</td>
      <td style="white-space:nowrap;text-align:right;">
        ${s.status === 'pendente' ? `<button class="botao secundario pequeno" data-concluir-solicitacao="${s.id}" style="width:auto;padding:3px 8px;font-size:11px;">Concluir</button>` : ''}
        <button class="btn-icone perigo" data-excluir-solicitacao="${s.id}" title="Excluir solicitação" style="padding:3px 6px;">🗑️</button>
      </td>
    </tr>`).join('');
  lista.innerHTML = `<table class="tabela-compacta"><thead><tr><th>Data</th><th>Documento</th><th>Turma</th><th>Estudante</th><th>Solicitante</th><th>Registrado</th><th>Status</th><th></th></tr></thead><tbody>${linhas}</tbody></table>`;
  lista.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', (e) => {
    if(e.target.closest('[data-concluir-solicitacao], [data-excluir-solicitacao]')) return;
    const solicitacao = data.find(s => s.id === tr.dataset.id);
    if(solicitacao) abrirModalSolicitacao(solicitacao, el);
  }));
  lista.querySelectorAll('[data-concluir-solicitacao]').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    await supabase.from('solicitacoes_documentos').update({
      status: 'concluido', concluido_por: ESTADO.perfil.id, concluido_em: new Date().toISOString(),
    }).eq('id', b.dataset.concluirSolicitacao);
    carregarListaSolicitacoes(el);
  }));
  lista.querySelectorAll('[data-excluir-solicitacao]').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    if(!confirm('Tem certeza que deseja excluir esta solicitação? Essa ação não pode ser desfeita.')) return;
    b.disabled = true;
    const { error } = await supabase.from('solicitacoes_documentos').delete().eq('id', b.dataset.excluirSolicitacao);
    if(error){ alert('Erro ao excluir: ' + error.message); b.disabled = false; return; }
    carregarListaSolicitacoes(el);
  }));
}

function abrirModalSolicitacao(s, elLista){
  const opcoesTurmas = ESTADO.turmas.slice().sort((a,b) => a.nome.localeCompare(b.nome))
    .map(t => `<option value="${t.id}" ${s.turma_id===t.id?'selected':''}>${esc(t.nome)} · ${esc(t.turno)}</option>`).join('');
  const opcoesAlunos = ESTADO.alunos.slice().sort((a,b) => a.nome.localeCompare(b.nome))
    .map(a => `<option value="${a.id}" data-turma="${a.turma_id||''}" ${s.aluno_id===a.id?'selected':''}>${esc(a.nome)}</option>`).join('');
  const opcoesTipo = TIPOS_DOCUMENTO_SOLICITACAO.map(t => `<option value="${esc(t)}" ${s.tipo_documento===t?'selected':''}>${esc(t)}</option>`).join('');

  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:560px;">
      <div class="modal-topo"><h3>Checar solicitação</h3><button data-fechar>✕</button></div>
      <p style="color:var(--texto-suave);font-size:12.5px;margin:-6px 0 16px;">Confira e corrija os dados antes de imprimir ou concluir.</p>
      <div id="msg-modal-solicitacao"></div>
      <div class="campo"><label>Tipo de documento</label><select id="ms-tipo">${opcoesTipo}</select></div>
      <div class="campo" id="ms-campo-outro" style="${s.tipo_documento==='Outro'?'':'display:none;'}"><label>Qual documento?</label><input type="text" id="ms-outro" value="${esc(s.documento_outro||'')}" /></div>
      <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
        <div class="campo"><label>Turma</label><select id="ms-turma"><option value="">—</option>${opcoesTurmas}</select></div>
        <div class="campo"><label>Estudante</label><select id="ms-aluno"><option value="">—</option>${opcoesAlunos}</select></div>
      </div>
      <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
        <div class="campo"><label>Nome do solicitante</label><input type="text" id="ms-solicitante" value="${esc(s.nome_solicitante||'')}" /></div>
        <div class="campo"><label>Telefone do solicitante</label><input type="text" id="ms-telefone" value="${esc(s.telefone_solicitante||'')}" /></div>
      </div>
      <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
        <div class="campo"><label>Data da solicitação</label><input type="date" id="ms-data" value="${esc(s.data_solicitacao||'')}" /></div>
        <div class="campo"><label>Status</label><div style="padding-top:8px;">${s.status==='concluido' ? `<span class="pill verde">Concluído${s.concluido?.nome ? ' — '+esc(s.concluido.nome):''}</span>` : `<span class="pill vermelho">Pendente</span>`}</div></div>
      </div>
      <div class="campo" style="margin-bottom:0;"><label>Observações</label><input type="text" id="ms-obs" value="${esc(s.observacoes||'')}" /></div>
      <p style="font-size:12px;color:var(--texto-suave);margin:10px 0 0;">Registrado por ${esc(s.registrado?.nome || '—')}</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center;">
        <button class="botao terracota pequeno" id="ms-salvar" style="width:auto;">Salvar alterações</button>
        <button class="botao secundario pequeno" id="ms-imprimir" style="width:auto;">Ir para impressão</button>
        ${s.status === 'pendente'
          ? `<button class="botao secundario pequeno" id="ms-concluir" style="width:auto;">Marcar concluída</button>`
          : `<button class="botao secundario pequeno" id="ms-reabrir" style="width:auto;">Reabrir</button>`}
        <button class="btn-icone perigo" id="ms-excluir" title="Excluir solicitação" style="margin-left:auto;">🗑️</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('ms-tipo').addEventListener('change', (e) => {
    document.getElementById('ms-campo-outro').style.display = e.target.value === 'Outro' ? '' : 'none';
  });
  document.getElementById('ms-turma').addEventListener('change', (e) => {
    const turmaId = e.target.value;
    const selectAluno = document.getElementById('ms-aluno');
    Array.from(selectAluno.options).forEach(opt => { opt.hidden = turmaId && opt.value && opt.dataset.turma !== turmaId; });
    if(selectAluno.selectedOptions[0]?.hidden) selectAluno.value = '';
  });
  document.getElementById('ms-aluno').addEventListener('change', (e) => {
    const turmaDoAluno = e.target.selectedOptions[0]?.dataset.turma;
    if(turmaDoAluno) document.getElementById('ms-turma').value = turmaDoAluno;
  });

  function coletarDadosSolicitacao(){
    const tipo = document.getElementById('ms-tipo').value;
    return {
      tipo_documento: tipo,
      documento_outro: tipo === 'Outro' ? (document.getElementById('ms-outro').value.trim() || null) : null,
      turma_id: document.getElementById('ms-turma').value || null,
      aluno_id: document.getElementById('ms-aluno').value || null,
      nome_solicitante: document.getElementById('ms-solicitante').value.trim(),
      telefone_solicitante: document.getElementById('ms-telefone').value.trim() || null,
      data_solicitacao: document.getElementById('ms-data').value || s.data_solicitacao,
      observacoes: document.getElementById('ms-obs').value.trim() || null,
    };
  }

  document.getElementById('ms-salvar').addEventListener('click', async () => {
    const msg = document.getElementById('msg-modal-solicitacao');
    const dados = coletarDadosSolicitacao();
    if(!dados.nome_solicitante){ msg.innerHTML = `<div class="msg-erro">Informe o nome do solicitante.</div>`; return; }
    const btn = document.getElementById('ms-salvar');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const { error } = await supabase.from('solicitacoes_documentos').update(dados).eq('id', s.id);
    btn.disabled = false; btn.textContent = 'Salvar alterações';
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }
    msg.innerHTML = `<div class="msg-ok">Alterações salvas.</div>`;
    Object.assign(s, dados);
    carregarListaSolicitacoes(elLista);
  });

  document.getElementById('ms-imprimir').addEventListener('click', async () => {
    const msg = document.getElementById('msg-modal-solicitacao');
    const dados = coletarDadosSolicitacao();
    if(!dados.aluno_id){ msg.innerHTML = `<div class="msg-erro">Selecione um estudante para gerar o documento.</div>`; return; }
    const aluno = ESTADO.alunos.find(a => a.id === dados.aluno_id);
    if(!aluno){ msg.innerHTML = `<div class="msg-erro">Estudante não encontrado.</div>`; return; }
    const mapaTipo = {
      'Declaração de Matrícula':'declaracao_matricula',
      'Declaração de Frequência Escolar':'declaracao_frequencia',
      'Declaração Provisória de Transferência':'declaracao_provisoria',
    };
    if(!mapaTipo[dados.tipo_documento] && dados.tipo_documento !== 'Histórico Escolar'){
      msg.innerHTML = `<div class="msg-erro">Este tipo de documento não tem geração automática nesta tela. Providencie manualmente e depois marque como concluída.</div>`;
      return;
    }
    await supabase.from('solicitacoes_documentos').update(dados).eq('id', s.id);
    modal.remove();
    if(mapaTipo[dados.tipo_documento]){
      ESTADO.docTipo = mapaTipo[dados.tipo_documento];
      ESTADO.docTurmaId = aluno.turma_id || '';
      ESTADO.docAlunoId = aluno.id;
      ESTADO.subDocumentos = 'declaracoes';
    } else {
      ESTADO.histEscAlunoId = aluno.id;
      ESTADO.histEscTurmaId = aluno.turma_id || '';
      ESTADO.subDocumentos = 'historico_escolar';
    }
    renderizarApp();
  });

  if(s.status === 'pendente'){
    document.getElementById('ms-concluir').addEventListener('click', async () => {
      await supabase.from('solicitacoes_documentos').update({
        status: 'concluido', concluido_por: ESTADO.perfil.id, concluido_em: new Date().toISOString(),
      }).eq('id', s.id);
      modal.remove();
      carregarListaSolicitacoes(elLista);
    });
  } else {
    document.getElementById('ms-reabrir').addEventListener('click', async () => {
      await supabase.from('solicitacoes_documentos').update({
        status: 'pendente', concluido_por: null, concluido_em: null,
      }).eq('id', s.id);
      modal.remove();
      carregarListaSolicitacoes(elLista);
    });
  }

  document.getElementById('ms-excluir').addEventListener('click', async () => {
    if(!confirm('Tem certeza que deseja excluir esta solicitação? Essa ação não pode ser desfeita.')) return;
    const { error } = await supabase.from('solicitacoes_documentos').delete().eq('id', s.id);
    if(error){ alert('Erro ao excluir: ' + error.message); return; }
    modal.remove();
    carregarListaSolicitacoes(elLista);
  });
}

  const mae = (vinculos||[]).find(v => v.tipo === 'mae');
  const pai = (vinculos||[]).find(v => v.tipo === 'pai');
