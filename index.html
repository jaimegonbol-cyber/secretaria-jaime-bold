        <div class="campo" style="margin:0;min-width:160px;"><label>Data</label><div id="freq-func-data" class="seletor-data-wrap"></div></div>
      </div>
      <div id="freq-func-lista" style="padding:6px 14px;"></div>
      <div style="padding:0 14px 16px;">
        <div id="msg-freq-func" style="margin-bottom:8px;"></div>
        <button class="botao terracota pequeno" id="btn-salvar-freq-func" style="width:auto;">Salvar frequência</button>
      </div>
    </div>`;

  document.getElementById('btn-bater-ponto-facial').addEventListener('click', () => abrirModalBaterPonto());
  document.getElementById('btn-relatorio-freq-func').addEventListener('click', () => gerarRelatorioFrequenciaFuncionarios());
  document.getElementById('btn-relatorio-mensal-freq-func').addEventListener('click', () => gerarRelatorioMensalFrequenciaFuncionarios());
  criarSeletorData('freq-func-data', ESTADO.freqFuncData, (novaData) => { ESTADO.freqFuncData = novaData; carregarFrequenciaFuncionariosDia(el); }, { statusDiasFn: statusDiasFuncionarios });

  carregarFrequenciaFuncionariosDia(el);
}

async function carregarFrequenciaFuncionariosDia(el){
  const listaEl = document.getElementById('freq-func-lista');
  if(!listaEl) return;
  listaEl.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;padding:10px 0;">Carregando…</p>`;

  const ativos = ESTADO.funcionarios.filter(f => f.ativo).slice().sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const [{ data: registros, error }, { data: feriadoData }, { data: feriasNoDia }, { data: convocacoesNoDia }] = await Promise.all([
    supabase.from('frequencia_funcionarios').select('*').eq('data', ESTADO.freqFuncData),
    supabase.from('feriados').select('*').eq('data', ESTADO.freqFuncData).maybeSingle(),
    supabase.from('ferias_funcionarios').select('funcionario_id, data_inicio, data_fim').lte('data_inicio', ESTADO.freqFuncData).gte('data_fim', ESTADO.freqFuncData),
    supabase.from('convocacoes_dia_nao_letivo').select('data, funcoes, descricao').eq('data', ESTADO.freqFuncData),
  ]);
  if(error){ listaEl.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }
  const porFuncionario = {};
  (registros||[]).forEach(r => { porFuncionario[r.funcionario_id] = r; });

  // dia útil (calendário do pessoal administrativo): dia de semana, exceto feriado/ponto facultativo — recesso não conta, pois administrativo trabalha normalmente
  // dia letivo (calendário de professores/coordenação/apoio): dia de semana, exceto feriado/ponto facultativo/recesso — igual ao calendário escolar dos estudantes
  const diaSemana = new Date(ESTADO.freqFuncData + 'T00:00:00').getDay();
  const ehFimDeSemana = diaSemana === 0 || diaSemana === 6;
  const bloqueiaAmbos = ehFimDeSemana || (feriadoData && (feriadoData.tipo === 'feriado' || feriadoData.tipo === 'ponto_facultativo'));
  const ehRecesso = !!feriadoData && feriadoData.tipo === 'recesso';
  const ehSuspensao = !!feriadoData && feriadoData.tipo === 'suspensao_aulas';
  const diaUtil = !bloqueiaAmbos;
  const diaLetivo = !bloqueiaAmbos && !ehRecesso;
  let motivoBloqueio = '';
  if(ehFimDeSemana) motivoBloqueio = diaSemana === 0 ? 'Domingo' : 'Sábado';
  else if(feriadoData) motivoBloqueio = rotuloTipoFeriado(feriadoData) + (feriadoData.descricao ? ` — ${esc(feriadoData.descricao)}` : '');

  if(!ativos.length){
    listaEl.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;padding:10px 0;">Nenhum funcionário ativo cadastrado.</p>`;
    return;
  }

  listaEl.innerHTML = `
    <p style="font-size:11.5px;color:var(--texto-suave);margin:0 0 10px;">
      <span class="pill ${diaUtil?'verde':'vermelho'}" style="margin-right:6px;">${diaUtil?'Dia útil':'Não é dia útil'}</span>
      <span class="pill ${diaLetivo?'verde':'cinza'}">${diaLetivo?'Dia letivo':'Não é dia letivo'}</span>
      ${!diaUtil || !diaLetivo ? ` — ${motivoBloqueio}` : ''}
      ${ehSuspensao && diaUtil ? ` <span class="pill laranja">${motivoBloqueio}</span>` : ''}
      &nbsp;·&nbsp; Administrativo segue o calendário de dias úteis; professores, coordenação e apoio seguem o calendário de dias letivos.
    </p>
  ` + ativos.map(f => {
    const r = porFuncionario[f.id] || {};
    const status = r.status || 'presente';
    const seguirDiaUtil = funcionarioSegueDiaUtil(f);
    const bloqueadoPorSuspensao = ehSuspensao && turnoAfetaSuspensao(f.turno, feriadoData.turno_afetado);
    const emFerias = funcionarioEmFerias(f.id, ESTADO.freqFuncData, feriasNoDia);
    const convocado = ehRecesso && !seguirDiaUtil && funcionarioConvocadoNoDia(f, ESTADO.freqFuncData, convocacoesNoDia);
    const diaValidoParaEste = ((seguirDiaUtil ? diaUtil : diaLetivo) || convocado) && !bloqueadoPorSuspensao && !emFerias;
    if(!diaValidoParaEste){
      return `
      <div class="linha-freq-func-bloqueada" style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #F0ECE0;flex-wrap:wrap;opacity:.6;">
        <div style="flex:1;min-width:190px;">
          <div style="font-weight:600;font-size:13.5px;">${esc(f.nome)}</div>
          <div style="font-size:11.5px;color:var(--texto-suave);">${esc(f.funcao)}${f.categoria?' · '+esc(rotuloCategoria(f.categoria)):''}</div>
        </div>
        <span class="pill cinza">${emFerias ? '🏖️ Férias' : (bloqueadoPorSuspensao ? motivoBloqueio : (seguirDiaUtil ? 'Não é dia útil' : 'Não é dia letivo'))} — sem expediente</span>
      </div>`;
    }
    return `
    <div class="linha-freq-func" data-func-id="${f.id}" data-status-atual="${status}" style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #F0ECE0;flex-wrap:wrap;">
      <div style="flex:1;min-width:190px;">
        <div style="font-weight:600;font-size:13.5px;">${esc(f.nome)}${convocado ? ' <span class="pill laranja" style="font-size:10.5px;">📋 Convocado(a)</span>' : ''}</div>
        <div style="font-size:11.5px;color:var(--texto-suave);">${esc(f.funcao)}${f.categoria?' · '+esc(rotuloCategoria(f.categoria)):''}</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button type="button" class="botao-status ${status==='presente'?'ativo verde':''}" data-status="presente" style="width:auto;padding:6px 12px;font-size:12.5px;">Presente</button>
        <button type="button" class="botao-status ${status==='falta'?'ativo vermelho':''}" data-status="falta" style="width:auto;padding:6px 12px;font-size:12.5px;">Falta</button>
        <button type="button" class="botao-status ${status==='falta_justificada'?'ativo laranja':''}" data-status="falta_justificada" style="width:auto;padding:6px 12px;font-size:12.5px;">Falta Justificada</button>
        <button type="button" class="botao-status ${status==='licenca'?'ativo azul':''}" data-status="licenca" style="width:auto;padding:6px 12px;font-size:12.5px;">Licença</button>
      </div>
      <div class="campos-justificativa" style="display:${status==='falta_justificada'?'flex':'none'};gap:8px;align-items:center;">
        <select class="sel-tipo-justificativa" style="width:auto;padding:6px 8px;font-size:12.5px;">
          ${TIPOS_JUSTIFICATIVA_FUNCIONARIO.map(([chave,nome]) => `<option value="${chave}" ${r.tipo_justificativa===chave?'selected':''}>${nome}</option>`).join('')}
        </select>
        <input type="number" min="1" class="input-dias-atestado" placeholder="Dias" value="${r.quantidade_dias_atestado||''}" style="width:70px;padding:6px 8px;font-size:12.5px;display:${(r.tipo_justificativa||'atestado')==='atestado'?'':'none'};" />
      </div>
      <div class="campos-licenca" style="display:${status==='licenca'?'flex':'none'};gap:8px;align-items:center;">
        <label style="font-size:11px;color:var(--texto-suave);display:flex;flex-direction:column;gap:2px;">Início
          <input type="date" class="input-inicio-licenca" value="${r.data_inicio_licenca || ESTADO.freqFuncData}" style="padding:6px 8px;font-size:12.5px;" />
        </label>
        <label style="font-size:11px;color:var(--texto-suave);display:flex;flex-direction:column;gap:2px;">Qtde. dias
          <input type="number" min="1" max="365" class="input-dias-licenca" placeholder="Dias" value="${r.quantidade_dias_licenca||''}" style="width:70px;padding:6px 8px;font-size:12.5px;" />
        </label>
        ${r.status === 'licenca' && r.dias_restantes_licenca ? `<span class="pill azul" style="font-size:10.5px;">${r.dias_restantes_licenca} dia(s) restante(s)</span>` : ''}
      </div>
    </div>`;
  }).join('');

  listaEl.querySelectorAll('.linha-freq-func').forEach(linha => {
    const botoes = linha.querySelectorAll('.botao-status');
    const camposJustif = linha.querySelector('.campos-justificativa');
    const camposLicenca = linha.querySelector('.campos-licenca');
    const selTipo = linha.querySelector('.sel-tipo-justificativa');
    const inputDias = linha.querySelector('.input-dias-atestado');
    botoes.forEach(b => b.addEventListener('click', () => {
      botoes.forEach(x => x.classList.remove('ativo','verde','vermelho','laranja','azul'));
      const st = b.dataset.status;
      b.classList.add('ativo', st==='presente'?'verde':(st==='falta'?'vermelho':(st==='licenca'?'azul':'laranja')));
      linha.dataset.statusAtual = st;
      camposJustif.style.display = st === 'falta_justificada' ? 'flex' : 'none';
      if(camposLicenca) camposLicenca.style.display = st === 'licenca' ? 'flex' : 'none';
    }));
    if(selTipo && inputDias){
      selTipo.addEventListener('change', () => {
        inputDias.style.display = selTipo.value === 'atestado' ? '' : 'none';
      });
    }
  });

  const btnSalvar = document.getElementById('btn-salvar-freq-func');
  if(btnSalvar && !btnSalvar.dataset.wired){
    btnSalvar.dataset.wired = '1';
    btnSalvar.addEventListener('click', async () => {
      const msg = document.getElementById('msg-freq-func');
      btnSalvar.disabled = true; btnSalvar.textContent = 'Salvando…';
      const linhas = Array.from(document.querySelectorAll('.linha-freq-func'));
      const dadosSalvar = [];
      linhas.forEach(linha => {
        const status = linha.dataset.statusAtual || 'presente';
        const funcionarioId = linha.dataset.funcId;
        const selTipo = linha.querySelector('.sel-tipo-justificativa');
        const inputDias = linha.querySelector('.input-dias-atestado');
        const inputInicioLicenca = linha.querySelector('.input-inicio-licenca');
        const inputDiasLicenca = linha.querySelector('.input-dias-licenca');
        const tipoJustificativa = status === 'falta_justificada' ? selTipo.value : null;
        const dias = (status === 'falta_justificada' && tipoJustificativa === 'atestado' && inputDias.value)
          ? parseInt(inputDias.value, 10) : null;

        if(status === 'licenca'){
          const dataInicio = inputInicioLicenca.value || ESTADO.freqFuncData;
          const nDias = parseInt(inputDiasLicenca.value, 10) || 1;
          const dataBase = new Date(dataInicio + 'T00:00:00');
          // contagem regressiva: o primeiro dia mostra o total de dias, e cada dia seguinte mostra
          // quantos dias ainda restam (ex: licença de 5 dias → 5, 4, 3, 2, 1)
          for(let i=0;i<nDias;i++){
            const d = new Date(dataBase); d.setDate(d.getDate()+i);
            dadosSalvar.push({
              funcionario_id: funcionarioId,
              data: dataObjParaISO(d),
              status: 'licenca',
              data_inicio_licenca: dataInicio,
              quantidade_dias_licenca: nDias,
              dias_restantes_licenca: nDias - i,
              registrado_por: ESTADO.perfil.id,
              atualizado_em: new Date().toISOString(),
            });
          }
        } else {
          dadosSalvar.push({
            funcionario_id: funcionarioId,
            data: ESTADO.freqFuncData,
            status,
            tipo_justificativa: tipoJustificativa,
            quantidade_dias_atestado: dias,
            data_inicio_licenca: null,
            quantidade_dias_licenca: null,
            dias_restantes_licenca: null,
            registrado_por: ESTADO.perfil.id,
            atualizado_em: new Date().toISOString(),
          });
        }
      });
      const { error: erroSalvar } = await supabase.from('frequencia_funcionarios').upsert(dadosSalvar, { onConflict: 'funcionario_id,data' });
      btnSalvar.disabled = false; btnSalvar.textContent = 'Salvar frequência';
      if(erroSalvar){ msg.innerHTML = `<div class="msg-erro">${esc(erroSalvar.message)}</div>`; return; }
      msg.innerHTML = `<div class="msg-ok">Frequência salva com sucesso.</div>`;
      carregarFrequenciaFuncionariosDia(el);
    });
  }
}

async function gerarRelatorioFrequenciaFuncionarios(){
  const [{ data: registros, error }, { data: feriadoData }, { data: feriasNoDia }, { data: convocacoesNoDia }] = await Promise.all([
    supabase.from('frequencia_funcionarios').select('*').eq('data', ESTADO.freqFuncData),
    supabase.from('feriados').select('*').eq('data', ESTADO.freqFuncData).maybeSingle(),
    supabase.from('ferias_funcionarios').select('funcionario_id, data_inicio, data_fim').lte('data_inicio', ESTADO.freqFuncData).gte('data_fim', ESTADO.freqFuncData),
    supabase.from('convocacoes_dia_nao_letivo').select('data, funcoes').eq('data', ESTADO.freqFuncData),
  ]);
  if(error){ alert('Erro ao gerar relatório: ' + error.message); return; }

  const diaSemana = new Date(ESTADO.freqFuncData + 'T00:00:00').getDay();
  const ehFimDeSemana = diaSemana === 0 || diaSemana === 6;
  const bloqueiaAmbos = ehFimDeSemana || (feriadoData && (feriadoData.tipo === 'feriado' || feriadoData.tipo === 'ponto_facultativo'));
  const ehRecesso = !!feriadoData && feriadoData.tipo === 'recesso';
  const ehSuspensao = !!feriadoData && feriadoData.tipo === 'suspensao_aulas';
  const diaUtil = !bloqueiaAmbos;
  const diaLetivo = !bloqueiaAmbos && !ehRecesso;
  const temExpediente = (f) => {
    const seguirDiaUtil = funcionarioSegueDiaUtil(f);
    const convocado = ehRecesso && !seguirDiaUtil && funcionarioConvocadoNoDia(f, ESTADO.freqFuncData, convocacoesNoDia);
    if(!((seguirDiaUtil ? diaUtil : diaLetivo) || convocado)) return false;
    if(ehSuspensao && turnoAfetaSuspensao(f.turno, feriadoData.turno_afetado)) return false;
    if(funcionarioEmFerias(f.id, ESTADO.freqFuncData, feriasNoDia)) return false;
    return true;
  };

  const ativos = ESTADO.funcionarios.filter(f => f.ativo);
  const porFuncionarioId = {};
  (registros||[]).forEach(r => { porFuncionarioId[r.funcionario_id] = r; });

  const porCategoria = {};
  CATEGORIAS_FUNCIONARIO.forEach(([chave, nome]) => { porCategoria[chave] = { nome, total:0, comExpediente:0, presentes:0, faltas:0, faltasJustificadas:0, licencas:0, diasAtestado:0, justificativas:{} }; });
  porCategoria['sem_categoria'] = { nome:'Sem categoria', total:0, comExpediente:0, presentes:0, faltas:0, faltasJustificadas:0, licencas:0, diasAtestado:0, justificativas:{} };

  ativos.forEach(f => {
    const chave = (f.categoria && porCategoria[f.categoria]) ? f.categoria : 'sem_categoria';
    porCategoria[chave].total++;
    if(!temExpediente(f)) return; // sem expediente nesse dia (fim de semana/feriado/recesso conforme o calendário do cargo)
    porCategoria[chave].comExpediente++;
    const r = porFuncionarioId[f.id];
    if(!r) return;
    if(r.status === 'presente') porCategoria[chave].presentes++;
    else if(r.status === 'falta') porCategoria[chave].faltas++;
    else if(r.status === 'licenca') porCategoria[chave].licencas++;
    else if(r.status === 'falta_justificada'){
      porCategoria[chave].faltasJustificadas++;
      const tipo = r.tipo_justificativa || 'outros';
      porCategoria[chave].justificativas[tipo] = (porCategoria[chave].justificativas[tipo]||0) + 1;
      if(tipo === 'atestado' && r.quantidade_dias_atestado) porCategoria[chave].diasAtestado += r.quantidade_dias_atestado;
    }
  });

  const linhasResumo = Object.entries(porCategoria).filter(([,c]) => c.total > 0).map(([,c]) => {
    const semRegistro = c.comExpediente - c.presentes - c.faltas - c.faltasJustificadas - c.licencas;
    const justifTexto = Object.entries(c.justificativas).map(([tipo,qtd]) => `${rotuloJustificativaFuncionario(tipo)}: ${qtd}`).join(', ') || '—';
    return `<tr>
      <td style="text-align:left;padding-left:8px;"><b>${esc(c.nome)}</b></td>
      <td>${c.total}</td>
      <td>${c.comExpediente}</td>
      <td style="color:#1f6b39;font-weight:700;">${c.presentes}</td>
      <td style="color:#b4432e;font-weight:700;">${c.faltas}</td>
      <td style="color:#9a5b12;font-weight:700;">${c.faltasJustificadas}</td>
      <td style="font-size:9.5px;text-align:left;padding-left:6px;">${esc(justifTexto)}</td>
      <td>${c.diasAtestado || '—'}</td>
      <td style="color:#1f4f8b;font-weight:700;">${c.licencas || '—'}</td>
      <td>${semRegistro > 0 ? semRegistro : '—'}</td>
    </tr>`;
  }).join('');

  const totais = Object.values(porCategoria).reduce((acc, c) => {
    acc.total += c.total; acc.comExpediente += c.comExpediente; acc.presentes += c.presentes; acc.faltas += c.faltas; acc.faltasJustificadas += c.faltasJustificadas; acc.diasAtestado += c.diasAtestado; acc.licencas += c.licencas;
    return acc;
  }, { total:0, comExpediente:0, presentes:0, faltas:0, faltasJustificadas:0, diasAtestado:0, licencas:0 });

  const linhasDetalhe = ativos.slice().sort((a,b) => {
    const catA = a.categoria || 'zzz', catB = b.categoria || 'zzz';
    if(catA !== catB) return catA.localeCompare(catB);
    return a.nome.localeCompare(b.nome, 'pt-BR');
  }).map(f => {
    const r = porFuncionarioId[f.id];
    const semExpediente = !temExpediente(f);
    const statusTxt = semExpediente ? 'SEM EXPEDIENTE' : (!r ? '—' : (r.status === 'presente' ? 'PRESENTE' : r.status === 'falta' ? 'FALTA' :
      r.status === 'licenca' ? `LICENÇA (${r.dias_restantes_licenca||'?'}/${r.quantidade_dias_licenca||'?'} dias restantes)` :
      `FALTA JUST. (${rotuloJustificativaFuncionario(r.tipo_justificativa)}${r.quantidade_dias_atestado ? ' · '+r.quantidade_dias_atestado+'d' : ''})`));
    const cor = semExpediente ? '#999' : (!r ? '#999' : (r.status === 'presente' ? '#1f6b39' : r.status === 'falta' ? '#b4432e' : r.status === 'licenca' ? '#1f4f8b' : '#9a5b12'));
    return `<tr>
      <td style="text-align:left;padding-left:6px;">${esc(f.nome)}</td>
      <td>${esc(f.funcao)}</td>
      <td>${f.categoria ? esc(rotuloCategoria(f.categoria)) : '—'}</td>
      <td style="color:${cor};font-weight:700;">${statusTxt}</td>
    </tr>`;
  }).join('');

  const janela = window.open('', '_blank');
  janela.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8" />
    <title>Frequência de Funcionários - ${formatarDataBR(ESTADO.freqFuncData)}</title>
    <style>
      @page{size:A4;margin:14mm;}
      *{box-sizing:border-box;}
      body{font-family:Arial,Helvetica,sans-serif;color:#111;font-size:10.8px;line-height:1.4;}
      h1{font-size:16px;text-align:center;margin:0 0 2px;}
      p.sub{text-align:center;color:#555;font-size:11.5px;margin:0 0 16px;}
      table{width:100%;border-collapse:collapse;margin-bottom:16px;}
      th, td{border:1px solid #333;padding:5px 4px;text-align:center;}
      th{background:#f2f2f2;font-size:9.6px;}
      tfoot td{font-weight:700;background:#fafafa;}
      h2{font-size:12.5px;margin:14px 0 6px;text-transform:uppercase;}
    </style>
    </head><body>
      <h1>Frequência Diária de Funcionários</h1>
      <p class="sub">Escola Municipal Jaime Gonçalves Bold · ${formatarDataBR(ESTADO.freqFuncData)}</p>

      <h2>Resumo por categoria</h2>
      <table>
        <thead><tr><th>Categoria</th><th>Ativos</th><th>Com expediente</th><th>Presentes</th><th>Faltas</th><th>Faltas Just.</th><th>Detalhe das justificativas</th><th>Dias atestado</th><th>Licenças</th><th>Sem registro</th></tr></thead>
        <tbody>${linhasResumo}</tbody>
        <tfoot><tr>
          <td style="text-align:left;padding-left:8px;">TOTAL</td>
          <td>${totais.total}</td><td>${totais.comExpediente}</td><td>${totais.presentes}</td><td>${totais.faltas}</td><td>${totais.faltasJustificadas}</td>
          <td></td><td>${totais.diasAtestado || '—'}</td><td>${totais.licencas || '—'}</td><td></td>
        </tr></tfoot>
      </table>

      <h2>Detalhamento por funcionário</h2>
      <table>
        <thead><tr><th>Nome</th><th>Função</th><th>Categoria</th><th>Situação</th></tr></thead>
        <tbody>${linhasDetalhe}</tbody>
      </table>
    </body></html>
  `);
  janela.document.close();
  janela.focus();
  setTimeout(() => janela.print(), 400);
}

async function gerarRelatorioMensalFrequenciaFuncionarios(){
  const [ano, mes] = ESTADO.freqFuncData.split('-').map(Number);
  const primeiroDiaMes = `${ano}-${String(mes).padStart(2,'0')}-01`;
  const ultimoDiaNum = new Date(ano, mes, 0).getDate();
  const ultimoDiaMes = `${ano}-${String(mes).padStart(2,'0')}-${String(ultimoDiaNum).padStart(2,'0')}`;
  const hojeIso = hojeISO();
  const ultimoDiaConsiderado = ultimoDiaMes < hojeIso ? ultimoDiaMes : hojeIso;

  const [{ data: registrosMes, error }, { data: feriadosMes }, { data: feriasMes }, { data: convocacoesMes }] = await Promise.all([
    supabase.from('frequencia_funcionarios').select('*').gte('data', primeiroDiaMes).lte('data', ultimoDiaMes),
    supabase.from('feriados').select('*').gte('data', primeiroDiaMes).lte('data', ultimoDiaMes),
    supabase.from('ferias_funcionarios').select('funcionario_id, data_inicio, data_fim').lte('data_inicio', ultimoDiaMes).gte('data_fim', primeiroDiaMes),
    supabase.from('convocacoes_dia_nao_letivo').select('data, funcoes').gte('data', primeiroDiaMes).lte('data', ultimoDiaMes),
  ]);
  if(error){ alert('Erro ao gerar relatório mensal: ' + error.message); return; }

  const mapaFeriados = {};
  (feriadosMes||[]).forEach(f => { mapaFeriados[f.data] = f; });

  const dias = [];
  for(let d=1; d<=ultimoDiaNum; d++){
    const iso = `${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(iso > ultimoDiaConsiderado) break;
    const diaSemana = new Date(ano, mes-1, d).getDay();
    const ehFimDeSemana = diaSemana === 0 || diaSemana === 6;
    const feriado = mapaFeriados[iso];
    const bloqueiaAmbos = ehFimDeSemana || (feriado && (feriado.tipo === 'feriado' || feriado.tipo === 'ponto_facultativo'));
    const ehRecesso = !!feriado && feriado.tipo === 'recesso';
    const ehSuspensao = !!feriado && feriado.tipo === 'suspensao_aulas';
    dias.push({ iso, diaUtil: !bloqueiaAmbos, diaLetivo: !bloqueiaAmbos && !ehRecesso, ehRecesso, ehSuspensao, turnoAfetado: feriado ? feriado.turno_afetado : null });
  }

  const ativos = ESTADO.funcionarios.filter(f => f.ativo);
  const registrosPorFuncDia = {};
  (registrosMes||[]).forEach(r => {
    registrosPorFuncDia[r.funcionario_id] = registrosPorFuncDia[r.funcionario_id] || {};
    registrosPorFuncDia[r.funcionario_id][r.data] = r;
  });

  const linhasCalculadas = ativos.slice().sort((a,b) => {
    const catA = a.categoria || 'zzz', catB = b.categoria || 'zzz';
    if(catA !== catB) return catA.localeCompare(catB);
    return a.nome.localeCompare(b.nome, 'pt-BR');
  }).map(f => {
    const temExpedienteDia = (dia) => {
      const seguirDiaUtil = funcionarioSegueDiaUtil(f);
      const convocado = dia.ehRecesso && !seguirDiaUtil && funcionarioConvocadoNoDia(f, dia.iso, convocacoesMes);
      if(!((seguirDiaUtil ? dia.diaUtil : dia.diaLetivo) || convocado)) return false;
      if(dia.ehSuspensao && turnoAfetaSuspensao(f.turno, dia.turnoAfetado)) return false;
      if(funcionarioEmFerias(f.id, dia.iso, feriasMes)) return false;
      return true;
    };
    let comExpediente=0, presentes=0, faltas=0, faltasJust=0, diasAtestado=0, licencas=0, semRegistro=0;
    dias.forEach(dia => {
      if(!temExpedienteDia(dia)) return;
      comExpediente++;
      const r = (registrosPorFuncDia[f.id]||{})[dia.iso];
      if(!r){ semRegistro++; return; }
      if(r.status === 'presente') presentes++;
      else if(r.status === 'falta') faltas++;
      else if(r.status === 'licenca') licencas++;
      else if(r.status === 'falta_justificada'){
        faltasJust++;
        if(r.tipo_justificativa === 'atestado' && r.quantidade_dias_atestado) diasAtestado += r.quantidade_dias_atestado;
      }
    });
    return { f, comExpediente, presentes, faltas, faltasJust, diasAtestado, licencas, semRegistro };
  });

  const linhasHtml = linhasCalculadas.map(l => `<tr>
      <td style="text-align:left;padding-left:6px;">${esc(l.f.nome)}</td>
      <td style="text-align:left;padding-left:6px;">${esc(l.f.funcao)}</td>
      <td>${l.f.categoria ? esc(rotuloCategoria(l.f.categoria)) : '—'}</td>
      <td>${l.comExpediente}</td>
      <td style="color:#1f6b39;font-weight:700;">${l.presentes}</td>
      <td style="color:#b4432e;font-weight:700;">${l.faltas}</td>
      <td style="color:#9a5b12;font-weight:700;">${l.faltasJust}</td>
      <td>${l.diasAtestado || '—'}</td>
      <td style="color:#1f4f8b;font-weight:700;">${l.licencas || '—'}</td>
      <td>${l.semRegistro > 0 ? l.semRegistro : '—'}</td>
    </tr>`).join('');

  const totais = linhasCalculadas.reduce((acc,l) => {
    acc.comExpediente+=l.comExpediente; acc.presentes+=l.presentes; acc.faltas+=l.faltas;
    acc.faltasJust+=l.faltasJust; acc.diasAtestado+=l.diasAtestado; acc.licencas+=l.licencas; acc.semRegistro+=l.semRegistro;
    return acc;
  }, { comExpediente:0, presentes:0, faltas:0, faltasJust:0, diasAtestado:0, licencas:0, semRegistro:0 });

  const nomeMes = MESES_PT[mes-1];
  const janela = window.open('', '_blank');
  janela.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8" />
    <title>Frequência Mensal de Funcionários - ${nomeMes} de ${ano}</title>
    <style>
      @page{size:A4;margin:14mm;}
      *{box-sizing:border-box;}
      body{font-family:Arial,Helvetica,sans-serif;color:#111;font-size:10.5px;line-height:1.4;}
      h1{font-size:16px;text-align:center;margin:0 0 2px;}
      p.sub{text-align:center;color:#555;font-size:11.5px;margin:0 0 16px;}
      table{width:100%;border-collapse:collapse;margin-bottom:16px;}
      th, td{border:1px solid #333;padding:5px 4px;text-align:center;}
      th{background:#f2f2f2;font-size:9.6px;}
      tfoot td{font-weight:700;background:#fafafa;}
    </style>
    </head><body>
      <h1>Frequência Mensal de Funcionários</h1>
      <p class="sub">Escola Municipal Jaime Gonçalves Bold · ${nomeMes} de ${ano}${ultimoDiaConsiderado < ultimoDiaMes ? ' (parcial, até ' + formatarDataBR(ultimoDiaConsiderado) + ')' : ''}</p>

      <table>
        <thead><tr><th>Nome</th><th>Função</th><th>Categoria</th><th>Dias com expediente</th><th>Presenças</th><th>Faltas</th><th>Faltas Just.</th><th>Dias atestado</th><th>Licenças</th><th>Sem registro</th></tr></thead>
        <tbody>${linhasHtml}</tbody>
        <tfoot><tr>
          <td colspan="3" style="text-align:left;padding-left:8px;">TOTAL</td>
          <td>${totais.comExpediente}</td><td>${totais.presentes}</td><td>${totais.faltas}</td><td>${totais.faltasJust}</td>
          <td>${totais.diasAtestado || '—'}</td><td>${totais.licencas || '—'}</td><td>${totais.semRegistro || '—'}</td>
        </tr></tfoot>
      </table>
    </body></html>
  `);
  janela.document.close();
  janela.focus();
  setTimeout(() => janela.print(), 400);
}

let FACE_API_PROMESSA = null;
const FACE_API_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
const FACE_API_LIMIAR_DISTANCIA = 0.5; // quanto menor, mais rígido o reconhecimento (0.5 é um valor conservador)

function carregarFaceApi(){
  if(FACE_API_PROMESSA) return FACE_API_PROMESSA;
  FACE_API_PROMESSA = (async () => {
    if(!window.faceapi){
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('Não foi possível carregar a biblioteca de reconhecimento facial. Verifique sua conexão com a internet.'));
        document.head.appendChild(script);
      });
    }
    await Promise.all([
      window.faceapi.nets.tinyFaceDetector.loadFromUri(FACE_API_MODEL_URL),
      window.faceapi.nets.faceLandmark68Net.loadFromUri(FACE_API_MODEL_URL),
      window.faceapi.nets.faceRecognitionNet.loadFromUri(FACE_API_MODEL_URL),
    ]);
    return window.faceapi;
  })();
  return FACE_API_PROMESSA;
}

function distanciaDescritores(a, b){
  let soma = 0;
  for(let i = 0; i < a.length; i++) soma += (a[i] - b[i]) ** 2;
  return Math.sqrt(soma);
}

async function detectarDescritorNoVideo(faceapi, video){
  const deteccao = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks().withFaceDescriptor();
  return deteccao ? Array.from(deteccao.descriptor) : null;
}

function abrirModalCadastrarRosto(funcionario){

  modal.className = 'fundo-modal';
  modal.innerHTML = `

      <div class="modal-topo"><h3>Cadastrar rosto — ${esc(funcionario.nome)}</h3><button data-fechar>✕</button></div>

        <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;margin:14px 0;cursor:pointer;text-align:left;">

          <button class="botao terracota pequeno" id="btn-aceitar-termo" style="width:auto;" disabled>Aceitar e continuar</button>

        <p style="font-size:13px;color:var(--texto-suave);margin-bottom:10px;">Posicione o rosto bem iluminado, olhando para a câmera, e clique em capturar.</p>
        <div id="face-status" style="font-size:13px;margin-bottom:10px;"></div>
        <video id="face-video" autoplay muted playsinline style="width:100%;max-width:340px;border-radius:12px;background:#111;transform:scaleX(-1);"></video>
        <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;">
          <button class="botao secundario pequeno" data-fechar>Cancelar</button>
          <button class="botao terracota pequeno" id="btn-capturar-rosto" style="width:auto;" disabled>Capturar</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => { encerrarCameraDoModal(); modal.remove(); }));
  modal.addEventListener('click', (e) => { if(e.target === modal){ encerrarCameraDoModal(); modal.remove(); } });

  let stream = null;
  function encerrarCameraDoModal(){
    if(stream) stream.getTracks().forEach(t => t.stop());
  }

  modal.querySelector('#btn-imprimir-termo').addEventListener('click', () => imprimirTermoConsentimentoFacial(funcionario));
  modal.querySelector('#chk-aceite-termo').addEventListener('change', (e) => {
    modal.querySelector('#btn-aceitar-termo').disabled = !e.target.checked;
  });
  modal.querySelector('#btn-aceitar-termo').addEventListener('click', async () => {
    const btnAceitar = modal.querySelector('#btn-aceitar-termo');
    btnAceitar.disabled = true; btnAceitar.textContent = 'Registrando…';
    const agora = new Date().toISOString();
    await supabase.from('funcionarios').update({ termo_facial_aceito_em: agora }).eq('id', funcionario.id);
    funcionario.termo_facial_aceito_em = agora;
    modal.querySelector('#etapa-termo').style.display = 'none';
    modal.querySelector('#etapa-camera').style.display = '';
    iniciarCameraCadastro();
  });

  function iniciarCameraCadastro(){
    const video = modal.querySelector('#face-video');
    const status = modal.querySelector('#face-status');
    const btnCapturar = modal.querySelector('#btn-capturar-rosto');
    (async () => {
      try{
        status.textContent = 'Carregando reconhecimento facial…';
        const faceapi = await carregarFaceApi();
        status.textContent = 'Solicitando acesso à câmera…';
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
        status.textContent = 'Pronto — posicione o rosto e capture.';
        btnCapturar.disabled = false;
        btnCapturar.addEventListener('click', async () => {
          btnCapturar.disabled = true;
          status.textContent = 'Analisando rosto…';
          const descritor = await detectarDescritorNoVideo(faceapi, video);
          if(!descritor){
            status.textContent = 'Não foi possível identificar um rosto. Tente novamente com melhor iluminação.';
            btnCapturar.disabled = false;
            return;
          }
          const { error } = await supabase.from('funcionarios').update({
            face_descriptor: descritor, face_cadastrado_em: new Date().toISOString(),
          }).eq('id', funcionario.id);
          if(error){ status.textContent = 'Erro ao salvar: ' + error.message; btnCapturar.disabled = false; return; }
          funcionario.face_descriptor = descritor;
          status.innerHTML = `<span style="color:#2E7D32;">✅ Rosto cadastrado com sucesso!</span>`;
          encerrarCameraDoModal();
          setTimeout(() => modal.remove(), 1200);
          await carregarDadosBase();
        });
      } catch(erro){
        status.textContent = erro.message || 'Não foi possível acessar a câmera.';
      }
    })();
  }
}

function abrirModalBaterPonto(){
  const cadastrados = ESTADO.funcionarios.filter(f => f.ativo && f.face_descriptor);
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:480px;text-align:center;">
      <div class="modal-topo"><h3>📷 Bater Ponto — Reconhecimento Facial</h3><button data-fechar>✕</button></div>
      ${!cadastrados.length ? `<p style="color:var(--erro);font-size:13.5px;">Nenhum funcionário tem rosto cadastrado ainda. Cadastre pela ficha de cada funcionário antes de usar o bater ponto.</p>`
        : `<p style="font-size:13px;color:var(--texto-suave);margin-bottom:10px;">Olhe para a câmera para registrar sua presença de hoje.</p>
      <div id="face-status" style="font-size:13.5px;font-weight:600;margin-bottom:10px;min-height:20px;"></div>
      <video id="face-video" autoplay muted playsinline style="width:100%;max-width:340px;border-radius:12px;background:#111;transform:scaleX(-1);"></video>`}
      <div style="margin-top:14px;">
        <button class="botao secundario pequeno" data-fechar style="width:auto;">Fechar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  let stream = null;
  let intervalo = null;
  function encerrar(){
    if(stream) stream.getTracks().forEach(t => t.stop());
    if(intervalo) clearInterval(intervalo);
  }
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => { encerrar(); modal.remove(); }));
  modal.addEventListener('click', (e) => { if(e.target === modal){ encerrar(); modal.remove(); } });

  if(!cadastrados.length) return;

  const video = modal.querySelector('#face-video');
  const status = modal.querySelector('#face-status');
  let processando = false;
  let jaRegistrouAgora = null;

  (async () => {
    try{
      status.textContent = 'Carregando reconhecimento facial…';
      const faceapi = await carregarFaceApi();
      status.textContent = 'Solicitando acesso à câmera…';
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      video.srcObject = stream;
      status.textContent = 'Procurando rosto…';

      intervalo = setInterval(async () => {
        if(processando || jaRegistrouAgora) return;
        processando = true;
        try{
          const descritor = await detectarDescritorNoVideo(faceapi, video);
          if(!descritor){ status.textContent = 'Procurando rosto…'; processando = false; return; }
          let melhor = null, menorDistancia = Infinity;
          cadastrados.forEach(f => {
            const d = distanciaDescritores(descritor, f.face_descriptor);
            if(d < menorDistancia){ menorDistancia = d; melhor = f; }
          });
          if(melhor && menorDistancia <= FACE_API_LIMIAR_DISTANCIA){
            jaRegistrouAgora = melhor;
            status.innerHTML = `Reconhecendo <b>${esc(melhor.nome)}</b>…`;
            await registrarPresencaPorReconhecimento(melhor, status);
          } else {
            status.textContent = 'Rosto não reconhecido. Cadastre-o antes ou tente novamente.';
          }
        } catch(e){ /* ignora erro pontual de um frame */ }
        processando = false;
      }, 1200);
    } catch(erro){
      status.textContent = erro.message || 'Não foi possível acessar a câmera.';
    }
  })();
}

async function registrarPresencaPorReconhecimento(funcionario, statusEl){
  const hoje = hojeISO();
  const { error } = await supabase.from('frequencia_funcionarios').upsert({
    funcionario_id: funcionario.id, data: hoje, status: 'presente', registrado_por: ESTADO.perfil.id,
  }, { onConflict: 'funcionario_id,data' });
  if(error){
    statusEl.innerHTML = `<span style="color:var(--erro);">Erro ao registrar: ${esc(error.message)}</span>`;
    return;
  }
  const agora = new Date();
  const hora = `${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;
  statusEl.innerHTML = `<span style="color:#2E7D32;">✅ Bem-vindo(a), ${esc(funcionario.nome)}! Presença registrada às ${hora}.</span>`;
}

function funcionarioEmFerias(funcionarioId, dataIso, feriasLista){
  return (feriasLista||[]).some(fp => fp.funcionario_id === funcionarioId && dataIso >= fp.data_inicio && dataIso <= fp.data_fim);
}

// Verifica se a função do funcionário foi convocada pra ter expediente num dia que normalmente
// seria não letivo (ex: reunião pedagógica no recesso, planejamento no início do ano letivo).
function funcionarioConvocadoNoDia(funcionario, dataIso, convocacoesLista){
  return (convocacoesLista||[]).some(c => c.data === dataIso && (c.funcoes||[]).includes(funcionario.funcao));
}

function abrirModalGerenciarFuncoes(aoFechar){
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:440px;">

      </div>
      <div id="lista-funcoes-cargos"></div>
    </div>`;
  document.body.appendChild(modal);

  function fecharEAtualizar(){
    modal.remove();
    if(aoFechar) aoFechar();
  }
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', fecharEAtualizar));
  modal.addEventListener('click', (e) => { if(e.target === modal) fecharEAtualizar(); });

  function renderizarLista(){
    const lista = modal.querySelector('#lista-funcoes-cargos');
    const ordenadas = ESTADO.funcoesCargos.slice().sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    lista.innerHTML = ordenadas.length ? ordenadas.map(f => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F0ECE0;font-size:13.5px;">
        <span>${esc(f.nome)}</span>

      </div>`).join('') : `<p style="color:var(--texto-suave);font-size:13px;">Nenhuma função cadastrada.</p>`;
    lista.querySelectorAll('[data-remover-funcao]').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('Remover esta função da lista? Funcionários que já usam esse valor não serão alterados.')) return;
      await supabase.from('funcoes_cargos').update({ ativo: false }).eq('id', b.dataset.removerFuncao);
      ESTADO.funcoesCargos = ESTADO.funcoesCargos.filter(f => f.id !== b.dataset.removerFuncao);
      renderizarLista();
    }));
  }
  renderizarLista();

  modal.querySelector('#btn-add-funcao-cargo').addEventListener('click', async () => {
    const msg = modal.querySelector('#msg-funcoes-cargos');
    const input = modal.querySelector('#nova-funcao-cargo');
    const nome = input.value.trim();
    if(!nome){ msg.innerHTML = `<div class="msg-erro">Digite o nome da função.</div>`; return; }
    if(ESTADO.funcoesCargos.some(f => f.nome.toLowerCase() === nome.toLowerCase())){
      msg.innerHTML = `<div class="msg-erro">Essa função já está na lista.</div>`; return;
    }
    msg.innerHTML = '';
    const { data, error } = await supabase.from('funcoes_cargos').insert({ nome }).select().single();
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }
    ESTADO.funcoesCargos.push(data);
    input.value = '';
    renderizarLista();
  });
}

        <div class="grade-2" style="grid-template-columns:2fr 1fr;gap:12px;">
          <div class="campo"><label>Endereço</label><input type="text" id="func-endereco" value="${v('endereco')}" /></div>

        </div>
        <div class="grade-2" style="grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;">
          <div class="campo"><label>Bairro</label><input type="text" id="func-bairro" value="${v('bairro')}" /></div>
          <div class="campo"><label>Cidade</label><input type="text" id="func-cidade" value="${v('cidade')}" /></div>
          <div class="campo"><label>UF</label><input type="text" id="func-uf" maxlength="2" value="${v('uf')}" style="text-transform:uppercase;" /></div>
          <div class="campo"><label>CEP</label><input type="text" id="func-cep" value="${v('cep')}" /></div>
        </div>
        <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
          <div class="campo"><label>E-mail</label><input type="email" id="func-email" value="${v('email')}" /></div>
          <div class="campo"><label>Fator RH</label><input type="text" id="func-fator-rh" value="${v('fator_rh')}" placeholder="Ex: O+, A-…" /></div>
        </div>

        <div class="secao-titulo">Escolaridade</div>
        <div class="grade-2" style="grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div class="campo"><label>Nível</label><select id="func-escolaridade">${opcoesSelect(opcoesEscolaridade, vd('escolaridade'))}</select></div>
          <div class="campo"><label>Instituição</label><input type="text" id="func-instituicao" value="${v('instituicao_ensino')}" /></div>
          <div class="campo"><label>Ano de conclusão</label><input type="text" id="func-ano-conclusao" value="${v('ano_conclusao')}" /></div>
        </div>
        <div class="campo"><label>Informe sua graduação e pós-graduação</label><input type="text" id="func-formacao-detalhada" value="${v('formacao_detalhada')}" placeholder="Ex: Pedagogia (UPE), Pós em Psicopedagogia…" /></div>

        <div class="secao-titulo">Atuação escolar</div>
        <div class="grade-2" style="grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;">
          <div class="campo"><label>Ensino</label><input type="text" id="func-ensino" value="${v('ensino')}" /></div>
          <div class="campo"><label>Disciplinas</label><input type="text" id="func-disciplinas" value="${v('disciplinas')}" /></div>
          <div class="campo"><label>Turno</label><input type="text" id="func-turno" value="${v('turno')}" /></div>
          <div class="campo"><label>Carga horária</label><input type="number" id="func-carga-horaria" value="${v('carga_horaria')}" /></div>
        </div>
        ${editando ? `<div class="campo"><label><input type="checkbox" id="func-ativo" ${funcionario.ativo?'checked':''} style="width:auto;margin-right:6px;" />Ativo</label></div>` : ''}
        <div style="display:flex;gap:10px;align-items:center;">
          <button class="botao terracota" type="submit" id="btn-salvar-funcionario" style="width:auto;">${editando ? 'Salvar alterações' : 'Salvar funcionário'}</button>
          ${editando && ESTADO.perfil.role === 'admin' ? `<button class="botao secundario" type="button" id="btn-excluir-funcionario" style="width:auto;color:var(--erro);border-color:var(--erro);">Excluir funcionário</button>` : ''}
        </div>
      </form>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });
  const linkGerenciarFuncoes = document.getElementById('link-gerenciar-funcoes');
  if(linkGerenciarFuncoes){
    linkGerenciarFuncoes.addEventListener('click', (e) => {
      e.preventDefault();
      abrirModalGerenciarFuncoes(() => {
        const selFuncao = document.getElementById('func-funcao');
        if(!selFuncao) return;
        const valorAtual = selFuncao.value;
        const opcoesAtualizadas = ESTADO.funcoesCargos.slice().sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'))
          .map(f => `<option value="${esc(f.nome)}" ${f.nome===valorAtual?'selected':''}>${esc(f.nome)}</option>`).join('');
        selFuncao.innerHTML = `<option value="" disabled>Selecione…</option>${opcoesAtualizadas}`;
        if(ESTADO.funcoesCargos.some(f => f.nome === valorAtual)) selFuncao.value = valorAtual;
      });
    });
  }
  const btnExcluirForm = document.getElementById('btn-excluir-funcionario');
  if(btnExcluirForm){
    btnExcluirForm.addEventListener('click', async () => {
      if(!confirm(`Excluir o funcionário ${funcionario.nome}? Esta ação não pode ser desfeita.`)) return;
      const { error } = await supabase.from('funcionarios').delete().eq('id', funcionario.id);
      if(error){ alert('Erro ao excluir: ' + error.message); return; }
      modal.remove();
      await carregarDadosBase();
      renderizarApp();
    });
  }

  document.getElementById('func-portador-necessidades').addEventListener('change', (e) => {
    document.getElementById('func-campo-necessidades-qual').style.display = e.target.value === 'sim' ? '' : 'none';
  });

  document.getElementById('btn-ler-anexo-funcionario').addEventListener('click', async () => {
    const arquivo = document.getElementById('func-anexo-leitura').files[0];
    const msgLeitura = document.getElementById('msg-leitura-funcionario');
    if(!arquivo){ msgLeitura.innerHTML = `<div class="msg-erro">Escolha um arquivo primeiro.</div>`; return; }
    const btnLer = document.getElementById('btn-ler-anexo-funcionario');
    btnLer.disabled = true; btnLer.textContent = 'Lendo documento…';
    msgLeitura.innerHTML = `<p style="color:var(--texto-suave);font-size:12.5px;margin:0;">Lendo documento e identificando os dados…</p>`;
    try{
      const base64Data = await new Promise((res, rej) => {
        const leitor = new FileReader();
        leitor.onload = () => res(leitor.result.split(',')[1]);
        leitor.onerror = () => rej(new Error('Falha ao ler o arquivo'));
        leitor.readAsDataURL(arquivo);
      });
      const { data: resposta, error } = await supabase.functions.invoke('extrair-dados-funcionario', {
        body: { mediaType: arquivo.type, base64Data },
      });
      if(error || !resposta || resposta.error){
        msgLeitura.innerHTML = `<div class="msg-erro">${esc((resposta && resposta.error) || 'Não foi possível ler o documento.')}</div>`;
        return;
      }
      const d = resposta.dados || {};
      const mapaCampos = {
        'func-nome': d.nome, 'func-telefone': d.telefone, 'func-data-nascimento': d.data_nascimento,
        'func-sexo': d.sexo, 'func-nacionalidade': d.nacionalidade, 'func-municipio-nascimento': d.municipio_nascimento,
        'func-uf-nascimento': d.uf_nascimento, 'func-cpf': d.cpf, 'func-rg': d.rg, 'func-orgao-expedidor': d.orgao_expedidor,
        'func-rg-uf': d.rg_uf, 'func-mae': d.mae, 'func-pai': d.pai, 'func-pis-pasep': d.pis_pasep,
        'func-titulo-eleitor': d.titulo_eleitor, 'func-zona': d.zona, 'func-secao': d.secao,
        'func-endereco': d.endereco, 'func-complemento': d.complemento, 'func-bairro': d.bairro,
        'func-cidade': d.cidade, 'func-uf': d.uf, 'func-cep': d.cep, 'func-email': d.email,
        'func-instituicao': d.instituicao_ensino, 'func-ano-conclusao': d.ano_conclusao,
        'func-formacao-detalhada': d.formacao_detalhada,
      };
      let preenchidos = 0;
      Object.entries(mapaCampos).forEach(([id, valor]) => {
        if(valor === null || valor === undefined || valor === '') return;
        const campo = document.getElementById(id);
        if(campo && !campo.value){ campo.value = valor; preenchidos++; }
      });
      if(d.escolaridade){
        const selEscolaridade = document.getElementById('func-escolaridade');
        if(selEscolaridade && !selEscolaridade.value && Array.from(selEscolaridade.options).some(o => o.value === d.escolaridade)){
          selEscolaridade.value = d.escolaridade; preenchidos++;
        }
      }
      msgLeitura.innerHTML = preenchidos
        ? `<div class="msg-ok">${preenchidos} campo(s) preenchido(s) a partir do documento — confira antes de salvar.</div>`
        : `<div class="msg-erro">Não encontrei dados aproveitáveis nesse documento (ou os campos já estavam preenchidos).</div>`;
    } catch(err){
      msgLeitura.innerHTML = `<div class="msg-erro">Erro ao processar o arquivo: ${esc(err.message)}</div>`;
    } finally {
      btnLer.disabled = false; btnLer.textContent = 'Ler documento';
    }
  });

  document.getElementById('form-novo-funcionario').addEventListener('submit', async (e) => {
    e.preventDefault();
    const campo = (id) => document.getElementById(id).value.trim() || null;
    const btn = document.getElementById('btn-salvar-funcionario');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const dados = {
      nome: campo('func-nome'),
      funcao: campo('func-funcao'),
      email: campo('func-email'),
      telefone: campo('func-telefone'),
      vinculo: document.getElementById('func-vinculo').value || null,
      matricula: campo('func-matricula'),
      categoria: document.getElementById('func-categoria').value || null,
      data_nascimento: campo('func-data-nascimento'),
      sexo: document.getElementById('func-sexo').value || null,
      cor_raca: document.getElementById('func-cor-raca').value || null,
      estado_civil: document.getElementById('func-estado-civil').value || null,
      nacionalidade: campo('func-nacionalidade'),
      telefone_emergencia: campo('func-telefone-emergencia'),
      portador_necessidades_especiais: document.getElementById('func-portador-necessidades').value === 'sim',
      necessidades_especiais_qual: document.getElementById('func-portador-necessidades').value === 'sim' ? campo('func-necessidades-qual') : null,
      municipio_nascimento: campo('func-municipio-nascimento'),
      uf_nascimento: campo('func-uf-nascimento'),
      cpf: campo('func-cpf'),
      rg: campo('func-rg'),
      orgao_expedidor: campo('func-orgao-expedidor'),
      rg_uf: campo('func-rg-uf'),
      mae: campo('func-mae'),
      pai: campo('func-pai'),
      pis_pasep: campo('func-pis-pasep'),
      titulo_eleitor: campo('func-titulo-eleitor'),
      zona: campo('func-zona'),
      secao: campo('func-secao'),
      endereco: campo('func-endereco'),
      complemento: campo('func-complemento'),
      bairro: campo('func-bairro'),
      cidade: campo('func-cidade'),
      uf: campo('func-uf'),
      cep: campo('func-cep'),
      fator_rh: campo('func-fator-rh'),
      escolaridade: document.getElementById('func-escolaridade').value || null,
      instituicao_ensino: campo('func-instituicao'),
      ano_conclusao: campo('func-ano-conclusao') ? parseInt(campo('func-ano-conclusao'), 10) : null,
      formacao_detalhada: campo('func-formacao-detalhada'),
      ensino: campo('func-ensino'),
      disciplinas: campo('func-disciplinas'),
      turno: campo('func-turno'),
      carga_horaria: campo('func-carga-horaria') ? parseInt(campo('func-carga-horaria'), 10) : null,
    };
    if(editando) dados.ativo = document.getElementById('func-ativo').checked;
    const { error } = editando
      ? await supabase.from('funcionarios').update(dados).eq('id', funcionario.id)
      : await supabase.from('funcionarios').insert(dados);
    if(error){
      document.getElementById('msg-novo-funcionario').innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
      btn.disabled = false; btn.textContent = editando ? 'Salvar alterações' : 'Salvar funcionário';
      return;
    }
    modal.remove();
    await carregarDadosBase();
    renderizarApp();
  });
}

const ABAS_PERMISSIVEIS = [
  { id:'painel', label:'Painel' },
  { id:'agenda', label:'Agenda' },
  { id:'cadastro', label:'Cadastro' },
  { id:'frequencia', label:'Frequência' },
  { id:'documentos', label:'Documentos' },
  { id:'ocorrencias', label:'Ocorrências' },
  { id:'avaliacoes', label:'Avaliações' },
  { id:'relatorios', label:'Relatórios' },
];

function renderizarUsuarios(el){
  const linhas = ESTADO.perfis.map(p => `
    <tr>
      <td>${esc(p.nome)}</td>
      <td>${esc(p.email)}</td>
      <td><span class="pill ${p.role==='admin'?'laranja':(p.role==='coordenacao'?'azul':'verde')}">${rotuloPapel(p.role)}</span></td>
      <td><span class="pill ${p.status==='ativo'?'verde':'vermelho'}">${p.status==='ativo'?'Ativo':'Inativo'}</span></td>
      <td style="white-space:nowrap;">
        <button class="botao secundario pequeno" data-editar-usuario="${p.id}" style="width:auto;padding:4px 10px;">Editar</button>
        <button class="botao secundario pequeno" data-resetar-senha="${p.id}" style="width:auto;padding:4px 10px;">Resetar senha</button>
        ${p.role !== 'admin' ? `<button class="botao secundario pequeno" data-permissoes-usuario="${p.id}" style="width:auto;padding:4px 10px;">Editar permissões</button>` : ''}
        ${p.role !== 'admin' && Array.isArray(p.permissoes) ? `<button class="botao secundario pequeno" data-excluir-permissoes="${p.id}" style="width:auto;padding:4px 10px;">Excluir permissões</button>` : ''}
        ${p.id !== ESTADO.perfil.id ? `<button class="botao ${p.status==='ativo'?'secundario':'terracota'} pequeno" data-bloquear-usuario="${p.id}" data-status-atual="${p.status}" style="width:auto;padding:4px 10px;">${p.status==='ativo'?'Bloquear':'Liberar'}</button>` : ''}
      </td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="cabecalho-pagina">
      <div><h2>Usuários</h2><p>Quem tem acesso ao sistema da secretaria</p></div>
      <button class="botao terracota pequeno" id="btn-convidar">+ Criar acesso</button>
    </div>
    <div id="msg-convite"></div>
    <div class="painel">
      <div style="overflow-x:auto;"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Status</th><th class="col-acoes"></th></tr></thead><tbody>${linhas}</tbody></table></div>
    </div>
    ${ESTADO.perfil.role === 'admin' ? `
    <div class="painel" style="margin-top:16px;">
      <h3 style="margin-top:0;">Segurança do Storage</h3>
      <p style="font-size:13px;color:var(--texto-suave);">Os buckets de arquivos (fotos de estudantes, documentos do histórico e anexos da Agenda) foram tornados privados. Rode esta migração <b>uma única vez</b> para reassinar os links de arquivos já enviados antes dessa mudança — sem isso, fotos e anexos antigos deixam de abrir.</p>
      <div id="msg-migracao-storage"></div>
      <button class="botao secundario" id="btn-migrar-storage" style="width:auto;">Migrar links do Storage</button>
    </div>` : ''}
    <div id="modal-permissoes-area"></div>`;
  document.getElementById('btn-convidar').addEventListener('click', abrirModalConvite);
  const btnMigrarStorage = document.getElementById('btn-migrar-storage');
  if(btnMigrarStorage){
    btnMigrarStorage.addEventListener('click', async () => {
      const msgMigracao = document.getElementById('msg-migracao-storage');
      btnMigrarStorage.disabled = true; btnMigrarStorage.textContent = 'Migrando…';
      msgMigracao.innerHTML = '';
      const { data: resposta, error } = await supabase.functions.invoke('migrar-storage-privado', { body: {} });
      btnMigrarStorage.disabled = false; btnMigrarStorage.textContent = 'Migrar links do Storage';
      if(error || !resposta || resposta.error){
        msgMigracao.innerHTML = `<div class="msg-erro">${esc((resposta && resposta.error) || 'Não foi possível rodar a migração.')}</div>`;
        return;
      }
      const r = resposta.resultado;
      const totalErros = (r.alunos_foto.erros.length + r.historico_anexos.erros.length + r.agenda_anexos.erros.length);
      msgMigracao.innerHTML = `<div class="msg-ok">Migração concluída — fotos: ${r.alunos_foto.migrados} reassinadas; anexos do histórico: ${r.historico_anexos.migrados}; anexos da agenda: ${r.agenda_anexos.migrados}.${totalErros ? ` ${totalErros} erro(s) — veja o console.` : ''}</div>`;
      if(totalErros) console.warn('Erros na migração do Storage:', r);
    });
  }
  el.querySelectorAll('[data-bloquear-usuario]').forEach(b => b.addEventListener('click', async () => {
    const novoStatus = b.dataset.statusAtual === 'ativo' ? 'inativo' : 'ativo';
    const confirmMsg = novoStatus === 'inativo' ? 'Bloquear o acesso desse usuário? Ele não vai conseguir mais entrar no sistema.' : 'Liberar o acesso desse usuário?';
    if(!confirm(confirmMsg)) return;
    await supabase.from('perfis').update({ status: novoStatus }).eq('id', b.dataset.bloquearUsuario);
    const { data: perfisAtualizados } = await supabase.from('perfis').select('*').order('nome');
    ESTADO.perfis = perfisAtualizados || ESTADO.perfis;
    renderizarUsuarios(el);
  }));
  el.querySelectorAll('[data-excluir-permissoes]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Excluir as permissões personalizadas desse usuário? Ele volta a ver todas as abas padrão do papel dele.')) return;
    await supabase.from('perfis').update({ permissoes: null }).eq('id', b.dataset.excluirPermissoes);
    const { data: perfisAtualizados } = await supabase.from('perfis').select('*').order('nome');
    ESTADO.perfis = perfisAtualizados || ESTADO.perfis;
    renderizarUsuarios(el);
  }));
  el.querySelectorAll('[data-permissoes-usuario]').forEach(b => b.addEventListener('click', () => {
    const perfil = ESTADO.perfis.find(p => p.id === b.dataset.permissoesUsuario);
    abrirModalPermissoes(perfil, el);
  }));
  el.querySelectorAll('[data-editar-usuario]').forEach(b => b.addEventListener('click', () => {
    const perfil = ESTADO.perfis.find(p => p.id === b.dataset.editarUsuario);
    abrirModalEditarUsuario(perfil, el);
  }));
  el.querySelectorAll('[data-resetar-senha]').forEach(b => b.addEventListener('click', () => {
    const perfil = ESTADO.perfis.find(p => p.id === b.dataset.resetarSenha);
    abrirModalResetarSenha(perfil, el);
  }));
}

function abrirModalResetarSenha(perfil, elPai){
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <div class="modal-topo"><h3>Resetar senha</h3><button data-fechar>✕</button></div>
      <p style="font-size:13px;color:var(--texto-suave);margin:0 0 12px;">Definir uma nova senha para <b>${esc(perfil.nome)}</b> (${esc(perfil.email)}). Avise a pessoa da senha nova por um canal seguro.</p>
      <div id="msg-resetar-senha"></div>
      <form id="form-resetar-senha">
        <div class="campo">
          <label>Nova senha (mín. 6 caracteres)</label>
          <div style="position:relative;">
            <input type="password" id="rs-senha" minlength="6" required autocomplete="new-password" style="padding-right:38px;" />
            <button type="button" id="rs-toggle-olho" title="Mostrar/ocultar senha" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:4px;">👁️</button>
          </div>
        </div>
        <button class="botao terracota" type="submit" id="btn-salvar-reset-senha">Salvar nova senha</button>
      </form>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  const campoSenha = document.getElementById('rs-senha');
  document.getElementById('rs-toggle-olho').addEventListener('click', (e) => {
    e.preventDefault();
    const btnOlho = e.currentTarget;
    if(campoSenha.type === 'password'){ campoSenha.type = 'text'; btnOlho.textContent = '🙈'; }
    else { campoSenha.type = 'password'; btnOlho.textContent = '👁️'; }
  });

  document.getElementById('form-resetar-senha').addEventListener('submit', async (e) => {
    e.preventDefault();
    const novaSenha = campoSenha.value;
    const msg = document.getElementById('msg-resetar-senha');
    const btn = document.getElementById('btn-salvar-reset-senha');
    btn.disabled = true; btn.textContent = 'Salvando…';
    try{
      const { data: { session } } = await supabase.auth.getSession();
      const resp = await fetch(`${EDGE_URL}/resetar-senha-usuario`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ user_id: perfil.id, nova_senha: novaSenha }),
      });
      const resultado = await resp.json();
      if(!resp.ok){ throw new Error(resultado.error || 'Erro ao resetar a senha.'); }
      msg.innerHTML = `<div class="msg-ok">Senha alterada com sucesso.</div>`;
      setTimeout(() => modal.remove(), 1200);
    } catch(err){
      msg.innerHTML = `<div class="msg-erro">${esc(err.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Salvar nova senha';
    }
  });
}

function abrirModalEditarUsuario(perfil, elPai){
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <div class="modal-topo"><h3>Editar usuário</h3><button data-fechar>✕</button></div>
      <div id="msg-editar-usuario"></div>
      <form id="form-editar-usuario">
        <div class="campo"><label>Nome completo</label><input type="text" id="edu-nome" value="${esc(perfil.nome)}" required /></div>

function gerarSenhaAleatoria(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let s = '';
  for(let i=0;i<8;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function formatarDataBR(iso){
  const [ano, mes, dia] = iso.split('-');
  return `${dia}/${mes}/${ano}`;
}

function formatarHoraBR(timestamptz){
  if(!timestamptz) return '—';
  const d = new Date(timestamptz);
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

// ---------------------------------------------------------------
// Seletor de data customizado (calendário colorido: azul = não letivo,
// verde = dias letivos até hoje, branco = datas futuras)
// ---------------------------------------------------------------
const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SELETORES_DATA = {};

/**
 * containerId: id de um <div> vazio onde o seletor será montado.
 * dataInicialIso: valor inicial (pode ser '' para campo vazio/opcional).
 * onSelecionar: callback(novoIso) chamado quando o usuário escolhe/limpa uma data.
 * opcoes:
 *   inputId       -> se informado, cria um <input type="hidden"> com esse id, sincronizado
 *                     (permite que o restante do formulário continue lendo o valor por getElementById(id).value)
 *   permiteLimpar -> mostra botão "Limpar" no popup (padrão: false)
 *   rotuloVazio   -> texto exibido quando não há data selecionada
 * Retorna um controlador { definir(iso), obter() } também acessível via SELETORES_DATA[containerId].
 */
function criarSeletorData(containerId, dataInicialIso, onSelecionar, opcoes){
  opcoes = opcoes || {};
  const container = document.getElementById(containerId);
  if(!container) return;
  const permiteLimpar = !!opcoes.permiteLimpar;
  const rotuloVazio = opcoes.rotuloVazio || 'Selecione a data';
  let dataSelecionada = dataInicialIso || '';
  const base = dataSelecionada || hojeISO();
  const [anoIni, mesIni] = base.split('-').map(Number);
  let mesExibido = mesIni; // 1-12
  let anoExibido = anoIni;
  let aberto = false;

  container.innerHTML = `
    ${opcoes.inputId ? `<input type="hidden" id="${opcoes.inputId}" value="${dataSelecionada}" />` : ''}
    <div class="seletor-data-campo" id="${containerId}-campo">
      <span id="${containerId}-label">${dataSelecionada ? formatarDataBR(dataSelecionada) : rotuloVazio}</span>
      <span>📅</span>
    </div>
    <div class="calendario-popup" id="${containerId}-popup" style="display:none;"></div>`;

  const campo = document.getElementById(`${containerId}-campo`);
  const popup = document.getElementById(`${containerId}-popup`);
  const label = document.getElementById(`${containerId}-label`);

  function aplicarValor(iso){
    dataSelecionada = iso || '';
    if(opcoes.inputId){
      const inputOculto = document.getElementById(opcoes.inputId);
      if(inputOculto){
        inputOculto.value = dataSelecionada;
        inputOculto.dispatchEvent(new Event('change', { bubbles:true }));
      }
    }
    label.textContent = dataSelecionada ? formatarDataBR(dataSelecionada) : rotuloVazio;
  }

  async function renderizarPopup(){
    const primeiroDiaMes = `${anoExibido}-${String(mesExibido).padStart(2,'0')}-01`;
    const ultimoDiaNum = new Date(anoExibido, mesExibido, 0).getDate();
    const ultimoDiaMes = `${anoExibido}-${String(mesExibido).padStart(2,'0')}-${String(ultimoDiaNum).padStart(2,'0')}`;
    const { data: feriadosMes } = await supabase.from('feriados').select('data, tipo, descricao').gte('data', primeiroDiaMes).lte('data', ultimoDiaMes);
    const setFeriados = new Set((feriadosMes||[]).map(f => f.data));

    let setChamadaFeita = null;
    if(opcoes.turmaId){
      const { data: chamadasMes } = await supabase.from('frequencia').select('data')
        .eq('turma_id', opcoes.turmaId).gte('data', primeiroDiaMes).lte('data', ultimoDiaMes);
      setChamadaFeita = new Set((chamadasMes||[]).map(f => f.data));
    }

    let mapaStatusDias = null;
    if(opcoes.statusDiasFn){
      mapaStatusDias = await opcoes.statusDiasFn(primeiroDiaMes, ultimoDiaMes, feriadosMes||[]);
    }

    const hojeIso = hojeISO();
    const primeiroDiaSemana = new Date(anoExibido, mesExibido-1, 1).getDay(); // 0=domingo
    const celulas = [];
    for(let i=0;i<primeiroDiaSemana;i++) celulas.push(null);
    for(let d=1; d<=ultimoDiaNum; d++) celulas.push(d);

    const diasHtml = celulas.map(d => {
      if(d === null) return `<div class="cal-dia fora-mes"></div>`;
      const iso = `${anoExibido}-${String(mesExibido).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const diaSemana = new Date(anoExibido, mesExibido-1, d).getDay();
      const ehFimDeSemana = diaSemana === 0 || diaSemana === 6;
      const naoLetivo = ehFimDeSemana || setFeriados.has(iso);
      let classe = 'futuro';
      if(naoLetivo){
        classe = 'nao-letivo';
      } else if(mapaStatusDias){
        const status = mapaStatusDias[iso];
        if(status === 'completa') classe = 'chamada-feita';
        else if(status === 'parcial') classe = 'chamada-parcial';
        else if(status === 'nenhuma') classe = 'chamada-pendente';
        else classe = iso <= hojeIso ? 'passado-letivo' : 'futuro';
      } else if(iso <= hojeIso){
        if(setChamadaFeita){
          classe = setChamadaFeita.has(iso) ? 'chamada-feita' : 'chamada-pendente';
        } else {
          classe = 'passado-letivo';
        }
      }
      const extras = [
        iso === hojeIso ? 'hoje' : '',
        iso === dataSelecionada ? 'selecionado' : '',
      ].filter(Boolean).join(' ');
      return `<div class="cal-dia ${classe} ${extras}" data-dia-iso="${iso}">${d}</div>`;
    }).join('');

    popup.innerHTML = `
      <div class="cal-cabecalho">
        <button type="button" class="cal-nav" id="${containerId}-mes-ant">‹</button>
        <strong>${MESES_PT[mesExibido-1]} de ${anoExibido}</strong>
        <button type="button" class="cal-nav" id="${containerId}-mes-prox">›</button>
      </div>
      <div class="cal-semana"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
      <div class="cal-dias">${diasHtml}</div>
      <div class="cal-legenda">
        <span><i class="nao-letivo"></i>Não letivo</span>
        ${mapaStatusDias
          ? `<span><i class="chamada-feita"></i>Atualizada</span><span><i class="chamada-parcial"></i>Incompleta</span><span><i class="chamada-pendente"></i>Nenhuma</span>`
          : setChamadaFeita
          ? `<span><i class="chamada-feita"></i>Chamada feita</span><span><i class="chamada-pendente"></i>Chamada pendente</span>`
          : `<span><i class="passado-letivo"></i>Letivo (até hoje)</span>`}
        <span><i class="futuro"></i>Futuro</span>
      </div>
      ${permiteLimpar ? `<button type="button" class="botao secundario pequeno" id="${containerId}-limpar" style="width:100%;margin-top:10px;">Limpar data</button>` : ''}`;

    document.getElementById(`${containerId}-mes-ant`).addEventListener('click', (e) => {
      e.stopPropagation();
      mesExibido--; if(mesExibido < 1){ mesExibido = 12; anoExibido--; }
      renderizarPopup();
    });
    document.getElementById(`${containerId}-mes-prox`).addEventListener('click', (e) => {
      e.stopPropagation();
      mesExibido++; if(mesExibido > 12){ mesExibido = 1; anoExibido++; }
      renderizarPopup();
    });
    popup.querySelectorAll('[data-dia-iso]').forEach(el2 => el2.addEventListener('click', (e) => {
      e.stopPropagation();
      aplicarValor(el2.dataset.diaIso);
      fecharPopup();
      if(onSelecionar) onSelecionar(dataSelecionada);
    }));
    if(permiteLimpar){
      document.getElementById(`${containerId}-limpar`).addEventListener('click', (e) => {
        e.stopPropagation();
        aplicarValor('');
        fecharPopup();
        if(onSelecionar) onSelecionar('');
      });
    }
  }

  function abrirPopup(){
    aberto = true;
    popup.style.display = '';
    renderizarPopup();
    document.addEventListener('click', fecharAoClicarFora);
  }
  function fecharPopup(){
    aberto = false;
    popup.style.display = 'none';
    document.removeEventListener('click', fecharAoClicarFora);
  }
  function fecharAoClicarFora(e){
    if(!container.contains(e.target)) fecharPopup();
  }

  campo.addEventListener('click', (e) => {
    e.stopPropagation();
    if(aberto) fecharPopup(); else abrirPopup();
  });

  const controlador = {
    definir(iso){ aplicarValor(iso); },
    obter(){ return dataSelecionada; },
  };
  SELETORES_DATA[containerId] = controlador;
  return controlador;
}

function rotuloTipoFeriado(f){
  if(f.tipo === 'feriado') return 'Feriado';
  if(f.tipo === 'ponto_facultativo') return 'Ponto Facultativo';
  if(f.tipo === 'recesso') return 'Recesso Escolar';
  if(f.tipo === 'suspensao_aulas') return 'Suspensão de Aulas' + (f.turno_afetado === 'manha' ? ' (Manhã)' : f.turno_afetado === 'tarde' ? ' (Tarde)' : ' (Dia todo)');
  return f.tipo;
}

// Retorna true se um dia com Suspensão de Aulas (turno_afetado) afeta o turno informado (texto livre, ex: "Manhã").
// turnoAfetado null/undefined = dia todo, afeta qualquer turno.
function turnoAfetaSuspensao(turnoTexto, turnoAfetado){
  if(!turnoAfetado) return true;
  const t = (turnoTexto || '').toLowerCase();
  if(turnoAfetado === 'manha') return t.includes('manh');
  if(turnoAfetado === 'tarde') return t.includes('tard');
  return true;
}

        <strong style="font-size:14px;">Dias letivos por mês</strong>

        ${podeEditar ? `<div class="grade-2" style="grid-template-columns:140px 140px 170px 150px 1fr auto;gap:8px;align-items:end;">
          <div class="campo" style="margin-bottom:0;"><label>Data início</label><div id="fer-data-container" class="seletor-data-wrap"></div></div>

      <div style="padding:10px 14px;">
        <p style="font-size:12.5px;color:var(--texto-suave);margin:0 0 12px;">Use isso quando algum cargo precisa comparecer mesmo num dia não letivo — ex: reunião pedagógica no recesso, planejamento no início do ano letivo. Só as funções marcadas ficam com expediente nesse dia; as demais continuam sem expediente normalmente.</p>
        ${podeEditar ? `

          <div class="campo"><label>Data</label><div id="conv-data-container" class="seletor-data-wrap"></div></div>
          <div class="campo"><label>Descrição</label><input type="text" id="conv-descricao" placeholder="Ex: Reunião pedagógica de início de ano" /></div>
        </div>
        <div class="campo">
          <label>Funções convocadas</label>

      </div>
    </div>`;
  document.getElementById('dl-ano').addEventListener('change', (e) => {
    ESTADO.diasLetivosAno = parseInt(e.target.value, 10) || new Date().getFullYear();

  if(podeEditar){
    criarSeletorData('fer-data-container', '', null, { inputId:'fer-data', permiteLimpar:false, rotuloVazio:'Selecione a data' });
    criarSeletorData('fer-data-fim-container', '', null, { inputId:'fer-data-fim', permiteLimpar:true, rotuloVazio:'(opcional)' });
    document.getElementById('fer-tipo').addEventListener('change', (e) => {
      document.getElementById('campo-fer-turno').style.display = e.target.value === 'suspensao_aulas' ? '' : 'none';
