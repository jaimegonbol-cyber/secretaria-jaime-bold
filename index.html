  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--areia);
    color:var(--texto);
    height:100vh;
  }
  h1,h2,h3{font-weight:700;letter-spacing:-.01em;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--terracota);color:white;}

  /* ---------- LOGIN / SET PASSWORD ---------- */
  .tela-auth{
    height:100vh;overflow-y:auto;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 20% -10%, #15325C22, transparent),
               radial-gradient(900px 500px at 100% 110%, #2E6BB81a, transparent),
               var(--areia);
    padding:24px;
  }
  .cartao-auth{
    background:var(--branco);border:1px solid var(--borda);border-radius:16px;
    padding:40px 36px;width:100%;max-width:400px;box-shadow:var(--sombra);
  }
  .selo{
    width:52px;height:52px;border-radius:50%;
    background-image:var(--logo-url);background-size:contain;background-repeat:no-repeat;background-position:center;
    margin-bottom:18px;
  }
  .cartao-auth h1{font-size:20px;color:var(--verde-escuro);margin-bottom:4px;}
  .cartao-auth p.sub{color:var(--texto-suave);font-size:14px;margin:0 0 24px;}
  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:13px;font-weight:600;color:var(--texto);margin-bottom:6px;}
  .campo input, .campo select{
    width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:8px;
    font-size:14px;background:var(--areia);color:var(--texto);outline:none;
    transition:border-color .15s, background .15s;
  }
  .campo input:focus, .campo select:focus{border-color:var(--verde);background:white;}
  .botao{
    width:100%;padding:12px;border-radius:8px;border:none;font-weight:700;font-size:14px;
    background:var(--verde);color:white;transition:background .15s, transform .08s;
  }
  .botao:hover{background:var(--verde-escuro);}
  .botao:active{transform:scale(.98);}
  .botao.terracota{background:var(--terracota);}
  .botao.terracota:hover{background:var(--terracota-escuro);}
  .botao.secundario{background:transparent;border:1px solid var(--borda);color:var(--texto);}
  .botao.secundario:hover{background:var(--areia-escura);}
  .botao.pequeno{padding:7px 12px;font-size:13px;width:auto;}
  .botao:disabled{opacity:.55;cursor:not-allowed;}
  .msg-erro{background:#FBEAE5;color:var(--erro);border:1px solid #F0C8BC;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .msg-ok{background:#E7F4EC;color:var(--sucesso);border:1px solid #BFE2CC;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;}

  /* ---------- APP SHELL ---------- */
  .shell{display:flex;height:100vh;}
  .nav{
    width:252px;background:var(--verde-escuro);color:#EAF3F0;padding:20px 14px;
    display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;
  }
  .nav .marca{display:flex;align-items:center;gap:10px;padding:8px 4px 24px;}
  .nav .marca .selo{margin:0;width:50px;height:50px;flex-shrink:0;}
  .nav .marca div{font-size:14.5px;font-weight:700;line-height:1.35;white-space:nowrap;}
  .nav .marca span{display:block;font-weight:400;font-size:12px;opacity:.7;white-space:nowrap;}
  .nav a{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:#CFE3DD;text-decoration:none;font-size:14px;font-weight:600;margin-bottom:2px;
    cursor:pointer;transition:background .12s;
  }
  .nav a:hover{background:#1B4B43;}
  .nav a.ativo{background:var(--terracota);color:white;}
  .nav .rodape{margin-top:auto;padding-top:14px;border-top:1px solid #1F544A;font-size:12px;color:#9FC0B7;}
  .nav .rodape .usuario{font-weight:700;color:#EAF3F0;margin-bottom:8px;font-size:13px;}
  .tag-papel{
    display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;background:#1F544A;color:#B9D9CF;padding:2px 7px;border-radius:99px;margin-top:4px;
  }
  .principal{flex:1;padding:28px 34px;max-width:100%;overflow-y:auto;overflow-x:auto;}
  .cabecalho-pagina{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .subtabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--borda);padding-bottom:2px;}
  .aba-cadastro{
    background:none;border:none;padding:9px 4px;margin-right:14px;font-size:14px;font-weight:700;
    color:var(--texto-suave);border-bottom:2.5px solid transparent;cursor:pointer;
  }
  .aba-cadastro:hover{color:var(--verde-escuro);}
  .aba-cadastro.ativa{color:var(--verde-escuro);border-bottom-color:var(--terracota);}
  .cabecalho-pagina h2{font-size:22px;color:var(--verde-escuro);}
  .cabecalho-pagina p{color:var(--texto-suave);font-size:13px;margin-top:3px;}

  /* cards / stats */
  .grade-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .stat{background:white;border:1px solid var(--borda);border-radius:12px;padding:16px 18px;box-shadow:var(--sombra);}
  .stat .n{font-size:26px;font-weight:800;color:var(--verde-escuro);}
  .stat .l{font-size:12.5px;color:var(--texto-suave);font-weight:600;margin-top:2px;}

  .painel{background:white;border:1px solid var(--borda);border-radius:12px;box-shadow:var(--sombra);overflow:hidden;}
  .painel .barra{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--borda);flex-wrap:wrap;}
  .barra input[type=text], .barra select{
    padding:8px 12px;border:1px solid var(--borda);border-radius:7px;font-size:13.5px;background:var(--areia);min-width:180px;
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;padding:10px 16px;background:var(--areia);color:var(--texto-suave);
    font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;border-bottom:1px solid var(--borda);
    position:sticky;top:0;
  }
  tbody td{padding:11px 16px;border-bottom:1px solid #F0ECE0;color:var(--texto);}
  tbody tr:hover{background:#FBFAF6;cursor:pointer;}
  tbody tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;}
  .pill.verde{background:#E1E9F4;color:var(--verde-escuro);}
  .pill.laranja{background:#DCE9F8;color:var(--terracota-escuro);}
  .pill.cinza{background:#EAE7DD;color:var(--texto-suave);}
  .pill.vermelho{background:#FBEAE5;color:var(--erro);}
  .vazio{padding:50px 20px;text-align:center;color:var(--texto-suave);font-size:14px;}

  /* modal */
  .fundo-modal{position:fixed;inset:0;background:#12211ecc;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:50;}
  .modal{background:white;border-radius:14px;max-width:640px;width:100%;padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{font-size:18px;color:var(--verde-escuro);margin-bottom:2px;}
  .modal .fechar{position:absolute;}
  .modal-topo{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .modal-topo button{background:none;border:none;font-size:20px;color:var(--texto-suave);line-height:1;}
  .grade-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .ficha-linha{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F0ECE0;font-size:13.5px;}
  .ficha-linha span:first-child{color:var(--texto-suave);}
  .ficha-linha span:last-child{font-weight:600;text-align:right;}
  .secao-titulo{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--terracota-escuro);font-weight:800;margin:20px 0 6px;}
  .secao-titulo:first-child{margin-top:0;}

  .carregando{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--texto-suave);font-size:14px;}
  .spinner{width:18px;height:18px;border:2px solid var(--borda);border-top-color:var(--verde);border-radius:50%;animation:girar .7s linear infinite;margin-right:10px;}
  @keyframes girar{to{transform:rotate(360deg);}}

  @media (max-width:760px){
    .shell{flex-direction:column;}
    .nav{width:100%;flex-direction:row;align-items:center;overflow-x:auto;}
    .nav .marca{padding:6px 12px 6px 0;}
    .nav .rodape{display:none;}
    .principal{padding:18px;}
    .grade-2{grid-template-columns:1fr;}
  }
</style>
</head>

  sessao: null,
  perfil: null,
  pagina: 'painel',
  subCadastro: 'alunos',
  alunos: [], turmas: [], perfis: [], professores: [], disciplinas: [],
  buscaAlunos: '', filtroTurma: '',
  buscaProfessor: '', buscaDisciplina: '',
  alunoSelecionado: null,

};

// ---------------------------------------------------------------
// AUTENTICAÇÃO
// ---------------------------------------------------------------
async function tratarLinkConvite(){
  const hash = window.location.hash;
  if(hash.includes('access_token')){
    const params = new URLSearchParams(hash.slice(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    const type = params.get('type');
    if(access_token && (type === 'invite' || type === 'recovery' || type === 'signup')){
      await supabase.auth.setSession({ access_token, refresh_token });
      history.replaceState(null, '', window.location.pathname);
      return true;
    }
  }
  return false;
}

async function carregarPerfil(userId){
  const { data, error } = await supabase.from('perfis').select('*').eq('id', userId).single();
  if(error) return null;
  return data;
}

async function iniciar(){
  raiz.innerHTML = `<div class="carregando"><div class="spinner"></div>Carregando…</div>`;
  const precisaSenha = await tratarLinkConvite();
  const { data: { session } } = await supabase.auth.getSession();
  ESTADO.sessao = session;

  if(session){
    ESTADO.perfil = await carregarPerfil(session.user.id);
  }

  if(precisaSenha && session){
    renderizarDefinirSenha();
    return;
  }
  if(!session){
    renderizarLogin();
    return;
  }
  if(!ESTADO.perfil || ESTADO.perfil.status !== 'ativo'){
    renderizarSemAcesso();
    return;
  }
  await carregarDadosBase();
  renderizarApp();
}

supabase.auth.onAuthStateChange((evento) => {
  if(evento === 'SIGNED_OUT'){ ESTADO = {...ESTADO, sessao:null, perfil:null, carregado:false}; renderizarLogin(); }
});

  raiz.innerHTML = `

    <div class="cartao-auth">
      <div class="selo"></div>
      <h1>Secretaria Escolar</h1>
      <p class="sub">Esc. Municipal Jaime Gonçalves Bold — acesso restrito</p>
      <div id="msg-login"></div>
      <form id="form-login">
        <div class="campo"><label>E-mail</label><input type="email" id="login-email" required autocomplete="username" /></div>
        <div class="campo"><label>Senha</label><input type="password" id="login-senha" required autocomplete="current-password" /></div>
        <button class="botao" type="submit" id="btn-login">Entrar</button>
      </form>
      <p style="margin-top:18px;font-size:12.5px;color:var(--texto-suave);text-align:center;">

      </p>
    </div>
  </div>`;
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();

    const senha = document.getElementById('login-senha').value;
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando…';
    const { error } = await supabase.auth.signInWithPassword({ email, password: senha });

      btn.disabled = false; btn.textContent = 'Entrar';

    await iniciar();

}

function traduzErro(m){
  if(/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar (verifique o convite recebido).';
  return m;
}

async function carregarDadosBase(){
  const [{ data: turmas }, { data: alunos }, { data: professores }, { data: disciplinas }] = await Promise.all([
    supabase.from('turmas').select('*').order('nome'),
    supabase.from('alunos').select('*, turmas(nome, turno, ensino)').order('nome'),
    supabase.from('professores').select('*, professor_disciplina(disciplinas(id, nome))').order('nome'),
    supabase.from('disciplinas').select('*').order('nome'),
  ]);
  ESTADO.turmas = turmas || [];
  ESTADO.alunos = alunos || [];
  ESTADO.professores = professores || [];
  ESTADO.disciplinas = disciplinas || [];
  if(ESTADO.perfil.role === 'admin'){
    const { data: perfis } = await supabase.from('perfis').select('*').order('created_at');
    ESTADO.perfis = perfis || [];
  }
  ESTADO.carregado = true;
}

function abrirModalTrocarSenha(){
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <div class="modal-topo"><h3>Trocar senha</h3><button data-fechar>✕</button></div>
      <div id="msg-troca-senha"></div>
      <form id="form-troca-senha">
        <div class="campo"><label>Senha atual</label><input type="password" id="senha-atual" required autocomplete="current-password" /></div>
        <div class="campo"><label>Nova senha (mín. 6 caracteres)</label><input type="password" id="senha-nova" minlength="6" required autocomplete="new-password" /></div>
        <div class="campo"><label>Confirmar nova senha</label><input type="password" id="senha-nova-conf" minlength="6" required autocomplete="new-password" /></div>
        <button class="botao terracota" type="submit" id="btn-troca-senha">Salvar nova senha</button>
      </form>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('form-troca-senha').addEventListener('submit', async (e) => {
    e.preventDefault();
    const atual = document.getElementById('senha-atual').value;
    const nova = document.getElementById('senha-nova').value;
    const conf = document.getElementById('senha-nova-conf').value;
    const msg = document.getElementById('msg-troca-senha');
    const btn = document.getElementById('btn-troca-senha');
    if(nova !== conf){
      msg.innerHTML = `<div class="msg-erro">As senhas novas não coincidem.</div>`;
      return;
    }
    btn.disabled = true; btn.textContent = 'Salvando…';

    // reautentica com a senha atual antes de trocar, por segurança
    const { error: erroLogin } = await supabase.auth.signInWithPassword({ email: ESTADO.perfil.email, password: atual });
    if(erroLogin){
      msg.innerHTML = `<div class="msg-erro">Senha atual incorreta.</div>`;
      btn.disabled = false; btn.textContent = 'Salvar nova senha';
      return;
    }
    const { error } = await supabase.auth.updateUser({ password: nova });
    if(error){
      msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Salvar nova senha';
      return;
    }
    msg.innerHTML = `<div class="msg-ok">Senha atualizada com sucesso.</div>`;
    setTimeout(() => modal.remove(), 1400);
  });
}

function alunosFiltrados(){
  const busca = ESTADO.buscaAlunos.trim().toLowerCase();
  return ESTADO.alunos.filter(a => {
    if(ESTADO.filtroTurma && a.turma_id !== ESTADO.filtroTurma) return false;
    if(busca && !a.nome.toLowerCase().includes(busca) && !(a.cpf||'').includes(busca)) return false;
    return true;
  });
}

function renderizarAlunos(el){
  const lista = alunosFiltrados();
  const opcoesTurma = ESTADO.turmas.map(t => `<option value="${t.id}" ${ESTADO.filtroTurma===t.id?'selected':''}>${esc(t.nome)} · ${esc(t.turno)}</option>`).join('');

  const linhas = lista.slice(0,300).map(a => `
    <tr data-id="${a.id}">
      <td>${esc(a.nome)}</td>
      <td>${esc(a.turmas?.nome || '—')}</td>
      <td>${esc(a.turno || a.turmas?.turno || '—')}</td>
      <td>${fmtData(a.data_nascimento)}</td>
      <td>${a.aee ? '<span class="pill laranja">AEE</span>' : ''}</td>
      <td>${situacaoPill(a.situacao)}</td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="cabecalho-pagina">
      <div><h2>Estudantes</h2><p>${lista.length} de ${ESTADO.alunos.length} estudantes${ESTADO.filtroTurma||ESTADO.buscaAlunos?' (filtrado)':''}</p></div>
    </div>
    <div class="painel">
      <div class="barra">
        <input type="text" id="busca-aluno" placeholder="Buscar por nome ou CPF…" value="${esc(ESTADO.buscaAlunos)}" />
        <select id="filtro-turma"><option value="">Todas as turmas</option>${opcoesTurma}</select>
      </div>
      ${lista.length ? `<table><thead><tr><th>Nome</th><th>Turma</th><th>Turno</th><th>Nascimento</th><th>AEE</th><th>Situação</th></tr></thead><tbody>${linhas}</tbody></table>`
        : `<div class="vazio">Nenhum estudante encontrado com esse filtro.</div>`}
    </div>`;

  document.getElementById('busca-aluno').addEventListener('input', (e) => { ESTADO.buscaAlunos = e.target.value; renderizarAlunos(el); preservarFoco('busca-aluno'); });
  document.getElementById('filtro-turma').addEventListener('change', (e) => { ESTADO.filtroTurma = e.target.value; renderizarAlunos(el); });
  el.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => abrirFichaAluno(tr.dataset.id)));
}

function preservarFoco(id){ const campo = document.getElementById(id); if(campo){ const v = campo.value; campo.focus(); campo.value=''; campo.value=v; } }

function situacaoPill(s){
  if(s === 'matriculado') return '<span class="pill verde">Matriculado</span>';
  if(s === 'transferido') return '<span class="pill cinza">Transferido</span>';
  if(s === 'cancelado') return '<span class="pill vermelho">Cancelado</span>';
  return '<span class="pill cinza">—</span>';
}

function tipoLabel(t){
  if(t === 'mae') return 'Mãe';
  if(t === 'pai') return 'Pai';
  if(t === 'responsavel_legal') return 'Responsável legal';
  return 'Outro';
}

    <div class="modal">
      <div class="modal-topo">
        <div><h3>${esc(a.nome)}</h3><p style="color:var(--texto-suave);font-size:13px;margin-top:2px;">${esc(a.turmas?.nome||'—')} · ${esc(a.turmas?.turno||a.turno||'—')}</p></div>

      <div class="secao-titulo">Dados gerais</div>

      <div class="ficha-linha"><span>Endereço</span><span>${esc(a.endereco||'—')}${a.numero?', '+esc(a.numero):''}</span></div>
      <div class="ficha-linha"><span>Bairro / CEP</span><span>${esc(a.bairro||'—')} · ${esc(a.cep||'—')}</span></div>
      <div class="ficha-linha"><span>Telefone</span><span>${esc(a.telefone||'—')}</span></div>
      <div class="secao-titulo">Saúde e necessidades</div>
      <div class="ficha-linha"><span>AEE</span><span>${a.aee ? 'Sim' : 'Não'}${a.descricao_aee?' — '+esc(a.descricao_aee):''}</span></div>

function renderizarTurmas(el){
  const contagem = {};
  ESTADO.alunos.forEach(a => { contagem[a.turma_id] = (contagem[a.turma_id]||0)+1; });
  const linhas = ESTADO.turmas.map(t => `
    <tr data-id="${t.id}">
      <td>${esc(t.nome)}</td>
      <td>${esc(t.ensino||'—')}</td>
      <td>${esc(t.turno||'—')}</td>
      <td>${contagem[t.id]||0} estudante(s)</td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="cabecalho-pagina"><div><h2>Turmas</h2><p>${ESTADO.turmas.length} turmas cadastradas em 2026</p></div></div>
    <div class="painel">
      <table><thead><tr><th>Turma</th><th>Ensino</th><th>Turno</th><th>Estudantes</th></tr></thead><tbody>${linhas}</tbody></table>
    </div>`;
  el.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => {
    ESTADO.filtroTurma = tr.dataset.id; ESTADO.buscaAlunos=''; ESTADO.pagina = 'cadastro'; ESTADO.subCadastro = 'alunos'; renderizarApp();
  }));
}

function professoresFiltrados(){
  const busca = ESTADO.buscaProfessor.trim().toLowerCase();
  if(!busca) return ESTADO.professores;
  return ESTADO.professores.filter(p => p.nome.toLowerCase().includes(busca));
}

function renderizarProfessores(el){
  const lista = professoresFiltrados();
  const linhas = lista.map(p => {
    const disc = (p.professor_disciplina || []).map(v => v.disciplinas?.nome).filter(Boolean).join(', ');
    return `
    <tr data-id="${p.id}">
      <td>${esc(p.nome)}</td>
      <td>${esc(p.email || '—')}</td>
      <td>${esc(p.telefone || '—')}</td>
      <td>${esc(disc || '—')}</td>
      <td>${p.ativo ? '<span class="pill verde">Ativo</span>' : '<span class="pill cinza">Inativo</span>'}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="cabecalho-pagina">
      <div><h2>Professores</h2><p>${lista.length} de ${ESTADO.professores.length} professores${ESTADO.buscaProfessor?' (filtrado)':''}</p></div>
      <button class="botao terracota pequeno" id="btn-novo-professor">+ Novo professor</button>
    </div>
    <div class="painel">
      <div class="barra"><input type="text" id="busca-professor" placeholder="Buscar por nome…" value="${esc(ESTADO.buscaProfessor)}" /></div>
      ${lista.length ? `<table><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Disciplinas</th><th>Status</th></tr></thead><tbody>${linhas}</tbody></table>`
        : `<div class="vazio">Nenhum professor cadastrado ainda.</div>`}
    </div>`;

  document.getElementById('busca-professor').addEventListener('input', (e) => { ESTADO.buscaProfessor = e.target.value; renderizarProfessores(el); preservarFoco('busca-professor'); });
  document.getElementById('btn-novo-professor').addEventListener('click', abrirModalNovoProfessor);
}

function abrirModalNovoProfessor(){
  const opcoesDisc = ESTADO.disciplinas.map(d => `<label style="display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:400;margin-bottom:6px;"><input type="checkbox" value="${d.id}" class="check-disc" /> ${esc(d.nome)}</label>`).join('') || '<p style="color:var(--texto-suave);font-size:13px;">Nenhuma disciplina cadastrada ainda.</p>';
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:440px;">
      <div class="modal-topo"><h3>Novo professor</h3><button data-fechar>✕</button></div>
      <div id="msg-novo-professor"></div>
      <form id="form-novo-professor">
        <div class="campo"><label>Nome completo</label><input type="text" id="prof-nome" required /></div>
        <div class="campo"><label>E-mail</label><input type="email" id="prof-email" /></div>
        <div class="campo"><label>Telefone</label><input type="text" id="prof-telefone" /></div>
        <div class="campo"><label>Formação</label><input type="text" id="prof-formacao" /></div>
        <div class="campo"><label>Disciplinas que leciona</label>${opcoesDisc}</div>
        <button class="botao terracota" type="submit" id="btn-salvar-professor">Salvar professor</button>
      </form>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('form-novo-professor').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = document.getElementById('prof-nome').value.trim();
    const email = document.getElementById('prof-email').value.trim() || null;
    const telefone = document.getElementById('prof-telefone').value.trim() || null;
    const formacao = document.getElementById('prof-formacao').value.trim() || null;
    const idsDisc = Array.from(modal.querySelectorAll('.check-disc:checked')).map(c => c.value);
    const btn = document.getElementById('btn-salvar-professor');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const { data: novo, error } = await supabase.from('professores').insert({ nome, email, telefone, formacao }).select().single();
    if(error){
      document.getElementById('msg-novo-professor').innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Salvar professor';
      return;
    }
    if(idsDisc.length){
      await supabase.from('professor_disciplina').insert(idsDisc.map(id => ({ professor_id: novo.id, disciplina_id: id })));
    }
    modal.remove();
    await carregarDadosBase();
    renderizarApp();
  });
}

// ---------------------------------------------------------------
// DISCIPLINAS
// ---------------------------------------------------------------
function disciplinasFiltradas(){
  const busca = ESTADO.buscaDisciplina.trim().toLowerCase();
  if(!busca) return ESTADO.disciplinas;
  return ESTADO.disciplinas.filter(d => d.nome.toLowerCase().includes(busca));
}

function renderizarDisciplinas(el){
  const lista = disciplinasFiltradas();
  const linhas = lista.map(d => `
    <tr data-id="${d.id}">
      <td>${esc(d.nome)}</td>
      <td>${esc(d.area || '—')}</td>
      <td>${d.carga_horaria ? d.carga_horaria + 'h/ano' : '—'}</td>
      <td>${d.ativo ? '<span class="pill verde">Ativa</span>' : '<span class="pill cinza">Inativa</span>'}</td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="cabecalho-pagina">
      <div><h2>Disciplinas</h2><p>${lista.length} de ${ESTADO.disciplinas.length} disciplinas${ESTADO.buscaDisciplina?' (filtrado)':''}</p></div>
      <button class="botao terracota pequeno" id="btn-nova-disciplina">+ Nova disciplina</button>
    </div>
    <div class="painel">
      <div class="barra"><input type="text" id="busca-disciplina" placeholder="Buscar por nome…" value="${esc(ESTADO.buscaDisciplina)}" /></div>
      ${lista.length ? `<table><thead><tr><th>Disciplina</th><th>Área</th><th>Carga horária</th><th>Status</th></tr></thead><tbody>${linhas}</tbody></table>`
        : `<div class="vazio">Nenhuma disciplina cadastrada ainda.</div>`}
    </div>`;

  document.getElementById('busca-disciplina').addEventListener('input', (e) => { ESTADO.buscaDisciplina = e.target.value; renderizarDisciplinas(el); preservarFoco('busca-disciplina'); });
  document.getElementById('btn-nova-disciplina').addEventListener('click', abrirModalNovaDisciplina);
}

function abrirModalNovaDisciplina(){
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:400px;">
      <div class="modal-topo"><h3>Nova disciplina</h3><button data-fechar>✕</button></div>
      <div id="msg-nova-disciplina"></div>
      <form id="form-nova-disciplina">
        <div class="campo"><label>Nome da disciplina</label><input type="text" id="disc-nome" required /></div>
        <div class="campo"><label>Área</label><input type="text" id="disc-area" placeholder="Ex: Linguagens, Exatas…" /></div>
        <div class="campo"><label>Carga horária anual (horas)</label><input type="number" id="disc-carga" min="0" /></div>
        <button class="botao terracota" type="submit" id="btn-salvar-disciplina">Salvar disciplina</button>
      </form>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('form-nova-disciplina').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = document.getElementById('disc-nome').value.trim();
    const area = document.getElementById('disc-area').value.trim() || null;
    const cargaVal = document.getElementById('disc-carga').value;
    const carga_horaria = cargaVal ? parseInt(cargaVal, 10) : null;
    const btn = document.getElementById('btn-salvar-disciplina');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const { error } = await supabase.from('disciplinas').insert({ nome, area, carga_horaria });
    if(error){
      document.getElementById('msg-nova-disciplina').innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Salvar disciplina';
      return;
    }
    modal.remove();
    await carregarDadosBase();
    renderizarApp();
  });
}

// ---------------------------------------------------------------
// USUÁRIOS (admin)
// ---------------------------------------------------------------
function renderizarUsuarios(el){
  const linhas = ESTADO.perfis.map(p => `
    <tr>
      <td>${esc(p.nome)}</td>
      <td>${esc(p.email)}</td>
      <td><span class="pill ${p.role==='admin'?'laranja':'verde'}">${p.role==='admin'?'Administrador':'Secretaria'}</span></td>
      <td><span class="pill ${p.status==='ativo'?'verde':'vermelho'}">${p.status==='ativo'?'Ativo':'Inativo'}</span></td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="cabecalho-pagina">
      <div><h2>Usuários</h2><p>Quem tem acesso ao sistema da secretaria</p></div>
      <button class="botao terracota pequeno" id="btn-convidar">+ Convidar por e-mail</button>
    </div>
    <div id="msg-convite"></div>
    <div class="painel">
      <table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Status</th></tr></thead><tbody>${linhas}</tbody></table>
    </div>`;
  document.getElementById('btn-convidar').addEventListener('click', abrirModalConvite);
}

function abrirModalConvite(){
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <div class="modal-topo"><h3>Convidar novo usuário</h3><button data-fechar>✕</button></div>
      <div id="msg-modal-convite"></div>
      <form id="form-convite">
        <div class="campo"><label>Nome completo</label><input type="text" id="conv-nome" required /></div>
        <div class="campo"><label>E-mail</label><input type="email" id="conv-email" required /></div>
        <div class="campo"><label>Papel</label>
          <select id="conv-role"><option value="secretaria">Secretaria</option><option value="admin">Administrador</option></select>
        </div>
        <button class="botao terracota" type="submit" id="btn-enviar-convite">Enviar convite por e-mail</button>
      </form>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('form-convite').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = document.getElementById('conv-nome').value.trim();
    const email = document.getElementById('conv-email').value.trim();
    const role = document.getElementById('conv-role').value;
    const btn = document.getElementById('btn-enviar-convite');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try{
      const { data: { session } } = await supabase.auth.getSession();
      const resp = await fetch(`${EDGE_URL}/convidar-usuario`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ nome, email, role }),
      });
      const json = await resp.json();
      if(!resp.ok) throw new Error(json.error || 'Falha ao enviar convite');
      modal.remove();
      document.getElementById('msg-convite').innerHTML = `<div class="msg-ok">Convite enviado para ${esc(email)}.</div>`;
      const { data: perfis } = await supabase.from('perfis').select('*').order('created_at');
      ESTADO.perfis = perfis || [];
      renderizarApp();
    }catch(err){
      document.getElementById('msg-modal-convite').innerHTML = `<div class="msg-erro">${esc(err.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Enviar convite por e-mail';
    }
  });
}

iniciar();
</script>
</body>
</html>
