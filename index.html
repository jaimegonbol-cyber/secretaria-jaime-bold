  const { data, error } = alunoId ? await query.eq('aluno_id', alunoId) : await query.eq('arquivo_morto_id', arquivoMortoId);
  if(error){ el.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }
  if(!data || !data.length){ el.innerHTML = `<p style="color:var(--texto-suave);font-size:12.5px;">Nenhum documento anexado ainda.</p>`; return; }
  el.innerHTML = data.map(a => `
    <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--borda);font-size:12.5px;">
      <span>${a.tipo === 'imagem' ? '🖼️' : '📄'}</span>
      <a href="${a.url}" target="_blank" rel="noopener" style="flex:1;color:var(--terracota);text-decoration:underline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(a.nome_arquivo)}</a>
      <span style="color:var(--texto-suave);">${formatarDataBR(a.criado_em?.slice(0,10))}</span>
      <button type="button" class="botao secundario pequeno" data-remover-anexo="${a.id}" style="width:auto;padding:2px 8px;">Remover</button>
    </div>`).join('');
  el.querySelectorAll('[data-remover-anexo]').forEach(b => b.addEventListener('click', async () => {
    await supabase.from('historico_escolar_anexos').delete().eq('id', b.dataset.removerAnexo);
    renderizarAnexosHistorico(el, { alunoId, arquivoMortoId });
  }));
}

function exibirFormularioAno(formEl, registro, conteudo, elPai, contexto){
  const r = registro || {};
  const alunoId = contexto?.alunoId || null;
  const arquivoMortoId = contexto?.arquivoMortoId || null;
  const CAMPOS_DISCIPLINA_LIVRE = { nota_extra_1: 'nome_extra_1', nota_extra_2: 'nome_extra_2' };
  const campoMaterias = MATERIAS_HISTORICO.map(([campo, nome]) => {
    if(CAMPOS_DISCIPLINA_LIVRE[campo]){
      const campoNome = CAMPOS_DISCIPLINA_LIVRE[campo];
      return `
    <div class="campo" style="margin-bottom:0;">
      <label>${esc(nome)} (opcional)</label>
      <input type="text" class="he-materia-nome" data-campo-nome="${campoNome}" value="${esc(r[campoNome]||'')}" placeholder="Nome da disciplina" style="margin-bottom:4px;" />
      <input type="text" class="he-materia" data-campo="${campo}" value="${esc(r[campo]||'')}" placeholder="Nota — Ex: 8,5" />
    </div>`;
    }
    return `
    <div class="campo" style="margin-bottom:0;"><label>${esc(nome)}</label><input type="text" class="he-materia" data-campo="${campo}" value="${esc(r[campo]||'')}" placeholder="Ex: 8,5" /></div>
  `;
  }).join('');

  formEl.innerHTML = `
    <div class="painel" style="border-color:var(--terracota);">
      <div class="barra" style="padding:10px 14px;"><strong style="font-size:14px;">${registro ? 'Editar ano letivo' : 'Novo ano letivo'}</strong></div>
      <div style="padding:12px 14px;">
        <div class="campo" style="border:1px dashed var(--borda);border-radius:10px;padding:10px 12px;margin-bottom:14px;">
          <label>Anexar histórico ou ata de notas (foto ou PDF) para preencher automaticamente</label>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <input type="file" id="he-anexo" accept="image/*,application/pdf" style="flex:1;min-width:200px;" />
            <span id="msg-extracao" style="font-size:12.5px;color:var(--texto-suave);"></span>
          </div>
        </div>
        <div class="grade-2" style="grid-template-columns:repeat(4, 1fr);gap:10px;">
          <div class="campo" style="margin-bottom:0;"><label>Ano civil</label><input type="number" id="he-ano-civil" value="${r.ano_civil || new Date().getFullYear()}" /></div>
          <div class="campo" style="margin-bottom:0;"><label>Série</label><input type="text" id="he-serie" value="${esc(r.serie||'')}" placeholder="Ex: 3º ANO" /></div>
          <div class="campo" style="margin-bottom:0;"><label>Carga horária anual</label><input type="text" id="he-carga" value="${esc(r.carga_horaria_anual||'')}" placeholder="Ex: 800h" /></div>
          <div class="campo" style="margin-bottom:0;"><label>Frequência anual</label><input type="text" id="he-freq" value="${esc(r.frequencia_anual||'')}" placeholder="Ex: 85%" /></div>
        </div>
        <div class="grade-2" style="grid-template-columns:2fr 1fr;gap:10px;margin-top:10px;">
          <div class="campo" style="margin-bottom:0;">
            <label>Unidade de ensino</label>
            <div style="display:flex;gap:6px;">
              <input type="text" id="he-unidade" value="${esc(r.unidade_ensino||'')}" style="flex:1;" />
              <button type="button" class="botao secundario pequeno" id="btn-usar-esta-escola" style="width:auto;white-space:nowrap;">Esta escola</button>
            </div>
          </div>
          <div class="campo" style="margin-bottom:0;"><label>Cidade</label><input type="text" id="he-cidade" value="${esc(r.cidade||'')}" /></div>
        </div>
        <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
          <div class="campo" style="margin-bottom:0;"><label>UF</label>${selectUF('he-uf', r.uf||'PE')}</div>
          <div class="campo" style="margin-bottom:0;"><label>Progressão</label>
            <select id="he-progressao">
              <option value="" ${!r.progressao?'selected':''}>—</option>
              <option value="cursando" ${r.progressao==='cursando'?'selected':''}>Cursando</option>
              <option value="plena" ${r.progressao==='plena'?'selected':''}>Plena</option>
              <option value="parcial" ${r.progressao==='parcial'?'selected':''}>Parcial</option>
              <option value="retido" ${r.progressao==='retido'?'selected':''}>Retido</option>
            </select>
          </div>
        </div>
        <div class="secao-titulo" style="margin-top:14px;">Notas por componente curricular</div>
        <div class="grade-2" style="grid-template-columns:repeat(3, 1fr);gap:10px;">
          ${campoMaterias}
        </div>
        <div class="campo" style="margin-top:10px;"><label>Observações</label><input type="text" id="he-obs" value="${esc(r.observacoes||'')}" /></div>
        <div id="msg-form-historico" style="margin-top:8px;"></div>
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="botao terracota pequeno" id="btn-salvar-ano-historico" style="width:auto;">Salvar</button>
          <button class="botao secundario pequeno" id="btn-cancelar-ano-historico" style="width:auto;">Cancelar</button>
        </div>
      </div>
    </div>`;

  document.getElementById('he-anexo').addEventListener('change', async (e) => {
    const arquivo = e.target.files[0];
    const msgExtracao = document.getElementById('msg-extracao');
    if(!arquivo) return;
    msgExtracao.textContent = 'Lendo documento e extraindo dados…';
    msgExtracao.style.color = 'var(--texto-suave)';
    try{
      const base64Data = await new Promise((res, rej) => {
        const leitor = new FileReader();
        leitor.onload = () => res(leitor.result.split(',')[1]);
        leitor.onerror = () => rej(new Error('Falha ao ler o arquivo'));
        leitor.readAsDataURL(arquivo);
      });
      const { data: resposta, error } = await supabase.functions.invoke('extrair-historico', {
        body: { mediaType: arquivo.type, base64Data },
      });
      if(error || !resposta || resposta.error){
        msgExtracao.textContent = (resposta && resposta.error) || 'Não foi possível extrair os dados do documento.';
        msgExtracao.style.color = 'var(--erro)';
        return;
      }
      const dados = resposta.dados || {};
      const preencher = (id, valor) => { const campo = document.getElementById(id); if(campo && valor !== null && valor !== undefined && valor !== '') campo.value = valor; };
      preencher('he-ano-civil', dados.ano_civil);
      preencher('he-serie', dados.serie);
      preencher('he-unidade', dados.unidade_ensino);
      preencher('he-cidade', dados.cidade);
      preencher('he-uf', dados.uf);
      preencher('he-carga', dados.carga_horaria_anual);
      preencher('he-freq', dados.frequencia_anual);
      if(dados.progressao) preencher('he-progressao', dados.progressao);
      preencher('he-obs', dados.observacoes);
      document.querySelectorAll('.he-materia').forEach(campo => {
        const valor = dados[campo.dataset.campo];
        if(valor !== null && valor !== undefined && valor !== '') campo.value = valor;
      });
      msgExtracao.textContent = 'Dados extraídos! Confira os campos antes de salvar.';
      msgExtracao.style.color = 'var(--verde-escuro, #2E7D32)';
    } catch(err){
      msgExtracao.textContent = 'Erro ao processar o anexo: ' + err.message;
      msgExtracao.style.color = 'var(--erro)';
    }
  });
  document.getElementById('btn-usar-esta-escola').addEventListener('click', () => {
    document.getElementById('he-unidade').value = 'ESCOLA MUNICIPAL JAIME GONÇALVES BOLD';
    document.getElementById('he-cidade').value = 'PAULISTA';
    document.getElementById('he-uf').value = 'PE';
  });
  document.getElementById('btn-cancelar-ano-historico').addEventListener('click', () => {
    ESTADO.histEscEditando = null;
    formEl.innerHTML = '';
  });
  document.getElementById('btn-salvar-ano-historico').addEventListener('click', async () => {
    const btn = document.getElementById('btn-salvar-ano-historico');
    const anoCivil = parseInt(document.getElementById('he-ano-civil').value, 10);
    const msg = document.getElementById('msg-form-historico');
    if(!anoCivil){ msg.innerHTML = `<div class="msg-erro">Informe o ano civil.</div>`; return; }
    btn.disabled = true; btn.textContent = 'Salvando…';
    const dados = {
      aluno_id: alunoId,
      arquivo_morto_id: arquivoMortoId,
      ano_civil: anoCivil,
      serie: document.getElementById('he-serie').value.trim() || null,
      unidade_ensino: document.getElementById('he-unidade').value.trim() || null,
      cidade: document.getElementById('he-cidade').value.trim() || null,
      uf: document.getElementById('he-uf').value || null,
      carga_horaria_anual: document.getElementById('he-carga').value.trim() || null,
      frequencia_anual: document.getElementById('he-freq').value.trim() || null,
      progressao: document.getElementById('he-progressao').value || null,
      observacoes: document.getElementById('he-obs').value.trim() || null,
    };
    document.querySelectorAll('.he-materia').forEach(campo => {
      dados[campo.dataset.campo] = campo.value.trim() || null;
    });
    document.querySelectorAll('.he-materia-nome').forEach(campo => {
      dados[campo.dataset.campoNome] = campo.value.trim() || null;
    });
    const { error } = await supabase.from('historico_escolar_anual').upsert(dados, { onConflict: alunoId ? 'aluno_id,ano_civil' : 'arquivo_morto_id,ano_civil' });
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Salvar'; return; }
    ESTADO.histEscEditando = null;
    renderizarBancoHistorico(conteudo, elPai, contexto);
  });
}

async function gerarHistoricoEscolarDocumentoArquivoMorto(arquivoMortoId, anos){
  const { data: registro, error } = await supabase.from('arquivo_morto').select('*').eq('id', arquivoMortoId).maybeSingle();
  if(error || !registro){ alert('Não foi possível carregar os dados do estudante no Arquivo Inativo.'); return; }
  const alunoSintetico = {
    id: null,
    nome: registro.nome,
    data_nascimento: registro.data_nascimento,
    naturalidade: registro.naturalidade ? `${registro.naturalidade}${registro.uf_naturalidade ? '/'+registro.uf_naturalidade : ''}` : '',
    rg: registro.rg,
    _nomeMae: registro.nome_mae || '',
    _nomePai: registro.nome_pai || '',
  };
  gerarHistoricoEscolarDocumento(alunoSintetico, anos);
}

async function gerarHistoricoEscolarDocumento(aluno, anos){
  let nomeMae = aluno._nomeMae || '';
  let nomePai = aluno._nomePai || '';
  if(aluno.id && !aluno._semVinculoResponsavel){
    const { data: vinculos } = await supabase.from('aluno_responsavel').select('tipo, responsaveis(nome)').eq('aluno_id', aluno.id);
    const mae = (vinculos||[]).find(v => v.tipo === 'mae');
    const pai = (vinculos||[]).find(v => v.tipo === 'pai');
    nomeMae = mae?.responsaveis?.nome || '';
    nomePai = pai?.responsaveis?.nome || '';
  }
  const ultimoRegistro = anos[anos.length-1] || null;
  const estaCursandoAnoAtual = ultimoRegistro?.progressao === 'cursando';
  const registroConcluido = estaCursandoAnoAtual ? anos[anos.length-2] : ultimoRegistro;
  const serieMaisRecente = registroConcluido?.serie || '____';
  const textoSituacaoAtual = estaCursandoAnoAtual
    ? ` O(a) estudante encontra-se cursando o(a) <b>${esc(ultimoRegistro.serie || '____')}</b> no ano letivo de <b>${esc(String(ultimoRegistro.ano_civil || ''))}</b>.`
    : '';
  const textoObservacoes = anos.filter(r => r.observacoes && r.observacoes.trim())
    .map(r => esc(r.observacoes.trim())).join('<br/><br/>');

  const materiasBNC = MATERIAS_HISTORICO.slice(0, 7);
  const materiasDiv = MATERIAS_HISTORICO.slice(7);
  const CAMPOS_DISCIPLINA_LIVRE = { nota_extra_1: 'nome_extra_1', nota_extra_2: 'nome_extra_2' };
  function nomeDisciplinaLivre(campoNomeLivre){
    const registro = anos.find(r => (r[campoNomeLivre] || '').trim());
    return registro ? registro[campoNomeLivre].trim() : '';
  }
  const cabecalhoMaterias = [...materiasBNC, ...materiasDiv].map(([campo, nome]) => {
    const campoNomeLivre = CAMPOS_DISCIPLINA_LIVRE[campo];
    const rotulo = campoNomeLivre ? nomeDisciplinaLivre(campoNomeLivre) : nome;
    return `<th class="materia-vertical">${esc(rotulo)}</th>`;
  }).join('');

  const NOMES_SERIE = {
    1: ['1º ANO'],
    2: ['2º ANO', '1ª SÉRIE'],
    3: ['3º ANO', '2ª SÉRIE', 'FASE I'],
    4: ['4º ANO', '3ª SÉRIE'],
    5: ['5º ANO', '4ª SÉRIE', 'FASE II'],
    6: ['6º ANO', '5ª SÉRIE'],

    8: ['8º ANO', '7ª SÉRIE'],
    9: ['9º ANO', '8ª SÉRIE', 'FASE IV'],
  };
  function rotuloSerieHtml(numero, cursada){
    return NOMES_SERIE[numero].map((nome, i) => `<div style="white-space:nowrap;">(<span style="visibility:${cursada && i===0 ? 'visible' : 'hidden'};">X</span>) ${nome}</div>`).join('');
  }

  const registrosPorSerie = {};
  anos.forEach(r => {
    const m = (r.serie || '').match(/(\d+)/);
    const numero = m ? parseInt(m[1], 10) : null;

const TIPOS_DOCUMENTO_SOLICITACAO = [
  'Declaração de Matrícula',
  'Declaração de Frequência Escolar',
  'Declaração Provisória de Transferência',
  'Histórico Escolar',
  'Outro',
];

function renderizarSolicitacoes(el){
  el.innerHTML = `
    <div class="painel">
      <div class="barra" style="padding:10px 14px;flex-wrap:wrap;gap:10px;">
        <strong style="font-size:14px;">Solicitações</strong>
        <select id="sol-filtro-status" style="width:auto;margin-left:auto;">
          <option value="pendente" ${ESTADO.solicFiltroStatus==='pendente'?'selected':''}>Pendentes</option>
          <option value="concluido" ${ESTADO.solicFiltroStatus==='concluido'?'selected':''}>Concluídas</option>
          <option value="" ${ESTADO.solicFiltroStatus===''?'selected':''}>Todas</option>
        </select>
        <button class="botao terracota pequeno" id="btn-nova-solicitacao" style="width:auto;">+ Nova solicitação</button>
      </div>
      ${ESTADO.solicMsgSucesso ? `<div class="msg-ok" style="margin:14px 14px 0;">${esc(ESTADO.solicMsgSucesso)}</div>` : ''}
      <div id="lista-solicitacoes" style="padding:14px;max-height:70vh;overflow-y:auto;"></div>
    </div>`;
  ESTADO.solicMsgSucesso = null;

  document.getElementById('sol-filtro-status').addEventListener('change', (e) => {
    ESTADO.solicFiltroStatus = e.target.value;
    carregarListaSolicitacoes(el);
  });
  document.getElementById('btn-nova-solicitacao').addEventListener('click', () => {
    abrirModalNovaSolicitacao(el);
  });

  carregarListaSolicitacoes(el);
}

function abrirModalNovaSolicitacao(elLista){
  const opcoesTurmas = ESTADO.turmas.slice().sort((a,b) => a.nome.localeCompare(b.nome))
    .map(t => `<option value="${t.id}">${esc(t.nome)} · ${esc(t.turno)}</option>`).join('');
  const opcoesAlunos = ESTADO.alunos.slice().sort((a,b) => a.nome.localeCompare(b.nome))
    .map(a => `<option value="${a.id}" data-turma="${a.turma_id||''}">${esc(a.nome)}</option>`).join('');
  const opcoesTipo = TIPOS_DOCUMENTO_SOLICITACAO.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');

  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:560px;">
      <div class="modal-topo"><h3>Nova solicitação</h3><button data-fechar>✕</button></div>
      <p style="color:var(--texto-suave);font-size:12.5px;margin:-6px 0 16px;">Preencha os dados da solicitação de documento.</p>
      <div id="msg-nova-solicitacao"></div>
      <div class="campo"><label>Tipo de documento</label><select id="sol-tipo">${opcoesTipo}</select></div>
      <div class="campo" id="campo-sol-outro" style="display:none;"><label>Qual documento?</label><input type="text" id="sol-outro" placeholder="Digite o documento solicitado" /></div>
      <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
        <div class="campo"><label>Turma (opcional)</label><select id="sol-turma"><option value="">—</option>${opcoesTurmas}</select></div>
        <div class="campo"><label>Estudante (opcional)</label><select id="sol-aluno"><option value="">—</option>${opcoesAlunos}</select></div>
      </div>
      <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
        <div class="campo"><label>Nome do solicitante</label><input type="text" id="sol-solicitante" placeholder="Ex: nome do responsável" /></div>
        <div class="campo"><label>Telefone do solicitante</label><input type="text" id="sol-telefone" placeholder="Ex: (81) 9xxxx-xxxx" /></div>
      </div>
      <div class="campo"><label>Data da solicitação</label><input type="date" id="sol-data" value="${hojeISO()}" /></div>
      <div class="campo" style="margin-bottom:0;"><label>Observações</label><input type="text" id="sol-obs" /></div>
      <button class="botao terracota pequeno" id="btn-salvar-solicitacao" style="margin-top:16px;width:auto;">Registrar solicitação</button>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('sol-tipo').addEventListener('change', (e) => {
    document.getElementById('campo-sol-outro').style.display = e.target.value === 'Outro' ? '' : 'none';
  });
  document.getElementById('sol-turma').addEventListener('change', (e) => {
    const turmaId = e.target.value;
    const selectAluno = document.getElementById('sol-aluno');
    Array.from(selectAluno.options).forEach(opt => {
      opt.hidden = turmaId && opt.value && opt.dataset.turma !== turmaId;
    });
    if(selectAluno.selectedOptions[0]?.hidden) selectAluno.value = '';
  });
  document.getElementById('sol-aluno').addEventListener('change', (e) => {
    const turmaDoAluno = e.target.selectedOptions[0]?.dataset.turma;
    if(turmaDoAluno) document.getElementById('sol-turma').value = turmaDoAluno;
  });

  document.getElementById('btn-salvar-solicitacao').addEventListener('click', async () => {
    const msg = document.getElementById('msg-nova-solicitacao');
    const tipo = document.getElementById('sol-tipo').value;
    const outro = document.getElementById('sol-outro').value.trim();
    const solicitante = document.getElementById('sol-solicitante').value.trim();
    if(!solicitante){ msg.innerHTML = `<div class="msg-erro">Informe o nome do solicitante.</div>`; return; }
    if(tipo === 'Outro' && !outro){ msg.innerHTML = `<div class="msg-erro">Digite qual documento está sendo solicitado.</div>`; return; }
    const btn = document.getElementById('btn-salvar-solicitacao');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const dados = {
      tipo_documento: tipo,
      documento_outro: tipo === 'Outro' ? outro : null,
      aluno_id: document.getElementById('sol-aluno').value || null,
      turma_id: document.getElementById('sol-turma').value || null,
      telefone_solicitante: document.getElementById('sol-telefone').value.trim() || null,
      nome_solicitante: solicitante,
      data_solicitacao: document.getElementById('sol-data').value || hojeISO(),
      observacoes: document.getElementById('sol-obs').value.trim() || null,
      registrado_por: ESTADO.perfil.id,
    };
    const { error } = await supabase.from('solicitacoes_documentos').insert(dados);
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Registrar solicitação'; return; }
    modal.remove();
    ESTADO.solicMsgSucesso = 'Solicitação registrada com sucesso.';
    renderizarSolicitacoes(elLista);
  });
}

async function carregarListaSolicitacoes(el){
  const lista = document.getElementById('lista-solicitacoes');
  lista.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Carregando…</p>`;
  let query = supabase.from('solicitacoes_documentos')
    .select('*, alunos(nome), turmas(nome), registrado:registrado_por(nome), concluido:concluido_por(nome)')
    .order('data_solicitacao', { ascending:false });
  if(ESTADO.solicFiltroStatus) query = query.eq('status', ESTADO.solicFiltroStatus);
  const { data, error } = await query;
  if(error){ lista.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }
  if(!data || !data.length){
    lista.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Nenhuma solicitação encontrada.</p>`;
    return;
  }
  const linhas = data.map(s => `
    <tr data-id="${s.id}">
      <td style="white-space:nowrap;">${fmtData(s.data_solicitacao)}</td>
      <td style="white-space:nowrap;color:var(--texto-suave);">${formatarHoraBR(s.created_at)}</td>
      <td>${esc(s.tipo_documento === 'Outro' ? (s.documento_outro || 'Outro') : s.tipo_documento)}</td>
      <td>${esc(s.turmas?.nome || '—')}</td>
      <td>${esc(s.alunos?.nome || '—')}</td>
      <td>${esc(s.nome_solicitante)}${s.telefone_solicitante ? '<br/><span style="color:var(--texto-suave);">'+esc(s.telefone_solicitante)+'</span>' : ''}</td>
      <td>${esc(s.registrado?.nome || '—')}</td>
      <td style="white-space:nowrap;">${s.status === 'concluido'
        ? `<span class="pill verde">Concluído</span>`
        : `<span class="pill vermelho">Pendente</span>`}</td>
      <td style="white-space:nowrap;text-align:right;">
        ${s.status === 'pendente' ? `<button class="botao secundario pequeno" data-concluir-solicitacao="${s.id}" style="width:auto;padding:3px 8px;font-size:11px;">Concluir</button>` : ''}
        <button class="btn-icone perigo" data-excluir-solicitacao="${s.id}" title="Excluir solicitação" style="padding:3px 6px;">🗑️</button>
      </td>
    </tr>`).join('');
  lista.innerHTML = `<table class="tabela-compacta"><thead><tr><th>Data</th><th>Horário</th><th>Documento</th><th>Turma</th><th>Estudante</th><th>Solicitante</th><th>Registrado por</th><th>Status</th><th></th></tr></thead><tbody>${linhas}</tbody></table>`;
  lista.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', (e) => {
    if(e.target.closest('[data-concluir-solicitacao], [data-excluir-solicitacao]')) return;
    const solicitacao = data.find(s => s.id === tr.dataset.id);
    if(solicitacao) abrirModalSolicitacao(solicitacao, el);
  }));
  lista.querySelectorAll('[data-concluir-solicitacao]').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    await supabase.from('solicitacoes_documentos').update({
      status: 'concluido', concluido_por: ESTADO.perfil.id, concluido_em: new Date().toISOString(),
    }).eq('id', b.dataset.concluirSolicitacao);
    carregarListaSolicitacoes(el);
  }));
  lista.querySelectorAll('[data-excluir-solicitacao]').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    if(!confirm('Tem certeza que deseja excluir esta solicitação? Essa ação não pode ser desfeita.')) return;
    b.disabled = true;
    const { error } = await supabase.from('solicitacoes_documentos').delete().eq('id', b.dataset.excluirSolicitacao);
    if(error){ alert('Erro ao excluir: ' + error.message); b.disabled = false; return; }
    carregarListaSolicitacoes(el);
  }));
}

function abrirModalSolicitacao(s, elLista){
  const opcoesTurmas = ESTADO.turmas.slice().sort((a,b) => a.nome.localeCompare(b.nome))
    .map(t => `<option value="${t.id}" ${s.turma_id===t.id?'selected':''}>${esc(t.nome)} · ${esc(t.turno)}</option>`).join('');
  const opcoesAlunos = ESTADO.alunos.slice().sort((a,b) => a.nome.localeCompare(b.nome))
    .map(a => `<option value="${a.id}" data-turma="${a.turma_id||''}" ${s.aluno_id===a.id?'selected':''}>${esc(a.nome)}</option>`).join('');
  const opcoesTipo = TIPOS_DOCUMENTO_SOLICITACAO.map(t => `<option value="${esc(t)}" ${s.tipo_documento===t?'selected':''}>${esc(t)}</option>`).join('');

  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:560px;">
      <div class="modal-topo"><h3>Checar solicitação</h3><button data-fechar>✕</button></div>
      <p style="color:var(--texto-suave);font-size:12.5px;margin:-6px 0 16px;">Confira e corrija os dados antes de imprimir ou concluir.</p>
      <div id="msg-modal-solicitacao"></div>
      <div class="campo"><label>Tipo de documento</label><select id="ms-tipo">${opcoesTipo}</select></div>
      <div class="campo" id="ms-campo-outro" style="${s.tipo_documento==='Outro'?'':'display:none;'}"><label>Qual documento?</label><input type="text" id="ms-outro" value="${esc(s.documento_outro||'')}" /></div>
      <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
        <div class="campo"><label>Turma</label><select id="ms-turma"><option value="">—</option>${opcoesTurmas}</select></div>
        <div class="campo"><label>Estudante</label><select id="ms-aluno"><option value="">—</option>${opcoesAlunos}</select></div>
      </div>
      <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
        <div class="campo"><label>Nome do solicitante</label><input type="text" id="ms-solicitante" value="${esc(s.nome_solicitante||'')}" /></div>
        <div class="campo"><label>Telefone do solicitante</label><input type="text" id="ms-telefone" value="${esc(s.telefone_solicitante||'')}" /></div>
      </div>
      <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
        <div class="campo"><label>Data da solicitação</label><input type="date" id="ms-data" value="${esc(s.data_solicitacao||'')}" /></div>
        <div class="campo"><label>Status</label><div style="padding-top:8px;">${s.status==='concluido' ? `<span class="pill verde">Concluído${s.concluido?.nome ? ' — '+esc(s.concluido.nome):''}</span>` : `<span class="pill vermelho">Pendente</span>`}</div></div>
      </div>
      <div class="campo" style="margin-bottom:0;"><label>Observações</label><input type="text" id="ms-obs" value="${esc(s.observacoes||'')}" /></div>
      <p style="font-size:12px;color:var(--texto-suave);margin:10px 0 0;">Registrado por ${esc(s.registrado?.nome || '—')} às ${formatarHoraBR(s.created_at)}</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center;">
        <button class="botao terracota pequeno" id="ms-salvar" style="width:auto;">Salvar alterações</button>
        <button class="botao secundario pequeno" id="ms-imprimir" style="width:auto;">Ir para impressão</button>
        ${s.status === 'pendente'
          ? `<button class="botao secundario pequeno" id="ms-concluir" style="width:auto;">Marcar concluída</button>`
          : `<button class="botao secundario pequeno" id="ms-reabrir" style="width:auto;">Reabrir</button>`}
        <button class="btn-icone perigo" id="ms-excluir" title="Excluir solicitação" style="margin-left:auto;">🗑️</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('ms-tipo').addEventListener('change', (e) => {
    document.getElementById('ms-campo-outro').style.display = e.target.value === 'Outro' ? '' : 'none';
  });
  document.getElementById('ms-turma').addEventListener('change', (e) => {
    const turmaId = e.target.value;
    const selectAluno = document.getElementById('ms-aluno');
    Array.from(selectAluno.options).forEach(opt => { opt.hidden = turmaId && opt.value && opt.dataset.turma !== turmaId; });
    if(selectAluno.selectedOptions[0]?.hidden) selectAluno.value = '';
  });
  document.getElementById('ms-aluno').addEventListener('change', (e) => {
    const turmaDoAluno = e.target.selectedOptions[0]?.dataset.turma;
    if(turmaDoAluno) document.getElementById('ms-turma').value = turmaDoAluno;
  });

  function coletarDadosSolicitacao(){
    const tipo = document.getElementById('ms-tipo').value;
    return {
      tipo_documento: tipo,
      documento_outro: tipo === 'Outro' ? (document.getElementById('ms-outro').value.trim() || null) : null,
      turma_id: document.getElementById('ms-turma').value || null,
      aluno_id: document.getElementById('ms-aluno').value || null,

      observacoes: document.getElementById('ms-obs').value.trim() || null,

  }

    btn.disabled = true; btn.textContent = 'Salvando…';

    if(!aluno){ msg.innerHTML = `<div class="msg-erro">Estudante não encontrado.</div>`; return; }
    const mapaTipo = {
      'Declaração de Matrícula':'declaracao_matricula',
      'Declaração de Frequência Escolar':'declaracao_frequencia',
      'Declaração Provisória de Transferência':'declaracao_provisoria',
    };
    if(!mapaTipo[dados.tipo_documento] && dados.tipo_documento !== 'Histórico Escolar'){
      msg.innerHTML = `<div class="msg-erro">Este tipo de documento não tem geração automática nesta tela. Providencie manualmente e depois marque como concluída.</div>`;
      return;
    }
    await supabase.from('solicitacoes_documentos').update(dados).eq('id', s.id);
    modal.remove();
    if(mapaTipo[dados.tipo_documento]){
      ESTADO.docTipo = mapaTipo[dados.tipo_documento];
      ESTADO.docTurmaId = aluno.turma_id || '';
      ESTADO.docAlunoId = aluno.id;
      ESTADO.subDocumentos = 'declaracoes';
    } else {
      ESTADO.histEscAlunoId = aluno.id;
      ESTADO.histEscTurmaId = aluno.turma_id || '';
      ESTADO.subDocumentos = 'historico_escolar';
    }
    renderizarApp();
  });

  if(s.status === 'pendente'){
    document.getElementById('ms-concluir').addEventListener('click', async () => {
      await supabase.from('solicitacoes_documentos').update({
        status: 'concluido', concluido_por: ESTADO.perfil.id, concluido_em: new Date().toISOString(),
      }).eq('id', s.id);
      modal.remove();
      carregarListaSolicitacoes(elLista);
    });
  } else {
    document.getElementById('ms-reabrir').addEventListener('click', async () => {
      await supabase.from('solicitacoes_documentos').update({
        status: 'pendente', concluido_por: null, concluido_em: null,
      }).eq('id', s.id);
      modal.remove();
      carregarListaSolicitacoes(elLista);
    });
  }

  document.getElementById('ms-excluir').addEventListener('click', async () => {
    if(!confirm('Tem certeza que deseja excluir esta solicitação? Essa ação não pode ser desfeita.')) return;
    const { error } = await supabase.from('solicitacoes_documentos').delete().eq('id', s.id);
    if(error){ alert('Erro ao excluir: ' + error.message); return; }
    modal.remove();
    carregarListaSolicitacoes(elLista);
  });
}

// Procura, no array de qualificações já salvas, o valor correspondente a este item
// (itens com detalhe são salvos como "texto: detalhe", itens simples como o próprio texto).
function encontrarValorQualificacaoSalva(item, qualificacoesSalvas){
  return (qualificacoesSalvas || []).find(v => v === item.texto || v.startsWith(item.texto + ':'));
}
function extrairDetalheQualificacaoSalva(item, valorSalvo){
  if(!item.detalhe || !valorSalvo || !valorSalvo.includes(':')) return '';
  return valorSalvo.slice(item.texto.length + 1).trim();
}

function renderizarOcorrencias(el){
  const opcoesTurmas = ESTADO.turmas.slice().sort((a,b) => a.nome.localeCompare(b.nome))
    .map(t => `<option value="${t.id}" ${ESTADO.ocorrenciasTurmaId===t.id?'selected':''}>${esc(t.nome)} · ${esc(t.turno)}</option>`).join('');
  const alunosFiltrados = (ESTADO.ocorrenciasTurmaId ? ESTADO.alunos.filter(a => a.turma_id === ESTADO.ocorrenciasTurmaId) : ESTADO.alunos)
    .slice().sort((a,b) => a.nome.localeCompare(b.nome));
  const opcoesAlunos = alunosFiltrados.map(a => `<option value="${a.id}" ${ESTADO.ocorrenciasAlunoId===a.id?'selected':''}>${esc(a.nome)}</option>`).join('');

  el.innerHTML = `
    <div class="painel">
      <div class="barra" style="padding:10px 14px;flex-wrap:wrap;gap:12px;">
        <div class="campo" style="margin:0;min-width:220px;"><label>Turma</label><select id="oc-turma"><option value="">Todas as turmas</option>${opcoesTurmas}</select></div>
        <div class="campo" style="margin:0;min-width:260px;flex:1;"><label>Estudante</label><select id="oc-aluno"><option value="">Selecione o estudante</option>${opcoesAlunos}</select></div>
      </div>
      <div id="oc-conteudo" style="padding:12px 14px;"></div>
    </div>`;

  document.getElementById('oc-turma').addEventListener('change', e => {
    ESTADO.ocorrenciasTurmaId = e.target.value;
    if(ESTADO.ocorrenciasAlunoId && !ESTADO.alunos.find(a => a.id === ESTADO.ocorrenciasAlunoId && (!ESTADO.ocorrenciasTurmaId || a.turma_id === ESTADO.ocorrenciasTurmaId))){
      ESTADO.ocorrenciasAlunoId = '';
    }
    renderizarOcorrencias(el);
  });
  document.getElementById('oc-aluno').addEventListener('change', e => { ESTADO.ocorrenciasAlunoId = e.target.value; renderizarOcorrencias(el); });

  const conteudo = document.getElementById('oc-conteudo');
  if(!ESTADO.ocorrenciasAlunoId){
    carregarVisaoGeralOcorrencias(conteudo, el);

  }
  carregarOcorrencias(conteudo, el);
}

          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            ${!r.presenca_responsavel_confirmada ? `<button class="botao secundario pequeno" style="width:auto;color:#2E7D5B;border-color:#2E7D5B;" data-confirmar-presenca="${r.id}">✅ Confirmar presença</button>` : ''}
            <button class="botao secundario pequeno" style="width:auto;" data-imprimir-ficha="${r.id}">Imprimir ficha</button>
            <button class="botao terracota pequeno" style="width:auto;" data-gerar-comunicado="${r.id}">Gerar comunicado</button>
            <button class="botao secundario pequeno" style="width:auto;" data-editar-ocorrencia="${r.id}">Editar</button>
            <button class="botao secundario pequeno" style="width:auto;color:var(--erro);border-color:var(--erro);" data-excluir-ocorrencia="${r.id}">Excluir</button>
          </div>
        </div>`;
      }).join('')
    : `<p style="color:var(--texto-suave);font-size:13px;">Nenhuma ocorrência registrada para este estudante.</p>`;

  conteudo.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
      <div>
        <strong>${esc(aluno?.nome || '')}</strong>
        <div style="font-size:12.5px;color:var(--texto-suave);">${esc(turmaAluno?.nome || 'Sem turma')} · Total de ocorrências registradas</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:28px;font-weight:800;color:${corContador};line-height:1;">${total}</div>
      </div>
      <button class="botao terracota" style="width:auto;" id="btn-nova-ocorrencia">+ Registrar ocorrência</button>
    </div>
    <div id="oc-lista">${linhasHistorico}</div>`;

  document.getElementById('btn-nova-ocorrencia').addEventListener('click', () => abrirModalNovaOcorrencia(aluno, conteudo, elPai));
  conteudo.querySelectorAll('[data-confirmar-presenca]').forEach(b => {
    b.addEventListener('click', () => confirmarPresencaResponsavelOcorrencia(b.dataset.confirmarPresenca, () => carregarOcorrencias(conteudo, elPai)));
  });
  conteudo.querySelectorAll('[data-imprimir-ficha]').forEach(b => {
    b.addEventListener('click', () => {
      const registro = registros.find(r => r.id === b.dataset.imprimirFicha);
      imprimirFichaOcorrencia(registro, aluno);
    });
  });
  conteudo.querySelectorAll('[data-gerar-comunicado]').forEach(b => {
    b.addEventListener('click', () => {
      const registro = registros.find(r => r.id === b.dataset.gerarComunicado);
      imprimirComunicadoOcorrencia(registro, aluno);
    });
  });
  conteudo.querySelectorAll('[data-editar-ocorrencia]').forEach(b => {
    b.addEventListener('click', () => {
      const registro = registros.find(r => r.id === b.dataset.editarOcorrencia);
      abrirModalNovaOcorrencia(aluno, conteudo, elPai, registro);
    });
  });
  conteudo.querySelectorAll('[data-excluir-ocorrencia]').forEach(b => {
    b.addEventListener('click', () => {
      const registro = registros.find(r => r.id === b.dataset.excluirOcorrencia);
      excluirOcorrencia(registro, aluno, conteudo, elPai);
    });
  });
}

function badgePresencaResponsavel(r){
  if(r.presenca_responsavel_confirmada){
    return `<div style="font-size:11.5px;color:#2E7D5B;margin-top:2px;">✅ Presença do responsável confirmada em ${fmtData(r.presenca_responsavel_confirmada_em?.slice(0,10))}</div>`;
  }
  return `<div style="font-size:11.5px;color:#D98A1F;margin-top:2px;">⏳ Pendente: comparecimento do responsável</div>`;
}

async function confirmarPresencaResponsavelOcorrencia(idRegistro, aoConcluir){
  const { error } = await supabase.from('ocorrencias_estudantes').update({
    presenca_responsavel_confirmada: true,
    presenca_responsavel_confirmada_em: new Date().toISOString(),
    presenca_responsavel_confirmada_por: ESTADO.perfil.id,
  }).eq('id', idRegistro);
  if(error){ alert('Erro ao confirmar presença: ' + error.message); return; }
  if(aoConcluir) aoConcluir();
}

async function dataEhNaoLetiva(dataIso, turnoTurma){
  if(!dataIso) return false;
  const diaSemana = new Date(dataIso + 'T00:00:00').getDay();
  if(diaSemana === 0 || diaSemana === 6) return true;
  const { data: feriado } = await supabase.from('feriados').select('tipo, turno_afetado').eq('data', dataIso).maybeSingle();
  if(!feriado) return false;
  if(['feriado','ponto_facultativo','recesso'].includes(feriado.tipo)) return true;
  if(feriado.tipo === 'suspensao_aulas') return turnoAfetaSuspensao(turnoTurma, feriado.turno_afetado);
  return false;
}

      <div class="grade-2" style="grid-template-columns:1fr 1fr;gap:12px;">
        <div class="campo">
          <label>Espaço</label>
          <select id="oc-espaco"><option value="sala_de_aula" ${editando && registroExistente.espaco==='sala_de_aula'?'selected':''}>Sala de Aula</option><option value="outro" ${editando && registroExistente.espaco==='outro'?'selected':''}>Outro</option></select>
        </div>
        <div class="campo" id="campo-oc-espaco-outro" style="display:${editando && registroExistente.espaco==='outro'?'':'none'};"><label>Qual espaço?</label><input type="text" id="oc-espaco-outro" value="${editando ? esc(registroExistente.espaco_outro||'') : ''}" /></div>
      </div>
      <div class="campo"><label>Professor(a)</label><input type="text" id="oc-professor" placeholder="Nome do professor(a) responsável pelo registro" value="${editando ? esc(registroExistente.professor||'') : ''}" /></div>
      <div class="campo">
        <label>Qualificação da ocorrência</label>
        <div style="border:1px solid var(--borda);border-radius:8px;padding:12px;">
          ${checkboxesQualificacao}
          <label style="display:block;font-size:13px;margin-bottom:6px;cursor:pointer;text-align:left;padding-left:24px;text-indent:-24px;line-height:1.4;">
            <input type="checkbox" id="oc-outras-check" style="width:14px;height:14px;margin:0 7px 0 0;padding:0;border:1px solid var(--borda);border-radius:4px;background:white;appearance:auto;-webkit-appearance:auto;vertical-align:middle;" ${editando && registroExistente.outras_texto ? 'checked':''} />
            Outras ocorrências. Quais?
          </label>
          <input type="text" id="oc-outras-texto" placeholder="Descreva a ocorrência" value="${editando ? esc(registroExistente.outras_texto||'') : ''}" style="display:${editando && registroExistente.outras_texto ? '' : 'none'};width:100%;padding:8px;border:1px solid var(--borda);border-radius:6px;font-size:13px;" />
        </div>
      </div>

      ${!editando ? `
      <div class="campo">
        <label>Outros estudantes envolvidos nesta mesma ocorrência (opcional)</label>
        <p style="font-size:12px;color:var(--texto-suave);margin:0 0 6px;">Os estudantes marcados aqui recebem o mesmo registro (mesma data, qualificação e observações), cada um com sua própria ficha pra assinatura do respectivo responsável.</p>
        <input type="text" id="oc-busca-outros" placeholder="Buscar estudante para incluir…" style="margin-bottom:6px;" />
        <div id="oc-lista-outros" style="max-height:150px;overflow-y:auto;border:1px solid var(--borda);border-radius:8px;padding:8px;font-size:13px;"></div>
        <div id="oc-resumo-outros" style="margin-top:6px;font-size:12.5px;color:var(--texto-suave);"></div>
      </div>` : ''}
      <button class="botao terracota" id="btn-salvar-ocorrencia" style="margin-top:16px;width:auto;">${editando ? 'Salvar alterações' : 'Salvar e gerar ficha de ocorrência'}</button>
    </div>`;
  document.body.appendChild(modal);
  const outrosEstudantesSelecionados = new Set();
  function renderizarListaOutrosEstudantes(termo){
    const lista = document.getElementById('oc-lista-outros');
    if(!lista) return;
    const termoBusca = (termo||'').trim().toLowerCase();
    const candidatos = ESTADO.alunos
      .filter(a => a.id !== aluno.id && (a.situacao === 'matriculado' || !a.situacao))
      .filter(a => !termoBusca || a.nome.toLowerCase().includes(termoBusca))
      .sort((a,b) => a.nome.localeCompare(b.nome))
      .slice(0, 80);
    lista.innerHTML = candidatos.length ? candidatos.map(a => `
      <label style="display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer;">
        <input type="checkbox" class="chk-outro-estudante" data-id="${a.id}" ${outrosEstudantesSelecionados.has(a.id)?'checked':''} style="width:14px;height:14px;" />
        <span>${esc(a.nome)} <span style="color:var(--texto-suave);">· ${esc(ESTADO.turmas.find(t=>t.id===a.turma_id)?.nome || 'sem turma')}</span></span>
      </label>`).join('') : `<p style="color:var(--texto-suave);margin:0;">Nenhum estudante encontrado.</p>`;
    lista.querySelectorAll('.chk-outro-estudante').forEach(chk => chk.addEventListener('change', e => {
      if(e.target.checked) outrosEstudantesSelecionados.add(e.target.dataset.id);
      else outrosEstudantesSelecionados.delete(e.target.dataset.id);
      atualizarResumoOutros();
    }));
  }
  function atualizarResumoOutros(){
    const resumo = document.getElementById('oc-resumo-outros');
    if(!resumo) return;
    if(!outrosEstudantesSelecionados.size){ resumo.textContent = ''; return; }
    const nomes = Array.from(outrosEstudantesSelecionados).map(id => ESTADO.alunos.find(a => a.id === id)?.nome).filter(Boolean);
    resumo.innerHTML = `<b>${nomes.length}</b> estudante(s) adicionado(s): ${esc(nomes.join(', '))}`;
  }
  if(!editando){
    renderizarListaOutrosEstudantes('');
    document.getElementById('oc-busca-outros').addEventListener('input', e => renderizarListaOutrosEstudantes(e.target.value));
  }
  let dataAnteriorOc = editando ? registroExistente.data : hojeISO();
  const seletorDataOc = criarSeletorData('oc-data-wrap', dataAnteriorOc, async (novaData) => {
    if(novaData && novaData > hojeISO()){
      alert(`A data selecionada (${formatarDataBR(novaData)}) ainda não aconteceu. Selecione a data em que a ocorrência realmente ocorreu.`);
      seletorDataOc.definir(dataAnteriorOc);
      return;
    }
    if(novaData && await dataEhNaoLetiva(novaData, turmaAluno?.turno)){
      const confirmado = confirm(`A data selecionada (${formatarDataBR(novaData)}) é um dia não letivo (fim de semana, feriado ou recesso). Confirma que a ocorrência realmente aconteceu nesse dia?`);
      if(!confirmado){
        seletorDataOc.definir(dataAnteriorOc);
        return;
      }
    }
    dataAnteriorOc = novaData;
  }, { inputId: 'oc-data' });
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  document.getElementById('oc-espaco').addEventListener('change', e => {
    document.getElementById('campo-oc-espaco-outro').style.display = e.target.value === 'outro' ? '' : 'none';
  });
  document.getElementById('oc-outras-check').addEventListener('change', e => {
    document.getElementById('oc-outras-texto').style.display = e.target.checked ? '' : 'none';
  });
  modal.querySelectorAll('.oc-qualificacao[data-detalhe="1"]').forEach(chk => {

      const detalheInput = modal.querySelector(`.oc-qualificacao-detalhe[data-indice="${e.target.dataset.indice}"]`);

    });
  });

  document.getElementById('btn-salvar-ocorrencia').addEventListener('click', async () => {
    const msg = document.getElementById('msg-nova-ocorrencia');
    const qualificacoes = Array.from(modal.querySelectorAll('.oc-qualificacao:checked')).map(chk => {
      const texto = chk.dataset.texto;
      if(chk.dataset.detalhe === '1'){
        const detalheInput = modal.querySelector(`.oc-qualificacao-detalhe[data-indice="${chk.dataset.indice}"]`);
        const valorDetalhe = detalheInput ? detalheInput.value.trim() : '';
        return valorDetalhe ? `${texto}: ${valorDetalhe}` : texto;
      }
      return texto;
    });
    const outrasCheck = document.getElementById('oc-outras-check').checked;
    const outrasTexto = document.getElementById('oc-outras-texto').value.trim();
    if(outrasCheck && !outrasTexto){ msg.innerHTML = `<div class="msg-erro">Descreva a ocorrência no campo "Outras ocorrências".</div>`; return; }
    if(!qualificacoes.length && !(outrasCheck && outrasTexto)){ msg.innerHTML = `<div class="msg-erro">Selecione ao menos uma qualificação da ocorrência.</div>`; return; }
    const dataParaSalvar = document.getElementById('oc-data').value;
    if(!dataParaSalvar){ msg.innerHTML = `<div class="msg-erro">Selecione a data da ocorrência.</div>`; return; }
    if(dataParaSalvar > hojeISO()){ msg.innerHTML = `<div class="msg-erro">A data da ocorrência não pode estar no futuro.</div>`; return; }
    const btn = document.getElementById('btn-salvar-ocorrencia');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const dados = {
      aluno_id: aluno.id,
      turma_id: aluno.turma_id || null,
      data: document.getElementById('oc-data').value,
      hora: document.getElementById('oc-hora').value || null,
      espaco: document.getElementById('oc-espaco').value,
      espaco_outro: document.getElementById('oc-espaco').value === 'outro' ? document.getElementById('oc-espaco-outro').value.trim() : null,
      professor: document.getElementById('oc-professor').value.trim() || null,
      qualificacoes,
      outras_texto: outrasCheck ? outrasTexto : null,
      observacoes: document.getElementById('oc-observacoes').value.trim() || null,
    };
    if(editando){
      const { data: registro, error } = await supabase.from('ocorrencias_estudantes').update(dados).eq('id', registroExistente.id).select().single();
      if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Salvar alterações'; return; }
      modal.remove();
      carregarOcorrencias(conteudo, elPai);
      return;
    }
    dados.registrado_por = ESTADO.perfil.id;
    const { data: registro, error } = await supabase.from('ocorrencias_estudantes').insert(dados).select().single();
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Salvar e gerar ficha de ocorrência'; return; }
    registro.registrado = { nome: ESTADO.perfil.nome };

    const outrosIds = Array.from(outrosEstudantesSelecionados);
    let todosRegistros = [registro];
    let todosAlunos = { [aluno.id]: aluno };
    if(outrosIds.length){
      await supabase.from('ocorrencias_estudantes').update({ grupo_ocorrencia_id: registro.id }).eq('id', registro.id);
      const registrosExtras = outrosIds.map(id => {
        const alunoExtra = ESTADO.alunos.find(a => a.id === id);
        return { ...dados, aluno_id: id, turma_id: alunoExtra?.turma_id || null, grupo_ocorrencia_id: registro.id };
      });
      const { data: inseridos, error: erroExtras } = await supabase.from('ocorrencias_estudantes').insert(registrosExtras).select();
      if(erroExtras){
        msg.innerHTML = `<div class="msg-erro">A ocorrência principal foi salva, mas houve um erro ao incluir os outros estudantes: ${esc(erroExtras.message)}</div>`;
      } else if(inseridos){
        inseridos.forEach(r => { r.registrado = { nome: ESTADO.perfil.nome }; });
        todosRegistros = todosRegistros.concat(inseridos);
        outrosIds.forEach(id => { const a = ESTADO.alunos.find(x => x.id === id); if(a) todosAlunos[id] = a; });
      }
    }

    modal.remove();
    if(todosRegistros.length > 1) imprimirFichasOcorrenciaGrupo(todosRegistros, todosAlunos);
    else imprimirFichaOcorrencia(registro, aluno);
    carregarOcorrencias(conteudo, elPai);
  });
}

async function excluirOcorrencia(registro, aluno, conteudo, elPai){
  if(!confirm(`Excluir a ocorrência de ${fmtData(registro.data)} de ${aluno.nome}? Esta ação não pode ser desfeita.`)) return;
  const { error } = await supabase.from('ocorrencias_estudantes').delete().eq('id', registro.id);
  if(error){ alert('Erro ao excluir: ' + error.message); return; }
  carregarOcorrencias(conteudo, elPai);
}

// Monta o HTML de UMA ficha (usado tanto sozinha quanto dentro de uma impressão em grupo).
// comQuebra=true força início de nova página antes desta ficha (usado a partir da 2ª ficha do grupo).
function montarBlocoFichaOcorrencia(r, aluno, comQuebra){
  const turma = ESTADO.turmas.find(t => t.id === (r.turma_id || aluno.turma_id));
  const itensQualificacao = [...QUALIFICACOES_OCORRENCIA, { texto: '__OUTRAS__' }].map(item => {
    if(item.texto === '__OUTRAS__'){
      const marcado = !!r.outras_texto;

function calcularIdade(dataNascISO){
  if(!dataNascISO) return '—';
  const hoje = new Date();
  const nasc = new Date(dataNascISO + 'T00:00:00');
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const aindaNaoFezAniversario = (hoje.getMonth() < nasc.getMonth()) ||
    (hoje.getMonth() === nasc.getMonth() && hoje.getDate() < nasc.getDate());
  if(aindaNaoFezAniversario) idade--;
  if(idade < 0) return '—';
  return `${idade} ano${idade === 1 ? '' : 's'}`;
}

function anotacaoSituacaoAluno(aluno){
  const feminino = aluno.sexo === 'F';
  if(aluno.situacao === 'transferido') return feminino ? ' (TRANSFERIDA)' : ' (TRANSFERIDO)';
  if(aluno.situacao === 'cancelado') return feminino ? ' (CANCELADA)' : ' (CANCELADO)';
  return '';
}

const DIAS_SEMANA_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

function inicioSemana(data){
  const d = new Date(data);
  const diaSemana = d.getDay();
  const diff = diaSemana === 0 ? -6 : 1 - diaSemana; // sempre volta pra segunda-feira
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function diasDaSemanaAgenda(offsetSemanas){
  const base = inicioSemana(new Date());
  base.setDate(base.getDate() + offsetSemanas*7);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    return d;
  });
}

  if(btnAtual) btnAtual.addEventListener('click', () => { ESTADO.agendaSemanaOffset = 0; renderizarAgenda(el); });
  document.getElementById('btn-novo-evento-agenda').addEventListener('click', () => {

  });

  const { data: eventos, error } = await supabase.from('agenda_eventos').select('*, perfis(nome)')
    .gte('data', inicioISO).lte('data', fimISO).order('data').order('criado_em');
  if(error){ listaDias.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }

  const porDia = {};
  (eventos||[]).forEach(ev => { (porDia[ev.data] = porDia[ev.data] || []).push(ev); });

const CATEGORIAS_AGENDA = {
  secretaria: { rotulo: 'Secretaria', pill: 'azul', cor: '#2F5C8A' },
  pedagogico: { rotulo: 'Pedagógico', pill: 'verde', cor: '#3F7D4F' },
  gestao:     { rotulo: 'Gestão', pill: 'laranja', cor: '#B5643F' },
};
// Monta um texto curto com manhã e/ou tarde e seus horários (quando informados), ex: "Manhã 8h–10h · Tarde 13h30"
function descreverHorarioAgenda(ev){
  const partes = [];
  if(ev.manha){
    const h = [ev.manha_inicio ? ev.manha_inicio.slice(0,5) : '', ev.manha_fim ? ev.manha_fim.slice(0,5) : ''].filter(Boolean).join('–');
    partes.push('Manhã' + (h ? ' ' + h : ''));
  }
  if(ev.tarde){
    const h = [ev.tarde_inicio ? ev.tarde_inicio.slice(0,5) : '', ev.tarde_fim ? ev.tarde_fim.slice(0,5) : ''].filter(Boolean).join('–');
    partes.push('Tarde' + (h ? ' ' + h : ''));
  }
  return partes.length ? partes.join(' · ') : '';
}

function categoriaAgendaInfo(categoria){
  return CATEGORIAS_AGENDA[categoria] || CATEGORIAS_AGENDA.secretaria;
}

function cartaoEventoAgenda(ev){
  const catInfo = categoriaAgendaInfo(ev.categoria);
  const corBorda = ev.realizada ? '#8FD19E' : (ev.alerta ? '#E4756B' : catInfo.cor);
  const iconeAnexo = ev.anexo_tipo === 'imagem' ? '🖼️' : (ev.anexo_tipo === 'pdf' ? '📄' : '');
  return `
    <div style="border-left:5px solid ${corBorda};padding:12px 14px;margin-bottom:10px;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);${ev.realizada?'opacity:.65;':''}">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;">
        <div style="flex:1;min-width:200px;">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
            <span class="pill ${catInfo.pill}">${catInfo.rotulo}</span>
            ${ev.alerta ? `<span class="pill vermelho">⚠️ Alerta</span>` : ''}
            ${ev.realizada ? `<span class="pill verde">✓ Realizada</span>` : ''}
            ${descreverHorarioAgenda(ev) ? `<span style="font-size:12px;color:var(--texto-suave);font-weight:600;">🕒 ${descreverHorarioAgenda(ev)}</span>` : ''}
          </div>
          <b style="font-size:14.5px;display:block;margin-top:6px;${ev.realizada?'text-decoration:line-through;':''}">${esc(ev.titulo)}</b>
          ${ev.descricao ? `<div style="font-size:12.5px;margin-top:4px;color:var(--texto-suave);white-space:pre-wrap;line-height:1.45;">${esc(ev.descricao)}</div>` : ''}
          ${ev.anexo_url ? `<div style="margin-top:6px;"><a href="${ev.anexo_url}" target="_blank" rel="noopener" style="font-size:12px;color:var(--terracota);text-decoration:none;font-weight:600;">${iconeAnexo} ${esc(ev.anexo_nome||'Anexo')}</a></div>` : ''}
          <div style="font-size:11px;color:var(--texto-suave);margin-top:6px;opacity:.8;">Registrado por ${esc(ev.perfis?.nome || '—')}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="botao secundario pequeno" data-realizada-evento="${ev.id}" data-valor="${!ev.realizada}" style="width:auto;padding:4px 10px;font-size:11px;border-radius:8px;">${ev.realizada ? '↺ Reabrir' : '✓ Realizada'}</button>

          <button class="botao secundario pequeno" data-editar-evento="${ev.id}" style="width:auto;padding:4px 10px;font-size:11px;border-radius:8px;">Editar</button>

        </div>
      </div>
    </div>`;
}

// ---------------------------------------------------------------
// Gerador de card para redes sociais (usa <canvas>, sem depender de bibliotecas externas)
// ---------------------------------------------------------------
function carregarImagemCard(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function caminhoArredondadoCard(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function desenharImagemCoverCard(ctx, img, x, y, w, h){
  const escala = Math.max(w / img.width, h / img.height);
  const iw = img.width * escala, ih = img.height * escala;
  ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
}

// Quebra o texto em linhas dentro da largura máxima; corta com "…" se passar do nº máximo de linhas.
// Retorna a posição Y logo abaixo da última linha desenhada.
function envolverTextoCard(ctx, texto, x, y, maxWidth, lineHeight, maxLinhas){
  if(!texto) return y;
  const palavras = texto.split(/\s+/);
  const linhas = [];
  let linhaAtual = '';
  palavras.forEach(palavra => {
    const teste = linhaAtual ? linhaAtual + ' ' + palavra : palavra;
    if(ctx.measureText(teste).width > maxWidth && linhaAtual){
      linhas.push(linhaAtual);
      linhaAtual = palavra;
    } else {
      linhaAtual = teste;
    }
  });
  if(linhaAtual) linhas.push(linhaAtual);

  let linhasFinais = linhas;
  if(maxLinhas && linhas.length > maxLinhas){
    linhasFinais = linhas.slice(0, maxLinhas);
    let ultima = linhasFinais[maxLinhas - 1];
    while(ctx.measureText(ultima + '…').width > maxWidth && ultima.length > 1){
      ultima = ultima.slice(0, -1);
    }
    linhasFinais[maxLinhas - 1] = ultima + '…';
  }
  linhasFinais.forEach((linha, i) => ctx.fillText(linha, x, y + i * lineHeight));
  return y + linhasFinais.length * lineHeight;
}

async function desenharCardAgenda(canvas, dados){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const catInfo = categoriaAgendaInfo(dados.categoria);
  const NAVY = '#0F1E3D', NAVY_CLARO = '#182A52', DOURADO = '#D9B65C', BRANCO = '#FFFFFF', CINZA_CLARO = '#B9C4DC';
  const corDestaque = dados.alerta ? '#E4756B' : DOURADO;
  const margemX = 64, larguraConteudo = W - margemX*2;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, W, H);

  // moldura dourada fina
  ctx.strokeStyle = DOURADO;
  ctx.lineWidth = 2;
  ctx.strokeRect(20, 20, W - 40, H - 40);

  // cabeçalho: logo + nome da escola
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  try{
    const logo = await carregarImagemCard(LOGO_ESCOLA_URL);
    ctx.save();
    ctx.beginPath();
    ctx.arc(96, 96, 46, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.clip();
    ctx.drawImage(logo, 50, 50, 92, 92);
    ctx.restore();
  } catch(e){ /* segue sem a logo se não conseguir carregar */ }
  ctx.fillStyle = BRANCO;
  ctx.font = 'bold 26px Arial';
  ctx.fillText('ESCOLA MUNICIPAL', 168, 78);
  ctx.fillText('JAIME GONÇALVES BOLD', 168, 112);
  ctx.fillStyle = CINZA_CLARO;
  ctx.font = '20px Arial';
  ctx.fillText('Secretaria de Educação de Paulista', 168, 142);

  // imagem principal (ou espaço reservado, com moldura dourada)
  const imgX = margemX, imgY = 195, imgW = larguraConteudo, imgH = 440;
  ctx.strokeStyle = DOURADO;
  ctx.lineWidth = 2;
  if(dados.imagem){
    ctx.save();
    caminhoArredondadoCard(ctx, imgX, imgY, imgW, imgH, 20);
    ctx.clip();
    desenharImagemCoverCard(ctx, dados.imagem, imgX, imgY, imgW, imgH);
    ctx.restore();
    caminhoArredondadoCard(ctx, imgX, imgY, imgW, imgH, 20);
    ctx.stroke();
  } else {
    ctx.fillStyle = NAVY_CLARO;
    caminhoArredondadoCard(ctx, imgX, imgY, imgW, imgH, 20);
    ctx.fill();
    ctx.stroke();
    ctx.font = '140px Arial';
    ctx.fillStyle = DOURADO;
    ctx.textAlign = 'center';
    ctx.fillText(dados.alerta ? '⚠️' : '📢', imgX + imgW/2, imgY + imgH/2 + 48);
    ctx.textAlign = 'left';
  }

  // selo de categoria (+ alerta, se marcado)
  const badgeTexto = (dados.alerta ? '⚠ ALERTA · ' : '') + catInfo.rotulo.toUpperCase();
  ctx.font = 'bold 25px Arial';
  const badgeLargura = ctx.measureText(badgeTexto).width + 50;
  const badgeY = imgY + imgH + 26;
  ctx.strokeStyle = corDestaque;
  ctx.lineWidth = 2;
  caminhoArredondadoCard(ctx, imgX, badgeY, badgeLargura, 50, 25);
  ctx.stroke();
  ctx.fillStyle = corDestaque;
  ctx.textBaseline = 'middle';
  ctx.fillText(badgeTexto, imgX + 25, badgeY + 26);
  ctx.textBaseline = 'alphabetic';

  // título e descrição
  let y = badgeY + 96;
  ctx.fillStyle = DOURADO;
  ctx.font = 'bold 50px Arial';
  y = envolverTextoCard(ctx, dados.titulo, imgX, y, imgW, 58, 3);

  if(dados.descricao){
    ctx.font = '28px Arial';
    ctx.fillStyle = CINZA_CLARO;
    envolverTextoCard(ctx, dados.descricao, imgX, y + 16, imgW, 38, 4);
  }

  // data (e horário, se houver), fixados perto do rodapé
  ctx.font = 'bold 29px Arial';
  ctx.fillStyle = BRANCO;
  const textoData = '📅 ' + (dados.dataTexto || '') + (dados.horaTexto ? '   🕒 ' + dados.horaTexto : '');
  ctx.fillText(textoData, imgX, H - 110);

  ctx.strokeStyle = 'rgba(217,182,92,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(imgX, H - 60); ctx.lineTo(imgX + imgW, H - 60); ctx.stroke();
  ctx.font = 'italic 20px Georgia, serif';
  ctx.fillStyle = DOURADO;
  ctx.textAlign = 'center';
  ctx.fillText('Escola Municipal Jaime Gonçalves Bold — Paulista/PE', W/2, H - 25);
  ctx.textAlign = 'left';
}

function infoDataAgendaCard(iso){
  const [ano, mes, dia] = iso.split('-').map(Number);
  const d = new Date(ano, mes - 1, dia);
  return {
    diaSemana: DIAS_SEMANA_PT[d.getDay()].split('-')[0].toUpperCase(),
    diaNumero: String(dia).padStart(2, '0'),
    mesAbrev: MESES_PT[mes - 1].slice(0, 3).toUpperCase(),
  };
}

async function desenharCardSemanaAgenda(canvas, dados){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const NAVY = '#0F1830', NAVY_CLARO = '#1B2E52', NAVY_BLOCO = '#172644', DOURADO = '#D9B65C', DOURADO_SUAVE = 'rgba(217,182,92,0.14)', BRANCO = '#FFFFFF', CINZA_CLARO = '#B9C4DC';
  const margemX = 68, larguraConteudo = W - margemX*2;

  ctx.clearRect(0, 0, W, H);

  // fundo em gradiente suave (dá profundidade sem poluir)
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, NAVY_CLARO);
  grad.addColorStop(1, NAVY);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // único elemento decorativo: círculo grande e discreto no canto superior direito
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  ctx.beginPath();
  ctx.arc(W + 40, 60, 340, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(217,182,92,0.05)';
  ctx.fill();
  ctx.restore();

  // moldura dourada fina
  ctx.strokeStyle = 'rgba(217,182,92,0.55)';
  ctx.lineWidth = 2;
  ctx.strokeRect(20, 20, W - 40, H - 40);

  // cabeçalho: logo + título em duas cores
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  try{
    const logo = await carregarImagemCard(LOGO_ESCOLA_URL);
    ctx.save();
    ctx.beginPath();
    ctx.arc(96, 96, 46, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.clip();
    ctx.drawImage(logo, 50, 50, 92, 92);
    ctx.restore();
  } catch(e){ /* segue sem a logo se não conseguir carregar */ }

  ctx.fillStyle = CINZA_CLARO;
  ctx.font = 'bold 22px Arial';
  ctx.fillText('C O N F I R A', 168, 78);
  ctx.fillStyle = DOURADO;
  ctx.font = 'bold 56px Arial';
  const yTitulo = envolverTextoCard(ctx, (dados.titulo || 'A SEMANA').toUpperCase(), 168, 138, W - 168 - margemX, 58, 2);
  ctx.fillStyle = CINZA_CLARO;
  ctx.font = '20px Arial';
  ctx.fillText('ESCOLA MUNICIPAL JAIME GONÇALVES BOLD', 168, yTitulo + 4);

  // selo com o período da semana — chip preenchido, mais moderno que só contorno
  ctx.font = 'bold 24px Arial';
  const textoPeriodo = dados.rotuloIntervalo.toUpperCase();
  const larguraPeriodo = ctx.measureText(textoPeriodo).width + 76;
  const pillY = Math.max(yTitulo + 34, 218);
  const pillX = W/2 - larguraPeriodo/2;
  ctx.fillStyle = DOURADO_SUAVE;
  caminhoArredondadoCard(ctx, pillX, pillY, larguraPeriodo, 56, 28);
  ctx.fill();
  ctx.strokeStyle = DOURADO;
  ctx.lineWidth = 1.5;
  caminhoArredondadoCard(ctx, pillX, pillY, larguraPeriodo, 56, 28);
  ctx.stroke();
  ctx.fillStyle = DOURADO;
  ctx.textAlign = 'center';
  ctx.fillText('🗓  ' + textoPeriodo, W/2, pillY + 37);
  ctx.textAlign = 'left';

  // agrupa os avisos por dia, na ordem em que já vêm (a query já traz ordenado por data)
  const dias = [];
  dados.eventos.forEach(item => {
    let grupo = dias.find(g => g.iso === item.iso);
    if(!grupo){ grupo = { iso: item.iso, itens: [] }; dias.push(grupo); }
    grupo.itens.push(item);
  });

  let y = pillY + 90;
  const alturaMaxima = H - 96;
  const colunaBadgeW = 108, colunaConteudoX = margemX + colunaBadgeW + 30, colunaConteudoW = larguraConteudo - colunaBadgeW - 30;

  if(!dias.length){
    ctx.font = '30px Arial';
    ctx.fillStyle = CINZA_CLARO;
    ctx.textAlign = 'center';
    ctx.fillText('Nenhum aviso cadastrado para esta semana.', W/2, y + 80);
    ctx.textAlign = 'left';
  }

  for(const dia of dias){
    if(y > alturaMaxima) break; // não cabe mais nada nesta folha
    const dataInfo = infoDataAgendaCard(dia.iso);
    const inicioDiaY = y;
    let yConteudo = inicioDiaY + 30;

    dia.itens.forEach((item, indice) => {
      const corDestaque = item.alerta ? '#E4756B' : DOURADO;
      // hora/alerta
      if(item.horaCurta || item.alerta){
        ctx.font = 'bold 18px Arial';
        ctx.fillStyle = corDestaque;
        const cabecalho = [item.alerta ? '⚠ ALERTA' : null, item.horaCurta || null].filter(Boolean).join('   ·   ');
        ctx.fillText(cabecalho, colunaConteudoX, yConteudo);
        yConteudo += 26;
      }
      // título
      ctx.font = 'bold 27px Arial';
      ctx.fillStyle = BRANCO;
      yConteudo = envolverTextoCard(ctx, item.titulo, colunaConteudoX, yConteudo + 6, colunaConteudoW, 32, 2);
      // descrição curta, se houver
      if(item.descricao){
        ctx.font = '19px Arial';
        ctx.fillStyle = CINZA_CLARO;
        yConteudo = envolverTextoCard(ctx, item.descricao, colunaConteudoX, yConteudo + 2, colunaConteudoW, 25, 1);
      }
      if(indice < dia.itens.length - 1){
        yConteudo += 10;
        ctx.strokeStyle = 'rgba(185,196,220,0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(colunaConteudoX, yConteudo); ctx.lineTo(colunaConteudoX + colunaConteudoW, yConteudo); ctx.stroke();
        yConteudo += 14;
      } else {
        yConteudo += 8;
      }
    });

    const alturaDia = Math.max(yConteudo - inicioDiaY + 4, 108);

    // fundo do bloco do dia, com sombra suave (aparência de cartão elevado)
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 6;
    ctx.fillStyle = NAVY_BLOCO;
    caminhoArredondadoCard(ctx, margemX, inicioDiaY, larguraConteudo, alturaDia, 18);
    ctx.fill();
    ctx.restore();

    // divisória vertical dourada entre o selo do dia e o conteúdo
    ctx.strokeStyle = 'rgba(217,182,92,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(margemX + colunaBadgeW, inicioDiaY + 18);
    ctx.lineTo(margemX + colunaBadgeW, inicioDiaY + alturaDia - 18);
    ctx.stroke();

    // selo do dia (número grande + dia da semana + mês), centralizado na coluna própria
    ctx.textAlign = 'center';
    ctx.fillStyle = DOURADO;
    ctx.font = 'bold 16px Arial';
    ctx.fillText(dataInfo.diaSemana, margemX + colunaBadgeW/2, inicioDiaY + 34);
    ctx.fillStyle = BRANCO;
    ctx.font = 'bold 44px Arial';
    ctx.fillText(dataInfo.diaNumero, margemX + colunaBadgeW/2, inicioDiaY + alturaDia/2 + 16);
    ctx.fillStyle = DOURADO;
    ctx.font = 'bold 16px Arial';
    ctx.fillText(dataInfo.mesAbrev, margemX + colunaBadgeW/2, inicioDiaY + alturaDia - 18);
    ctx.textAlign = 'left';

    y = inicioDiaY + alturaDia + 22;
  }

  ctx.strokeStyle = 'rgba(217,182,92,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W/2 - 60, H - 66); ctx.lineTo(W/2 + 60, H - 66); ctx.stroke();
  ctx.font = 'italic 19px Georgia, serif';
  ctx.fillStyle = DOURADO;
  ctx.textAlign = 'center';
  ctx.fillText('Escola Municipal Jaime Gonçalves Bold — Paulista/PE', W/2, H - 38);
  ctx.textAlign = 'left';
}

async function gerarDesignCardSemanaIA(dados, variacao){

}

        <p style="font-size:12px;color:var(--texto-suave);margin:0;">Mostrando os ${itens.length} aviso(s) cadastrados para ${esc(rotuloIntervalo)}.${itens.length > 10 ? ' Só cabem os primeiros no card — considere gerar cards por dia se tiver muitos avisos.' : ''}</p>
        <div id="msg-card-semana" style="width:100%;"></div>
        <div style="display:flex;gap:8px;width:100%;">
          <button class="botao secundario" id="btn-refazer-card-semana" style="flex:1;">✨ Tentar design com IA</button>
          <button class="botao secundario" id="btn-classico-card-semana" style="flex:1;">🔄 Atualizar (padrão)</button>
        </div>
        <button class="botao terracota" id="btn-baixar-card-semana" style="width:100%;">⬇️ Baixar imagem (PNG)</button>
        <button class="botao secundario" id="btn-baixar-dados-card-semana" style="width:100%;">📄 Baixar dados do card (para usar em outra IA)</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  const canvas = document.getElementById('card-semana-canvas');
  const carregando = document.getElementById('card-semana-carregando');
  const msgSemana = document.getElementById('msg-card-semana');
  let tentativasIA = 0;

  async function atualizarPreviewSemana(usarIA, variacao){
    const dadosCard = {
      titulo: document.getElementById('card-semana-titulo').value.trim() || 'A SEMANA',
      rotuloIntervalo,
      eventos: itens,
      variacao,
    };
    msgSemana.innerHTML = '';
    if(usarIA){
      carregando.textContent = '✨ Gerando design com IA…';
      carregando.style.display = 'flex';
      try{
        await desenharCardSemanaAgendaIA(canvas, dadosCard);
        tentativasIA++;
        document.getElementById('btn-refazer-card-semana').textContent = '🔄 Tentar outra versão com IA';
      } catch(err){
        msgSemana.innerHTML = `<div class="msg-erro">${esc(err.message)} Mostrando o design padrão como alternativa.</div>`;
        await desenharCardSemanaAgenda(canvas, dadosCard);
      } finally {
        carregando.style.display = 'none';
      }
    } else {
      carregando.style.display = 'none';
      await desenharCardSemanaAgenda(canvas, dadosCard);
    }
  }

  document.getElementById('card-semana-titulo').addEventListener('change', () => atualizarPreviewSemana(false, false));
  document.getElementById('btn-refazer-card-semana').addEventListener('click', () => atualizarPreviewSemana(true, tentativasIA > 0));
  document.getElementById('btn-classico-card-semana').addEventListener('click', () => atualizarPreviewSemana(false, false));
  document.getElementById('btn-baixar-card-semana').addEventListener('click', () => {
    try{
      const link = document.createElement('a');
      link.download = `avisos-semana-${dataObjParaISO(dias[0])}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch(err){
      msgSemana.innerHTML = `<div class="msg-erro">Não foi possível baixar a imagem (${esc(err.message)}).</div>`;
    }
  });

  document.getElementById('btn-baixar-dados-card-semana').addEventListener('click', () => {
    const titulo = document.getElementById('card-semana-titulo').value.trim() || 'A SEMANA';
    const texto = montarTextoDadosCardSemana(titulo, rotuloIntervalo, itens);
    const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.download = `dados-card-semana-${dataObjParaISO(dias[0])}.txt`;
    link.href = URL.createObjectURL(blob);
    link.click();
    URL.revokeObjectURL(link.href);
  });

  atualizarPreviewSemana(false, false);
}

// Monta um arquivo de texto com todos os dados da semana e um briefing de design pronto pra colar
// em outra ferramenta de IA (ChatGPT, Gemini, Canva Magic Design, Gamma etc.) e gerar a imagem lá.
function montarTextoDadosCardSemana(titulo, rotuloIntervalo, itens){
  const dias = [];
  itens.forEach(item => {
    let grupo = dias.find(g => g.iso === item.iso);
    if(!grupo){ grupo = { iso: item.iso, itens: [] }; dias.push(grupo); }
    grupo.itens.push(item);
  });

  const listaTexto = dias.length
    ? dias.map(d => {
        const linhas = d.itens.map(it => {
          const partes = [it.horaCurta || null, it.alerta ? 'ALERTA' : null].filter(Boolean).join(' · ');
          return `  - ${it.titulo}${partes ? ` (${partes})` : ''}${it.descricao ? ` — ${it.descricao}` : ''} [categoria: ${it.categoria || 'geral'}]`;
        }).join('\n');
        return `${formatarDataBR(d.iso)}:\n${linhas}`;
      }).join('\n\n')
    : '(nenhum aviso cadastrado para esta semana)';

  return `DADOS DO CARD SEMANAL — ESCOLA MUNICIPAL JAIME GONÇALVES BOLD (Paulista/PE)
Use estas informações para gerar, em outra ferramenta de IA, uma imagem/pôster no formato retrato 1080x1350px (proporção 4:5, ideal para Instagram).

Título do card: ${titulo}
Período da semana: ${rotuloIntervalo}
Nome da escola (incluir no rodapé): Escola Municipal Jaime Gonçalves Bold — Paulista/PE

AVISOS DA SEMANA:
${listaTexto}

SUGESTÃO DE ESTILO VISUAL:
- Design moderno, elegante e organizado, com boa hierarquia visual e bastante espaço em branco (evite poluição visual).
- Paleta de cores: azul-marinho profundo (#0F1E3D e #182A52) como fundo, dourado (#D9B65C) como cor de destaque, branco (#FFFFFF) para textos principais e cinza-azulado claro (#B9C4DC) para textos secundários. Use vermelho suave (#E4756B) apenas para marcar avisos de alerta.
- Um bloco por dia da semana, com a data em destaque e os avisos daquele dia organizados abaixo, de forma consistente entre os dias.
- Reserve um espaço para a logomarca da escola no topo (pode ser adicionada depois por fora da imagem).
- Rodapé com o nome da escola.`;
}

function renderizarPreviaExtracaoAgenda(areaExtracao, eventosExtraidos, formEl, elPai, arquivoOrigem){
  const linhas = eventosExtraidos.map((ev, i) => `
    <div class="painel" style="margin-bottom:8px;">
      <div style="padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;">
          <input type="checkbox" class="prev-incluir" data-indice="${i}" checked style="width:auto;" /> Incluir
        </label>
        <input type="date" class="prev-data" data-indice="${i}" value="${ev.data||''}" style="width:auto;padding:4px 6px;font-size:12px;" />
        <input type="time" class="prev-hora" data-indice="${i}" value="${ev.hora||''}" style="width:auto;padding:4px 6px;font-size:12px;" />
        <select class="prev-categoria" data-indice="${i}" style="width:auto;padding:4px 6px;font-size:12px;">
          <option value="secretaria" ${!ev.categoria||ev.categoria==='secretaria'?'selected':''}>Secretaria</option>
          <option value="pedagogico" ${ev.categoria==='pedagogico'?'selected':''}>Pedagógico</option>
          <option value="gestao" ${ev.categoria==='gestao'?'selected':''}>Gestão</option>
        </select>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;">
          <input type="checkbox" class="prev-alerta" data-indice="${i}" ${ev.alerta?'checked':''} style="width:auto;" /> ⚠️ Alerta
        </label>
        <input type="text" class="prev-titulo" data-indice="${i}" value="${esc(ev.titulo||'')}" placeholder="Título" style="flex:1;min-width:160px;padding:4px 6px;font-size:12px;" />
      </div>
      ${ev.descricao ? `<div style="padding:0 10px 8px;"><textarea class="prev-descricao" data-indice="${i}" rows="2" style="width:100%;font-size:12px;">${esc(ev.descricao)}</textarea></div>` : `<div style="padding:0 10px 8px;"><textarea class="prev-descricao" data-indice="${i}" rows="2" placeholder="Descrição (opcional)" style="width:100%;font-size:12px;"></textarea></div>`}
    </div>`).join('');

  areaExtracao.innerHTML = `
    <div style="margin-top:10px;border-top:1px solid var(--borda);padding-top:10px;">
      <p style="font-size:12.5px;font-weight:700;margin:0 0 8px;">Encontrei ${eventosExtraidos.length} aviso(s) nesse documento — confira e ajuste antes de adicionar:</p>
      ${linhas}
      <div id="msg-previa-agenda" style="margin:8px 0;"></div>
      <button class="botao terracota pequeno" id="btn-confirmar-previa-agenda" style="width:auto;">Adicionar avisos selecionados à agenda</button>
    </div>`;

  document.getElementById('btn-confirmar-previa-agenda').addEventListener('click', async () => {
    const msg = document.getElementById('msg-previa-agenda');
    const btn = document.getElementById('btn-confirmar-previa-agenda');
    const linhasIncluidas = Array.from(document.querySelectorAll('.prev-incluir')).filter(c => c.checked).map(c => c.dataset.indice);
    if(!linhasIncluidas.length){ msg.innerHTML = `<div class="msg-erro">Selecione ao menos um aviso.</div>`; return; }
    btn.disabled = true; btn.textContent = 'Adicionando…';

    // sobe o arquivo original uma única vez, e todos os avisos criados a partir dele compartilham esse anexo
    let anexoUrl = null, anexoNome = null, anexoTipo = null;
    if(arquivoOrigem){
      const extensao = arquivoOrigem.name.split('.').pop();
      const caminho = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${extensao}`;
      const { error: erroUpload } = await supabase.storage.from('agenda-anexos').upload(caminho, arquivoOrigem, { upsert: true });
      if(!erroUpload){
        const { data: urlAssinada } = await supabase.storage.from('agenda-anexos').createSignedUrl(caminho, EXPIRACAO_LINK_STORAGE);
        anexoUrl = urlAssinada?.signedUrl || null;
        anexoNome = arquivoOrigem.name;
        anexoTipo = arquivoOrigem.type.startsWith('image/') ? 'imagem' : 'pdf';
      }
    }

    const registros = linhasIncluidas.map(i => {
      const horaValor = document.querySelector(`.prev-hora[data-indice="${i}"]`).value || null;
      return {
        data: document.querySelector(`.prev-data[data-indice="${i}"]`).value,
        manha: !!horaValor,
        manha_inicio: horaValor,
        titulo: document.querySelector(`.prev-titulo[data-indice="${i}"]`).value.trim() || 'Aviso',
        descricao: document.querySelector(`.prev-descricao[data-indice="${i}"]`).value.trim() || null,
        categoria: document.querySelector(`.prev-categoria[data-indice="${i}"]`).value,
        alerta: document.querySelector(`.prev-alerta[data-indice="${i}"]`).checked,
        anexo_url: anexoUrl,
        anexo_nome: anexoNome,
        anexo_tipo: anexoTipo,
        criado_por: ESTADO.perfil.id,
      };
    }).filter(r => r.data);

    if(!registros.length){ msg.innerHTML = `<div class="msg-erro">Nenhum dos avisos selecionados tem uma data válida.</div>`; btn.disabled = false; btn.textContent = 'Adicionar avisos selecionados à agenda'; return; }

    const { error: erroInsercao } = await supabase.from('agenda_eventos').insert(registros);
    if(erroInsercao){ msg.innerHTML = `<div class="msg-erro">${esc(erroInsercao.message)}</div>`; btn.disabled = false; btn.textContent = 'Adicionar avisos selecionados à agenda'; return; }

    formEl.innerHTML = '';
    renderizarAgenda(elPai);
  });
}

      });
