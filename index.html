  if(podeEditar){
  document.getElementById('btn-salvar-dias-letivos').addEventListener('click', async () => {
    const btn = document.getElementById('btn-salvar-dias-letivos');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const linhas = Array.from(el.querySelectorAll('.dl-mes')).map(inp => ({
      ano_letivo: ano,
      mes: parseInt(inp.dataset.mes, 10),
      quantidade_dias: parseInt(inp.value, 10) || 0,
    }));
    const { error } = await supabase.from('dias_letivos').upsert(linhas, { onConflict: 'ano_letivo,mes' });
    const msg = document.getElementById('msg-dias-letivos');
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; }
    else{ msg.innerHTML = `<div class="msg-ok">Dias letivos salvos.</div>`; }
    btn.disabled = false; btn.textContent = 'Salvar dias letivos';
  });
  document.getElementById('btn-add-feriado').addEventListener('click', async () => {
    const msg = document.getElementById('msg-feriados');
    const dataInicio = document.getElementById('fer-data').value;
    const dataFim = document.getElementById('fer-data-fim').value;
    if(!dataInicio){ msg.innerHTML = `<div class="msg-erro">Informe a data.</div>`; return; }
    if(dataFim && dataFim < dataInicio){ msg.innerHTML = `<div class="msg-erro">A data fim deve ser igual ou posterior à data início.</div>`; return; }
    const tipo = document.getElementById('fer-tipo').value;
    const turnoAfetado = tipo === 'suspensao_aulas' ? (document.getElementById('fer-turno').value || null) : null;
    const descricao = document.getElementById('fer-descricao').value.trim() || null;
    const btn = document.getElementById('btn-add-feriado');
    btn.disabled = true; btn.textContent = 'Adicionando…';
    const registros = [];
    let cursor = new Date(dataInicio + 'T00:00:00');
    const fim = new Date((dataFim || dataInicio) + 'T00:00:00');
    while(cursor <= fim){
      registros.push({ data: dataObjParaISO(cursor), tipo, descricao, turno_afetado: turnoAfetado });
      cursor.setDate(cursor.getDate() + 1);
    }
    const { error } = await supabase.from('feriados').upsert(registros, { onConflict: 'data' });
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Adicionar'; return; }
    renderizarDiasLetivos(el);
  });
  }
  el.querySelectorAll('[data-remover-feriado]').forEach(b => b.addEventListener('click', async () => {
    await supabase.from('feriados').delete().eq('id', b.dataset.removerFeriado);
    renderizarDiasLetivos(el);
  }));
  el.querySelectorAll('[data-editar-feriado]').forEach(b => b.addEventListener('click', () => {
    const feriado = feriadosDoAno.find(f => f.id === b.dataset.editarFeriado);
    if(feriado) abrirModalEditarFeriado(feriado, el);
  }));

  if(podeEditar){
    criarSeletorData('conv-data-container', '', null, { inputId:'conv-data', permiteLimpar:false, rotuloVazio:'Selecione a data' });
    document.getElementById('btn-add-convocacao').addEventListener('click', async () => {
      const msg = document.getElementById('msg-convocacoes');
      const dataConv = document.getElementById('conv-data').value;
      const descricao = document.getElementById('conv-descricao').value.trim() || null;
      const funcoesMarcadas = Array.from(el.querySelectorAll('.chk-funcao-convocada:checked')).map(c => c.value);
      if(!dataConv){ msg.innerHTML = `<div class="msg-erro">Informe a data.</div>`; return; }
      if(!funcoesMarcadas.length){ msg.innerHTML = `<div class="msg-erro">Selecione ao menos uma função convocada.</div>`; return; }
      const btn = document.getElementById('btn-add-convocacao');
      btn.disabled = true; btn.textContent = 'Adicionando…';
      const { error } = await supabase.from('convocacoes_dia_nao_letivo').insert({
        data: dataConv, funcoes: funcoesMarcadas, descricao, criado_por: ESTADO.perfil.id,
      });
      if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = '+ Adicionar convocação'; return; }
      renderizarDiasLetivos(el);
    });
  }
  el.querySelectorAll('[data-remover-convocacao]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Remover esta convocação?')) return;
    await supabase.from('convocacoes_dia_nao_letivo').delete().eq('id', b.dataset.removerConvocacao);
    renderizarDiasLetivos(el);
  }));
}

function abrirModalEditarFeriado(feriado, elPai){
  const modal = document.createElement('div');
  modal.className = 'fundo-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:440px;">
      <div class="modal-topo"><h3>Editar dia</h3><button data-fechar>✕</button></div>
      <div id="msg-editar-feriado"></div>
      <div class="campo"><label>Data</label><div id="edfer-data-container" class="seletor-data-wrap"></div></div>
      <div class="campo"><label>Tipo</label>
        <select id="edfer-tipo">
          <option value="feriado" ${feriado.tipo==='feriado'?'selected':''}>Feriado</option>
          <option value="ponto_facultativo" ${feriado.tipo==='ponto_facultativo'?'selected':''}>Ponto Facultativo</option>
          <option value="recesso" ${feriado.tipo==='recesso'?'selected':''}>Recesso Escolar</option>
          <option value="suspensao_aulas" ${feriado.tipo==='suspensao_aulas'?'selected':''}>Suspensão de Aulas</option>
        </select>
      </div>
      <div class="campo" id="campo-edfer-turno" style="display:${feriado.tipo==='suspensao_aulas'?'':'none'};">
        <label>Turno afetado</label>
        <select id="edfer-turno">
          <option value="" ${!feriado.turno_afetado?'selected':''}>Dia todo</option>
          <option value="manha" ${feriado.turno_afetado==='manha'?'selected':''}>Manhã</option>
          <option value="tarde" ${feriado.turno_afetado==='tarde'?'selected':''}>Tarde</option>
        </select>
      </div>
      <div class="campo" style="margin-bottom:0;"><label>Descrição</label><input type="text" id="edfer-descricao" value="${esc(feriado.descricao||'')}" /></div>
      <button class="botao terracota pequeno" id="btn-salvar-editar-feriado" style="width:auto;margin-top:14px;">Salvar alterações</button>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', () => modal.remove()));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.remove(); });

  criarSeletorData('edfer-data-container', feriado.data, null, { inputId:'edfer-data', permiteLimpar:false, rotuloVazio:'Selecione a data' });
  document.getElementById('edfer-tipo').addEventListener('change', (e) => {
    document.getElementById('campo-edfer-turno').style.display = e.target.value === 'suspensao_aulas' ? '' : 'none';
  });

  document.getElementById('btn-salvar-editar-feriado').addEventListener('click', async () => {
    const msg = document.getElementById('msg-editar-feriado');
    const novaData = document.getElementById('edfer-data').value;
    const novoTipo = document.getElementById('edfer-tipo').value;
    const novoTurno = novoTipo === 'suspensao_aulas' ? (document.getElementById('edfer-turno').value || null) : null;
    const novaDescricao = document.getElementById('edfer-descricao').value.trim() || null;
    if(!novaData){ msg.innerHTML = `<div class="msg-erro">Informe a data.</div>`; return; }
    const btn = document.getElementById('btn-salvar-editar-feriado');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const { error } = await supabase.from('feriados').update({
      data: novaData, tipo: novoTipo, turno_afetado: novoTurno, descricao: novaDescricao,
    }).eq('id', feriado.id);
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Salvar alterações'; return; }
    modal.remove();
    renderizarDiasLetivos(elPai);
  });
}

function renderizarListaConvocacoes(podeEditar){
  const lista = (ESTADO.convocacoes||[]).slice().sort((a,b) => a.data.localeCompare(b.data));
  if(!lista.length) return `<p style="color:var(--texto-suave);font-size:13.5px;">Nenhuma convocação cadastrada.</p>`;
  return `<table><thead><tr><th>Data</th><th>Funções convocadas</th><th>Descrição</th>${podeEditar?'<th></th>':''}</tr></thead><tbody>
    ${lista.map(c => `
      <tr>
        <td>${formatarDataBR(c.data)}</td>
        <td>${(c.funcoes||[]).map(f => `<span class="pill azul" style="margin:2px;">${esc(f)}</span>`).join('')}</td>
        <td>${esc(c.descricao || '—')}</td>
        ${podeEditar ? `<td><button class="botao secundario pequeno" data-remover-convocacao="${c.id}" style="width:auto;padding:4px 10px;">Remover</button></td>` : ''}
      </tr>`).join('')}
  </tbody></table>`;
}

// Um estudante deixa de ter frequência a PARTIR da data de transferência/cancelamento (inclusive).
// Datas anteriores a essa continuam normalmente, preservando o histórico já registrado.
function alunoTemFrequenciaNaData(aluno, dataIso){
  if(aluno.situacao === 'transferido' || aluno.situacao === 'cancelado'){
    if(!aluno.data_situacao) return false; // sem data registrada: mantém oculto por segurança
    return dataIso < aluno.data_situacao;
  }
  return true;
}

async function renderizarChamada(el){
  const podeRegistrar = ESTADO.perfil.role === 'admin' || ESTADO.perfil.role === 'coordenacao';
  const opcoesTurma = ESTADO.turmas.map(t => `<option value="${t.id}" ${ESTADO.chamadaTurma===t.id?'selected':''}>${esc(t.nome)} · ${esc(t.turno)}</option>`).join('');

  // Sincroniza o "Tipo do dia" com o que já está salvo no banco (refaz sempre que a turma OU a
  // data mudar — nunca deixa uma seleção "Outros"/descrição de uma turma ou data anterior grudada).
  const chaveSincronizacaoChamada = `${ESTADO.chamadaTurma}|${ESTADO.chamadaData}`;
  if(ESTADO.chamadaDataSincronizada !== chaveSincronizacaoChamada){
    const statusEmMassaSet = ['feriado','ponto_facultativo','suspensao_aulas','outros'];
    let registroExistente = null;
    if(ESTADO.chamadaTurma){
      const resp = await supabase.from('frequencia').select('status, texto_outros')
        .eq('data', ESTADO.chamadaData).eq('turma_id', ESTADO.chamadaTurma).limit(1).maybeSingle();
      registroExistente = resp.data;
    }
    if(registroExistente && statusEmMassaSet.includes(registroExistente.status)){
      ESTADO.chamadaTipoDia = registroExistente.status;
      ESTADO.chamadaTextoOutros = registroExistente.texto_outros || '';
    } else {
      ESTADO.chamadaTipoDia = 'normal';
      ESTADO.chamadaTextoOutros = '';
    }
    ESTADO.chamadaDataSincronizada = chaveSincronizacaoChamada;
  }

  const { data: feriadosData } = await supabase.from('feriados').select('*').eq('data', ESTADO.chamadaData).maybeSingle();
  const diaSemana = new Date(ESTADO.chamadaData + 'T00:00:00').getDay();
  const ehFimDeSemana = diaSemana === 0 || diaSemana === 6;
  const turmaSelecionada = ESTADO.turmas.find(t => t.id === ESTADO.chamadaTurma);
  const suspensaoAfetaTurma = !feriadosData || feriadosData.tipo !== 'suspensao_aulas' || !turmaSelecionada
    || turnoAfetaSuspensao(turmaSelecionada.turno, feriadosData.turno_afetado);
  const diaNaoLetivo = ehFimDeSemana || (!!feriadosData && suspensaoAfetaTurma);
  let motivoNaoLetivo = '';
  if(ehFimDeSemana) motivoNaoLetivo = diaSemana === 0 ? 'domingo' : 'sábado';
  else if(feriadosData) motivoNaoLetivo = rotuloTipoFeriado(feriadosData) + (feriadosData.descricao ? ` — ${esc(feriadosData.descricao)}` : '');

  el.innerHTML = `
    <div class="painel">
      <div class="barra" style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:10px 14px;">
        <div class="campo" style="margin:0;min-width:220px;"><label>Turma</label><select id="ch-turma"><option value="">Selecione a turma</option>${opcoesTurma}</select></div>
        <div class="campo" style="margin:0;min-width:150px;"><label>Data</label><div id="ch-data" class="seletor-data-wrap"></div></div>
      </div>
      <div style="padding:10px 14px;">
        <div class="campo" style="margin-bottom:8px;">
          <label>Tipo do dia</label>
          <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:4px;font-size:13.5px;">
            <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="ch-tipo-dia" value="normal" ${ESTADO.chamadaTipoDia==='normal'?'checked':''} style="width:auto;" />Dia letivo normal</label>
            <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="ch-tipo-dia" value="feriado" ${ESTADO.chamadaTipoDia==='feriado'?'checked':''} style="width:auto;" />Feriado</label>
            <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="ch-tipo-dia" value="ponto_facultativo" ${ESTADO.chamadaTipoDia==='ponto_facultativo'?'checked':''} style="width:auto;" />Ponto Facultativo</label>
            <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="ch-tipo-dia" value="suspensao_aulas" ${ESTADO.chamadaTipoDia==='suspensao_aulas'?'checked':''} style="width:auto;" />Suspensão de Aulas</label>
            <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="ch-tipo-dia" value="outros" ${ESTADO.chamadaTipoDia==='outros'?'checked':''} style="width:auto;" />Outros</label>
          </div>
        </div>
        <div id="ch-conteudo"></div>
        <div id="msg-chamada" style="margin-top:8px;"></div>
      </div>
    </div>`;

  document.getElementById('ch-turma').addEventListener('change', e => { ESTADO.chamadaTurma = e.target.value; renderizarChamada(el); });
  criarSeletorData('ch-data', ESTADO.chamadaData, (novaData) => { ESTADO.chamadaData = novaData; renderizarChamada(el); }, { turmaId: ESTADO.chamadaTurma || null });
  el.querySelectorAll('input[name="ch-tipo-dia"]').forEach(r => r.addEventListener('change', e => { ESTADO.chamadaTipoDia = e.target.value; renderizarChamada(el); }));

  const conteudo = document.getElementById('ch-conteudo');

  // Feriado / Ponto Facultativo / Outros -> aplica em massa (turma selecionada ou toda a escola)
  if(ESTADO.chamadaTipoDia !== 'normal'){
    const rotulos = { feriado:'Feriado', ponto_facultativo:'Ponto Facultativo', suspensao_aulas:'Suspensão de Aulas', outros:'Outros' };
    const turmaAtual = ESTADO.turmas.find(t => t.id === ESTADO.chamadaTurma);
    if(!turmaAtual && ESTADO.chamadaEscopo === 'turma') ESTADO.chamadaEscopo = 'todas';
    const alvoDescricao = ESTADO.chamadaEscopo === 'turma' && turmaAtual
      ? `os estudantes da turma <strong>${esc(turmaAtual.nome)} · ${esc(turmaAtual.turno)}</strong>`
      : `<strong>todos os estudantes da escola</strong>`;
    conteudo.innerHTML = `
      ${turmaAtual ? `<div class="campo" style="max-width:420px;margin-bottom:10px;">
        <label>Aplicar para</label>
        <select id="ch-escopo">
          <option value="turma" ${ESTADO.chamadaEscopo==='turma'?'selected':''}>Somente a turma selecionada (${esc(turmaAtual.nome)} · ${esc(turmaAtual.turno)})</option>
          <option value="todas" ${ESTADO.chamadaEscopo==='todas'?'selected':''}>Todas as turmas da escola</option>
        </select>
      </div>` : ''}
      <p style="font-size:13.5px;color:var(--texto-suave);margin-bottom:12px;">Ao aplicar, ${alvoDescricao} serão marcados como <strong>${rotulos[ESTADO.chamadaTipoDia]}</strong> na data ${formatarDataBR(ESTADO.chamadaData)}.</p>
      ${ESTADO.chamadaTipoDia === 'outros' ? `<div class="campo" style="max-width:420px;"><label>Descrição</label><input type="text" id="ch-texto-outros" value="${esc(ESTADO.chamadaTextoOutros)}" placeholder="Ex: Recesso escolar" /></div>` : ''}
      ${podeRegistrar
        ? `<button class="botao terracota pequeno" id="btn-aplicar-todos" style="margin-top:12px;width:auto;">Aplicar</button>`
        : `<p style="margin-top:10px;color:var(--erro);font-size:13.5px;">Apenas Coordenação/Apoio Escolar ou Administrador podem registrar a chamada.</p>`}
    `;
    const seletorEscopo = document.getElementById('ch-escopo');
    if(seletorEscopo) seletorEscopo.addEventListener('change', e => { ESTADO.chamadaEscopo = e.target.value; renderizarChamada(el); });
    if(podeRegistrar){
      document.getElementById('btn-aplicar-todos').addEventListener('click', async () => {
        const btn = document.getElementById('btn-aplicar-todos');
        btn.disabled = true; btn.textContent = 'Aplicando…';
        const campoTexto = document.getElementById('ch-texto-outros');
        const texto = ESTADO.chamadaTipoDia === 'outros' ? ((campoTexto && campoTexto.value.trim()) || null) : null;
        ESTADO.chamadaTextoOutros = texto || '';
        const aplicarSoNaTurma = ESTADO.chamadaEscopo === 'turma' && turmaAtual;
        const linhas = ESTADO.alunos
          .filter(a => (!aplicarSoNaTurma || a.turma_id === ESTADO.chamadaTurma) && alunoTemFrequenciaNaData(a, ESTADO.chamadaData))
          .map(a => ({
          aluno_id: a.id,
          turma_id: a.turma_id || null,
          data: ESTADO.chamadaData,
          status: ESTADO.chamadaTipoDia,
          texto_outros: texto,
          dias_justificados: null,
          registrado_por: ESTADO.perfil.id,
        }));
        const msg = document.getElementById('msg-chamada');
        const { error } = await supabase.from('frequencia').upsert(linhas, { onConflict: 'aluno_id,data' });
        if(error) msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
        else msg.innerHTML = `<div class="msg-ok">Frequência aplicada para ${aplicarSoNaTurma ? 'a turma ' + esc(turmaAtual.nome) : 'todos os estudantes da escola'}.</div>`;
        btn.disabled = false; btn.textContent = 'Aplicar';
      });
    }
    return;
  }

  // Dia letivo normal -> chamada individual por turma
  if(diaNaoLetivo){
    conteudo.innerHTML = `<p style="color:var(--erro);font-size:13.5px;">Não é possível registrar chamada em ${formatarDataBR(ESTADO.chamadaData)}: dia não letivo (${motivoNaoLetivo}). Se precisar registrar a frequência desse dia, use as opções Feriado/Ponto Facultativo/Outros acima.</p>`;
    return;
  }
  if(!ESTADO.chamadaTurma){
    const msgSucesso = ESTADO.chamadaMsgSucesso;
    ESTADO.chamadaMsgSucesso = null;
    conteudo.innerHTML = `
      ${msgSucesso ? `<div class="msg-ok">${esc(msgSucesso)}</div>` : ''}
      <p style="color:var(--texto-suave);font-size:13.5px;">Selecione uma turma para iniciar a chamada.</p>`;
    return;
  }
  conteudo.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Carregando chamada…</p>`;
  const alunosTurma = ESTADO.alunos.filter(a => a.turma_id === ESTADO.chamadaTurma && alunoTemFrequenciaNaData(a, ESTADO.chamadaData));
  let registros = [];
  if(alunosTurma.length){
    const resp = await supabase.from('frequencia').select('*').eq('data', ESTADO.chamadaData).in('aluno_id', alunosTurma.map(a => a.id));
    registros = resp.data || [];
  }
  const porAluno = {};
  registros.forEach(r => { porAluno[r.aluno_id] = r; });
  const statusEmMassa = ['feriado','ponto_facultativo','suspensao_aulas','outros'];
  const registroEmMassa = registros.find(r => statusEmMassa.includes(r.status));
  const rotulosEmMassa = { feriado:'Feriado', ponto_facultativo:'Ponto Facultativo', suspensao_aulas:'Suspensão de Aulas', outros:'Outros' };

  const linhas = alunosTurma.map(a => {
    const reg = porAluno[a.id];
    const status = reg?.status || 'presente';
    const dias = reg?.dias_justificados || '';
    const motivo = reg?.motivo_justificativa || '';
    const disabled = podeRegistrar ? '' : 'disabled';
    return `
      <tr data-aluno="${a.id}">
        <td style="padding:5px 12px;font-size:13px;">${esc(a.nome)}</td>
        <td style="padding:5px 12px;">
          <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;">
            <label style="display:flex;align-items:center;gap:4px;color:#2E7D32;font-weight:600;"><input type="radio" name="st-${a.id}" value="presente" ${status==='presente'?'checked':''} style="width:auto;accent-color:#2E7D32;" ${disabled} />Presente</label>
            <label style="display:flex;align-items:center;gap:4px;color:var(--erro);font-weight:600;"><input type="radio" name="st-${a.id}" value="falta" ${status==='falta'?'checked':''} style="width:auto;accent-color:var(--erro);" ${disabled} />Falta</label>
            <label style="display:flex;align-items:center;gap:4px;"><input type="radio" name="st-${a.id}" value="falta_justificada" ${status==='falta_justificada'?'checked':''} style="width:auto;" ${disabled} />Falta Justificada</label>
          </div>
        </td>
        <td style="padding:5px 12px;"><input type="number" min="1" max="60" class="input-dias-justificados" data-aluno="${a.id}" value="${dias}" placeholder="dias" ${disabled} style="width:70px;padding:4px 6px;${status==='falta_justificada'?'':'visibility:hidden;'}" /></td>
        <td style="padding:5px 12px;"><input type="text" class="input-motivo-justificativa" data-aluno="${a.id}" value="${esc(motivo)}" placeholder="Motivo (ex: atestado médico)" ${disabled} style="width:220px;padding:4px 6px;${status==='falta_justificada'?'':'visibility:hidden;'}" /></td>
      </tr>`;
  }).join('');

  conteudo.innerHTML = `
    ${registroEmMassa ? `<div class="msg-erro" style="margin-bottom:12px;">Este dia já tem um lançamento em massa registrado como <b>"${rotulosEmMassa[registroEmMassa.status] || registroEmMassa.status}"</b> (aplicado a todos os estudantes de uma vez, não pela chamada individual) — por isso nenhuma opção aparece marcada abaixo. Se você preencher e salvar a chamada individual agora, o registro de cada estudante marcado abaixo vai <b>substituir</b> esse lançamento em massa.</div>` : ''}
    ${alunosTurma.length
      ? `<table style="font-size:13px;"><thead><tr><th style="padding:6px 12px;">Estudante</th><th style="padding:6px 12px;">Situação</th><th style="padding:6px 12px;">Nº dias (se justificada)</th><th style="padding:6px 12px;">Motivo (se justificada)</th></tr></thead><tbody>${linhas}</tbody></table>`
      : `<p style="color:var(--texto-suave);font-size:13.5px;">Nenhum estudante nessa turma.</p>`}
    ${!podeRegistrar ? `<p style="margin-top:10px;color:var(--erro);font-size:13.5px;">Apenas Coordenação/Apoio Escolar ou Administrador podem registrar a chamada.</p>` : ''}
    ${podeRegistrar && alunosTurma.length ? `<p style="font-size:12px;color:var(--texto-suave);margin-top:8px;">Ao informar mais de 1 dia numa falta justificada, os dias seguintes são preenchidos automaticamente com o mesmo motivo, em contagem regressiva (ex: 3, 2, 1 dia restante).</p>` : ''}
    ${podeRegistrar && alunosTurma.length ? `<button class="botao terracota pequeno" id="btn-salvar-chamada" style="margin-top:12px;width:auto;">Salvar chamada</button>` : ''}
  `;

  conteudo.querySelectorAll('input[type="radio"]').forEach(r => {
    r.addEventListener('change', (e) => {
      const alunoId = e.target.name.replace('st-','');
      const campoDias = conteudo.querySelector(`.input-dias-justificados[data-aluno="${alunoId}"]`);
      const campoMotivo = conteudo.querySelector(`.input-motivo-justificativa[data-aluno="${alunoId}"]`);
      const visivel = e.target.value === 'falta_justificada' ? 'visible' : 'hidden';
      if(campoDias) campoDias.style.visibility = visivel;
      if(campoMotivo) campoMotivo.style.visibility = visivel;
    });
  });

  if(podeRegistrar && alunosTurma.length){
    document.getElementById('btn-salvar-chamada').addEventListener('click', async () => {
      const btn = document.getElementById('btn-salvar-chamada');
      btn.disabled = true; btn.textContent = 'Salvando…';
      const linhasSalvar = [];
      const dataBase = new Date(ESTADO.chamadaData + 'T00:00:00');
      for(const a of alunosTurma){
        const radioMarcado = conteudo.querySelector(`input[name="st-${a.id}"]:checked`);
        const status = radioMarcado ? radioMarcado.value : 'presente';
        const campoDias = conteudo.querySelector(`.input-dias-justificados[data-aluno="${a.id}"]`);
        const campoMotivo = conteudo.querySelector(`.input-motivo-justificativa[data-aluno="${a.id}"]`);
        const nDias = status === 'falta_justificada' ? (parseInt(campoDias.value, 10) || 1) : null;
        const motivo = status === 'falta_justificada' ? (campoMotivo.value.trim() || null) : null;
        // contagem regressiva: o primeiro dia mostra o total de dias, e cada dia seguinte mostra
        // quantos dias ainda restam (ex: falta justificada de 3 dias → 3, 2, 1)
        linhasSalvar.push({ aluno_id:a.id, turma_id:a.turma_id||null, data:ESTADO.chamadaData, status, registrado_por:ESTADO.perfil.id, dias_justificados:nDias, motivo_justificativa:motivo, texto_outros:null });
        if(status === 'falta_justificada' && nDias > 1){
          for(let i=1;i<nDias;i++){
            const d = new Date(dataBase); d.setDate(d.getDate()+i);
            const diasRestantes = nDias - i;
            linhasSalvar.push({ aluno_id:a.id, turma_id:a.turma_id||null, data:dataObjParaISO(d), status:'falta_justificada', registrado_por:ESTADO.perfil.id, dias_justificados:diasRestantes, motivo_justificativa:motivo, texto_outros:null });
          }
        }
      }
      const msg = document.getElementById('msg-chamada');
      const { error } = await supabase.from('frequencia').upsert(linhasSalvar, { onConflict: 'aluno_id,data' });
      if(error){
        msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`;
        btn.disabled = false; btn.textContent = 'Salvar chamada';
        return;
      }
      ESTADO.chamadaMsgSucesso = 'Chamada salva com sucesso.';
      ESTADO.chamadaTurma = '';
      renderizarChamada(el);
    });
  }
}

async function renderizarHistoricoFrequencia(el){
  const opcoesTurmas = ESTADO.turmas.slice().sort((a,b) => a.nome.localeCompare(b.nome))
    .map(t => `<option value="${t.id}" ${ESTADO.histTurmaId===t.id?'selected':''}>${esc(t.nome)} · ${esc(t.turno)}</option>`).join('');
  const alunosFiltrados = (ESTADO.histTurmaId ? ESTADO.alunos.filter(a => a.turma_id === ESTADO.histTurmaId) : ESTADO.alunos)
    .slice().sort((a,b) => a.nome.localeCompare(b.nome));
  const opcoesAlunos = alunosFiltrados
    .map(a => `<option value="${a.id}" ${ESTADO.histAlunoId===a.id?'selected':''}>${esc(a.nome)}</option>`).join('');

  el.innerHTML = `
    <div class="painel">
      <div class="barra" style="padding:10px 14px;flex-wrap:wrap;gap:12px;">
        <div class="campo" style="margin:0;min-width:220px;"><label>Turma</label><select id="hist-turma"><option value="">Todas as turmas</option>${opcoesTurmas}</select></div>
        <div class="campo" style="margin:0;min-width:280px;flex:1;"><label>Estudante</label><select id="hist-aluno"><option value="">Selecione o estudante</option>${opcoesAlunos}</select></div>
      </div>
      <div id="hist-conteudo" style="padding:12px 14px;"></div>
    </div>`;

  document.getElementById('hist-turma').addEventListener('change', e => {
    ESTADO.histTurmaId = e.target.value;
    if(ESTADO.histAlunoId && !ESTADO.alunos.find(a => a.id === ESTADO.histAlunoId && (!ESTADO.histTurmaId || a.turma_id === ESTADO.histTurmaId))){
      ESTADO.histAlunoId = '';
    }
    renderizarHistoricoFrequencia(el);
  });
  document.getElementById('hist-aluno').addEventListener('change', e => { ESTADO.histAlunoId = e.target.value; renderizarHistoricoFrequencia(el); });

  const conteudo = document.getElementById('hist-conteudo');
  if(!ESTADO.histAlunoId){
    conteudo.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Selecione um estudante para ver o histórico de frequência.</p>`;
    return;
  }
  conteudo.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Carregando…</p>`;

  const { data: historico } = await supabase.from('frequencia_mensal_historico').select('*').eq('aluno_id', ESTADO.histAlunoId).order('ano_letivo').order('mes');
  const { data: diasLetivosTodos } = await supabase.from('dias_letivos').select('*');
  const mapaDias = {};
  (diasLetivosTodos||[]).forEach(d => { mapaDias[`${d.ano_letivo}-${d.mes}`] = d.quantidade_dias; });

  const mapaHistorico = {};
  (historico||[]).forEach(h => { mapaHistorico[`${h.ano_letivo}-${h.mes}`] = h.faltas; });

  // Além dos meses já importados para o histórico, completa automaticamente os meses mais
  // recentes (que ainda não foram "fechados" no histórico) calculando as faltas ao vivo
  // a partir da Chamada Diária já registrada.
  const hoje = new Date();
  const anoAtual = hoje.getFullYear();
  const mesAtual = hoje.getMonth() + 1;
  const anosRelevantes = new Set((historico||[]).map(h => h.ano_letivo));
  anosRelevantes.add(anoAtual);

  const chavesParaExibir = [];
  Array.from(anosRelevantes).sort((a,b) => a-b).forEach(ano => {
    for(let mes = 1; mes <= 12; mes++){
      const chave = `${ano}-${mes}`;
      const temHistorico = chave in mapaHistorico;
      const temDiasLetivos = (mapaDias[chave] || 0) > 0;
      const jaOcorreu = ano < anoAtual || (ano === anoAtual && mes <= mesAtual);
      if(temHistorico || (temDiasLetivos && jaOcorreu)) chavesParaExibir.push({ ano, mes });
    }
  });

  if(!chavesParaExibir.length){
    conteudo.innerHTML = `<p style="color:var(--texto-suave);font-size:13.5px;">Nenhum histórico de frequência encontrado para este estudante.</p>`;
    return;
  }

  const linhasCalculadas = await Promise.all(chavesParaExibir.map(async ({ano, mes}) => {
    const chave = `${ano}-${mes}`;
    let faltas;
    if(chave in mapaHistorico){
      faltas = mapaHistorico[chave];
    } else {
      const ultimoDia = new Date(ano, mes, 0).getDate();
      const inicio = `${ano}-${String(mes).padStart(2,'0')}-01`;
      const fim = `${ano}-${String(mes).padStart(2,'0')}-${String(ultimoDia).padStart(2,'0')}`;
      const { data: faltasAoVivo } = await supabase.from('frequencia').select('status')
        .eq('aluno_id', ESTADO.histAlunoId).gte('data', inicio).lte('data', fim).in('status', ['falta','falta_justificada']);
      faltas = (faltasAoVivo||[]).length;
    }
    return { ano, mes, faltas };
  }));

  const linhas = linhasCalculadas.map(({ano, mes, faltas}) => {
    const totalDias = mapaDias[`${ano}-${mes}`];
    const percentual = totalDias ? Math.max(0, Math.round(((totalDias - faltas) / totalDias) * 100)) : null;
    return `<tr>
      <td>${MESES_EXTENSO[mes-1]}/${ano}</td>
      <td>${faltas}</td>
      <td>${totalDias ?? '—'}</td>
      <td>${percentual !== null ? percentual + '%' : '—'}</td>
    </tr>`;
  }).join('');

  conteudo.innerHTML = `
    <table><thead><tr><th>Mês</th><th>Faltas</th><th>Dias letivos</th><th>% Frequência</th></tr></thead><tbody>${linhas}</tbody></table>
    <p style="color:var(--texto-suave);font-size:12px;margin-top:8px;">O percentual só é calculado quando os dias letivos do mês estão cadastrados na aba "Dias letivos". Meses recentes que ainda não foram consolidados são calculados automaticamente a partir da Chamada Diária.</p>
  `;
}
// ---------------------------------------------------------------
const MESES_EXTENSO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function dataPorExtenso(iso){
  if(!iso) return '____________________';
  const [ano, mes, dia] = iso.split('-');
  return `${parseInt(dia,10)} de ${MESES_EXTENSO[parseInt(mes,10)-1].toLowerCase()} de ${ano}`;
}

// Monta o trecho "filho(a) de PAI e MÃE" dos documentos. Se um dos dois (geralmente o pai)
// não estiver cadastrado, mostra só o nome de quem está cadastrado — sem deixar uma linha
// em branco (____) do lado do nome que existe.
function formatarFiliacao(nomePai, nomeMae){
  const pai = (nomePai || '').trim();
  const mae = (nomeMae || '').trim();
  if(pai && mae) return `<b>${esc(pai)}</b> e <b>${esc(mae)}</b>`;
  if(mae) return `<b>${esc(mae)}</b>`;
  if(pai) return `<b>${esc(pai)}</b>`;
  return '<b>____________________</b>';
}

async function calcularPercentualFrequencia(alunoId, ano, mes){
  const { data: dl } = await supabase.from('dias_letivos').select('quantidade_dias').eq('ano_letivo', ano).eq('mes', mes).maybeSingle();
  const totalDiasBase = dl?.quantidade_dias || 0;
  if(!totalDiasBase) return null;
  const { data: hist } = await supabase.from('frequencia_mensal_historico').select('faltas').eq('aluno_id', alunoId).eq('ano_letivo', ano).eq('mes', mes).maybeSingle();
  let totalFaltas, totalDias;
  if(hist){
    // histórico fechado manualmente: não há como saber quantos dias foram "Outros" dia a dia, então usa o total base
    totalFaltas = hist.faltas;
    totalDias = totalDiasBase;
  } else {
    const ultimoDia = new Date(ano, mes, 0).getDate();
    const inicio = `${ano}-${String(mes).padStart(2,'0')}-01`;
    const fim = `${ano}-${String(mes).padStart(2,'0')}-${String(ultimoDia).padStart(2,'0')}`;
    const { data: registros } = await supabase.from('frequencia').select('status').eq('aluno_id', alunoId).gte('data', inicio).lte('data', fim).in('status', ['falta','falta_justificada','outros']);
    totalFaltas = (registros||[]).filter(r => r.status === 'falta' || r.status === 'falta_justificada').length;
    // dias "Outros" saem do denominador, igual acontece com feriados (não entram na quantidade de dias letivos)
    const diasOutros = (registros||[]).filter(r => r.status === 'outros').length;
    totalDias = Math.max(0, totalDiasBase - diasOutros);
  }
  if(!totalDias) return null;
  return Math.max(0, Math.round(((totalDias - totalFaltas) / totalDias) * 100));
}

      ESTADO.docAlunoId = '';
    }
    renderizarDeclaracoes(el);
  });
  document.getElementById('doc-aluno').addEventListener('change', e => { ESTADO.docAlunoId = e.target.value; renderizarDeclaracoes(el); });
  document.getElementById('doc-assinatura').addEventListener('change', e => { ESTADO.docAssinatura = e.target.value; });

  const extra = document.getElementById('doc-extra');
  if(ESTADO.docTipo === 'declaracao_frequencia'){
    const hoje = new Date();
    const mesesPadrao = [3,2,1].map(offset => {
      const d = new Date(hoje.getFullYear(), hoje.getMonth() - offset, 1);
      return { ano: d.getFullYear(), mes: d.getMonth()+1 };
    });
    const linhasMeses = mesesPadrao.map(m => `
      <div class="campo" style="margin-bottom:0;">
        <label>${MESES_EXTENSO[m.mes-1]}/${m.ano}</label>
        <input type="text" class="doc-freq-percentual" data-ano="${m.ano}" data-mes="${m.mes}" placeholder="${ESTADO.docAlunoId ? 'Calculando…' : 'Ex: 95%'}" />
      </div>`).join('');
    extra.innerHTML = `
      <div class="grade-2" style="grid-template-columns:repeat(3, 1fr);gap:10px;margin-top:4px;">
        ${linhasMeses}
      </div>
    `;
    if(ESTADO.docAlunoId){
      const campos = extra.querySelectorAll('.doc-freq-percentual');
      for(const campo of campos){
        const ano = parseInt(campo.dataset.ano, 10);
        const mes = parseInt(campo.dataset.mes, 10);
        calcularPercentualFrequencia(ESTADO.docAlunoId, ano, mes).then(pct => {
          campo.value = pct === null ? 'sem dados' : `${pct}%`;
          campo.placeholder = 'Ex: 95%';
        });
      }
    }
  } else if(ESTADO.docTipo === 'declaracao_provisoria'){
    const alunoSel = ESTADO.alunos.find(a => a.id === ESTADO.docAlunoId);
    const turmaSel = alunoSel ? ESTADO.turmas.find(t => t.id === alunoSel.turma_id) : null;
    const serieAtual = turmaSel ? extrairSerie(turmaSel.nome) : '';
    const serieSeguinte = serieAtual ? calcularSerieSeguinte(serieAtual) : '';
    if(!serieAtual){
      extra.innerHTML = `<p style="color:var(--texto-suave);font-size:13px;margin-top:6px;">Selecione um estudante com turma cadastrada para escolher a série.</p>`;
    } else {
      extra.innerHTML = `
        <div class="campo" style="max-width:420px;margin-top:4px;">
          <label>Série pretendida</label>
          <select id="doc-serie-provisoria">
            <option value="${esc(serieAtual)}">${esc(serieAtual)} (série atual)</option>
            ${serieSeguinte ? `<option value="${esc(serieSeguinte)}">${esc(serieSeguinte)} (série seguinte)</option>` : ''}
          </select>
        </div>`;
    }
  } else {
    extra.innerHTML = '';
  }

  document.getElementById('btn-gerar-documento').addEventListener('click', async () => {
    const msg = document.getElementById('msg-documentos');
    const alunoId = document.getElementById('doc-aluno').value;
    if(!alunoId){ msg.innerHTML = `<div class="msg-erro">Selecione um estudante.</div>`; return; }
    const aluno = ESTADO.alunos.find(a => a.id === alunoId);
    const dataDoc = document.getElementById('doc-data').value;
    const assinatura = document.getElementById('doc-assinatura').value;
    let meses = [];
    let serieProvisoria = '';
    if(ESTADO.docTipo === 'declaracao_frequencia'){
      meses = Array.from(extra.querySelectorAll('.doc-freq-percentual')).map(campo => ({
        nome: MESES_EXTENSO[parseInt(campo.dataset.mes,10)-1],
        percentual: campo.value.trim() || '____',
      }));
    } else if(ESTADO.docTipo === 'declaracao_provisoria'){
      const campoSerie = document.getElementById('doc-serie-provisoria');
      serieProvisoria = campoSerie ? campoSerie.value : '';
    }
    const btn = document.getElementById('btn-gerar-documento');
    btn.disabled = true; btn.textContent = 'Gerando…';
    msg.innerHTML = '';
    await gerarDocumento(ESTADO.docTipo, aluno, { dataDoc, assinatura, meses, serieProvisoria });
    btn.disabled = false; btn.textContent = 'Gerar documento';
  });
}

function extrairSerie(nomeTurma){
  return (nomeTurma || '').replace(/\s+[A-Z]$/,'').trim();
}

function calcularSerieSeguinte(serieAtual){
  const m = serieAtual.match(/^(\d+)º\s*ANO/i);
  if(!m) return '';
  const n = parseInt(m[1], 10);
  if(n === 9) return '1º ANO DO ENSINO MÉDIO';
  if(n < 9) return `${n+1}º ANO`;
  return '';
}

function formatarNota(valor){
  const limpo = (valor || '').toString().trim();
  if(!limpo || limpo === '-' || limpo === '—' || limpo.toLowerCase() === 'sem dados') return '—';
  return esc(limpo);
}

async function buscarArquivoMortoParaHistorico(el, elPai){

  const { data, error } = await supabase.from('arquivo_morto').select('*').ilike('nome', `%${termo}%`).order('nome').limit(20);
  if(error){ resultados.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; return; }

}

  `;
  document.getElementById('fn-assinatura').addEventListener('change', e => { ESTADO.docAssinatura = e.target.value; });

  function coletarDadosFicha(){
    const notasColetadas = {};
    const parciaisColetadas = {};
    COMPONENTES_FICHA_NOTAS.forEach(([chave]) => {
      notasColetadas[chave] = {
        b1: document.getElementById(`fn-notas-${chave}-b1`).value.trim(),
        b2: document.getElementById(`fn-notas-${chave}-b2`).value.trim(),
        b3: document.getElementById(`fn-notas-${chave}-b3`).value.trim(),
        b4: document.getElementById(`fn-notas-${chave}-b4`).value.trim(),
        recFinal: document.getElementById(`fn-notas-${chave}-recFinal`).value.trim(),
        notaFinal: document.getElementById(`fn-notas-${chave}-notaFinal`).value.trim(),
        resultado: document.getElementById(`fn-notas-${chave}-resultado`).value,
      };
      parciaisColetadas[chave] = {
        exame1: document.getElementById(`fn-parcial-${chave}-exame1`).value.trim(),
        exame2: document.getElementById(`fn-parcial-${chave}-exame2`).value.trim(),
        exame3: document.getElementById(`fn-parcial-${chave}-exame3`).value.trim(),
        resultado: document.getElementById(`fn-parcial-${chave}-resultado`).value.trim(),
      };
    });
    return {
      aluno_id: ESTADO.fichaNotasAlunoId,
      ano_civil: ESTADO.fichaNotasAno,
      serie: aluno?.turmas ? extrairSerie(aluno.turmas.nome) : null,
      carga_horaria_total: document.getElementById('fn-carga-horaria').value.trim() || null,
      quantidade_faltas: document.getElementById('fn-faltas').value.trim() || null,
      percentual_frequencia: document.getElementById('fn-frequencia').value.trim() || null,
      resultado_final: document.getElementById('fn-resultado-final').value || null,
      notas: notasColetadas,
      progressao_parcial: parciaisColetadas,
      exame_especial: {
        componente1Nome: document.getElementById('fn-exame-comp1-nome').value.trim(),
        componente1Nota: document.getElementById('fn-exame-comp1-nota').value.trim(),
        componente2Nome: document.getElementById('fn-exame-comp2-nome').value.trim(),
        componente2Nota: document.getElementById('fn-exame-comp2-nota').value.trim(),
        situacao: document.getElementById('fn-exame-situacao').value,
      },
      atualizado_em: new Date().toISOString(),
    };
  }

  document.getElementById('fn-anexo').addEventListener('change', async (e) => {
    const arquivo = e.target.files[0];
    const msgExtracao = document.getElementById('msg-extracao-ficha');
    if(!arquivo) return;
    msgExtracao.style.color = 'var(--texto-suave)';
    msgExtracao.textContent = 'Lendo o documento e extraindo os dados…';
    try{
      const base64Data = await new Promise((res, rej) => {
        const leitor = new FileReader();
        leitor.onload = () => res(leitor.result.split(',')[1]);
        leitor.onerror = () => rej(new Error('Falha ao ler o arquivo'));
        leitor.readAsDataURL(arquivo);
      });
      const { data: resposta, error } = await supabase.functions.invoke('extrair-ficha-notas', {
        body: { mediaType: arquivo.type, base64Data },
      });
      if(error || !resposta || resposta.error){
        msgExtracao.style.color = 'var(--erro)';
        msgExtracao.textContent = (resposta && resposta.error) || 'Não foi possível extrair os dados do documento.';
        return;
      }
      const dados = resposta.dados || {};

      if(dados.estudante_nome && aluno?.nome && normalizarNomeParaComparacao(dados.estudante_nome) !== normalizarNomeParaComparacao(aluno.nome)){
        msgExtracao.style.color = 'var(--erro)';
        msgExtracao.textContent = `Atenção: o documento parece ser de "${dados.estudante_nome}", mas o estudante selecionado é "${aluno.nome}". Os campos foram preenchidos mesmo assim — confira com cuidado antes de salvar.`;
      } else {
        msgExtracao.style.color = 'var(--verde-escuro, #2E7D32)';
        msgExtracao.textContent = 'Dados extraídos! Confira os campos antes de salvar.';
      }

      const preencher = (id, valor) => { const campo = document.getElementById(id); if(campo && valor !== null && valor !== undefined && valor !== '') campo.value = valor; };

      preencher('fn-carga-horaria', dados.carga_horaria_total);
      preencher('fn-faltas', dados.quantidade_faltas);
      preencher('fn-frequencia', dados.percentual_frequencia);
      preencher('fn-resultado-final', dados.resultado_final);

      const notasExtraidas = dados.notas || {};
      const parciaisExtraidos = dados.progressao_parcial || {};
      COMPONENTES_FICHA_NOTAS.forEach(([chave]) => {
        const v = notasExtraidas[chave] || {};
        preencher(`fn-notas-${chave}-b1`, v.b1);
        preencher(`fn-notas-${chave}-b2`, v.b2);
        preencher(`fn-notas-${chave}-b3`, v.b3);
        preencher(`fn-notas-${chave}-b4`, v.b4);
        preencher(`fn-notas-${chave}-recFinal`, v.recFinal);
        preencher(`fn-notas-${chave}-notaFinal`, v.notaFinal);
        preencher(`fn-notas-${chave}-resultado`, v.resultado);
        const p = parciaisExtraidos[chave] || {};
        preencher(`fn-parcial-${chave}-exame1`, p.exame1);
        preencher(`fn-parcial-${chave}-exame2`, p.exame2);
        preencher(`fn-parcial-${chave}-exame3`, p.exame3);
        preencher(`fn-parcial-${chave}-resultado`, p.resultado);
      });

      const exameEspExtraido = dados.exame_especial || {};
      preencher('fn-exame-comp1-nome', exameEspExtraido.componente1Nome);
      preencher('fn-exame-comp1-nota', exameEspExtraido.componente1Nota);
      preencher('fn-exame-comp2-nome', exameEspExtraido.componente2Nome);
      preencher('fn-exame-comp2-nota', exameEspExtraido.componente2Nota);
      preencher('fn-exame-situacao', exameEspExtraido.situacao);
    } catch(err){
      msgExtracao.style.color = 'var(--erro)';
      msgExtracao.textContent = 'Erro ao processar o anexo: ' + err.message;
    }
  });

  document.getElementById('btn-salvar-ficha-notas').addEventListener('click', async () => {
    const msg = document.getElementById('msg-ficha-notas');
    const btn = document.getElementById('btn-salvar-ficha-notas');
    btn.disabled = true; btn.textContent = 'Salvando…';
    const dados = coletarDadosFicha();
    const { error } = await supabase.from('fichas_notas').upsert(dados, { onConflict: 'aluno_id,ano_civil' });
    btn.disabled = false; btn.textContent = 'Salvar';

    msg.innerHTML = `<div class="msg-ok">Ficha salva com sucesso.</div>`;

    const msg = document.getElementById('msg-ficha-notas');
    const dados = coletarDadosFicha();
    const { error } = await supabase.from('fichas_notas').upsert(dados, { onConflict: 'aluno_id,ano_civil' });

    gerarFichaNotasDocumento(aluno, dados, document.getElementById('fn-assinatura').value);
  });
}

async function gerarFichaNotasDocumento(aluno, registro, assinaturaGestao){
  const { data: vinculos } = await supabase.from('aluno_responsavel').select('tipo, responsaveis(nome)').eq('aluno_id', aluno.id);
  const mae = (vinculos||[]).find(v => v.tipo === 'mae');
  const pai = (vinculos||[]).find(v => v.tipo === 'pai');
  const filiacao = formatarFiliacao(pai?.responsaveis?.nome, mae?.responsaveis?.nome);
  const serieTexto = registro.serie || (aluno.turmas ? extrairSerie(aluno.turmas.nome) : '____');
  const notas = registro.notas || {};
  const partes = registro.progressao_parcial || {};
  const exameEsp = registro.exame_especial || {};
  const nn = (v) => (v===undefined||v===null||v==='') ? '' : esc(v);
  const preenchido = (v) => !!(v && String(v).trim());
  // qualquer coisa que não seja um número (com vírgula ou ponto) digitada na Nota Final é tratada como texto de
  // resultado (ex: "cursando", "aprovado"...) e nunca é impressa na coluna de Nota Final, só na de Resultado
  const notaFinalEhNumero = (texto) => /^\d+([.,]\d+)?$/.test(texto);

  const linhasNotas = COMPONENTES_FICHA_NOTAS.map(([chave, nome]) => {
    const v = notas[chave] || {};
    const todosBimestresPreenchidos = preenchido(v.b1) && preenchido(v.b2) && preenchido(v.b3) && preenchido(v.b4);
    // Média Anual = média dos 4 bimestres, só calculada quando os 4 estiverem preenchidos com números de verdade
    let mediaExibir = '';
    if(todosBimestresPreenchidos){
      const numeros = [v.b1, v.b2, v.b3, v.b4].map(x => parseFloat(String(x).replace(',', '.')));
      if(numeros.every(n => !isNaN(n))){
        mediaExibir = (numeros.reduce((a,b) => a+b, 0) / 4).toFixed(1).replace('.', ',');
      }
    }
    const notaFinalTexto = (v.notaFinal || '').toString().trim();
    const notaFinalEhTextoDeResultado = preenchido(notaFinalTexto) && !notaFinalEhNumero(notaFinalTexto);
    // a Nota Final só é impressa se: (a) for um número de verdade, e (b) os 4 bimestres estiverem completos
    const notaFinalExibir = (!notaFinalEhTextoDeResultado && todosBimestresPreenchidos) ? v.notaFinal : '';
    // se o Resultado estiver vazio mas alguém digitou um texto (tipo "cursando") na Nota Final por engano, ele aparece aqui, no lugar certo
    const resultadoExibir = v.resultado ? v.resultado.toUpperCase() : (notaFinalEhTextoDeResultado ? notaFinalTexto.toUpperCase() : '');
    return `<tr>
      <td style="text-align:left;padding-left:6px;">${esc(nome)}</td>
      <td><b>${nn(v.b1)}</b></td><td><b>${nn(v.b2)}</b></td><td><b>${nn(v.b3)}</b></td><td><b>${nn(v.b4)}</b></td>
      <td><b>${nn(mediaExibir)}</b></td>
      <td><b>${nn(v.recFinal)}</b></td><td><b>${nn(notaFinalExibir)}</b></td>
      <td><b>${esc(resultadoExibir)}</b></td>
    </tr>`;
  }).join('');
  // diagonal na 1ª página: só cruza III/IV bimestre + média + rec.final + nota final se nenhum componente tiver esses campos preenchidos
  // (ou seja, o ano letivo ainda está em andamento e essas colunas realmente não têm o que mostrar)
  const semDadosSegundoSemestre = COMPONENTES_FICHA_NOTAS.every(([chave]) => {
    const v = notas[chave] || {};
    const notaFinalTexto = (v.notaFinal || '').toString().trim();
    const notaFinalConta = preenchido(notaFinalTexto) && notaFinalEhNumero(notaFinalTexto);
    return !preenchido(v.b3) && !preenchido(v.b4) && !preenchido(v.recFinal) && !notaFinalConta;
  });
  // se nem o 1º bimestre foi lançado pra nenhum componente, a linha risca a tabela inteira (do I bimestre até Nota Final)
  const nenhumaNotaLancada = COMPONENTES_FICHA_NOTAS.every(([chave]) => {
    const v = notas[chave] || {};
    const notaFinalTexto = (v.notaFinal || '').toString().trim();
    const notaFinalConta = preenchido(notaFinalTexto) && notaFinalEhNumero(notaFinalTexto);
    return !preenchido(v.b1) && !preenchido(v.b2) && !preenchido(v.b3) && !preenchido(v.b4) && !preenchido(v.recFinal) && !notaFinalConta;
  });

  const linhasParcial = COMPONENTES_FICHA_NOTAS.map(([chave, nome]) => `<tr>
      <td style="text-align:left;padding-left:6px;">${esc(nome)}</td>
      <td><b>${nn((partes[chave]||{}).exame1)}</b></td><td><b>${nn((partes[chave]||{}).exame2)}</b></td><td><b>${nn((partes[chave]||{}).exame3)}</b></td><td><b>${nn((partes[chave]||{}).resultado)}</b></td>
    </tr>`).join('');
  // diagonal na 2ª página: cruza a tabela inteira (exceto a coluna do componente) se nenhum componente tiver nota de progressão parcial lançada
  const semDadosProgressaoParcial = COMPONENTES_FICHA_NOTAS.every(([chave]) => {
    const v = partes[chave] || {};
    return !preenchido(v.exame1) && !preenchido(v.exame2) && !preenchido(v.exame3) && !preenchido(v.resultado);
  });

  const mapaResultadoFinal = { aprovado:'APROVADO', progressao_parcial:'PROGRESSÃO PARCIAL', retido:'RETIDO', cursando:'CURSANDO' };

  // colunas da tabela de notas por bimestre (somam 100%) — usadas nas duas tabelas (cabeçalho e corpo) para ficarem alinhadas
  const colgroupNotas = `<colgroup>
    <col style="width:19%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:7%">
    <col style="width:8%"><col style="width:7%"><col style="width:7%"><col style="width:31%">
  </colgroup>`;
  // colunas da tabela de progressão parcial (somam 100%)
  const colgroupParcial = `<colgroup>
    <col style="width:24%"><col style="width:17%"><col style="width:17%"><col style="width:17%"><col style="width:25%">
  </colgroup>`;

  const janela = window.open('', '_blank');
  janela.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8" />

function normalizarNomeParaComparacao(nome){
  return (nome || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toUpperCase().replace(/\s+/g, ' ');
}

function renderizarInsercaoAta(el){
  el.innerHTML = `
    <div class="painel">
      <div class="barra" style="padding:10px 14px;"><strong style="font-size:14px;">Inserir ata com vários estudantes</strong></div>
      <div style="padding:14px;">
        <p style="font-size:13px;color:var(--texto-suave);margin:0 0 10px;">Anexe a foto ou PDF de uma ata de resultados finais com vários estudantes. O sistema lê o documento e casa cada nome com os estudantes <b>já matriculados</b> nesta escola — só esses recebem as notas.</p>
        <div class="campo" style="margin-bottom:0;">
          <input type="file" id="ata-anexo" accept="image/*,application/pdf" />
        </div>
        <div id="msg-ata" style="margin-top:10px;"></div>
        <div id="ata-revisao" style="margin-top:14px;"></div>
      </div>
    </div>`;

  document.getElementById('ata-anexo').addEventListener('change', async (e) => {
    const arquivo = e.target.files[0];
    const msg = document.getElementById('msg-ata');
    const revisao = document.getElementById('ata-revisao');
    revisao.innerHTML = '';
    if(!arquivo) return;
    msg.innerHTML = `<p style="color:var(--texto-suave);font-size:13px;">Lendo a ata e identificando os estudantes…</p>`;
    try{
      const base64Data = await new Promise((res, rej) => {
        const leitor = new FileReader();
        leitor.onload = () => res(leitor.result.split(',')[1]);
        leitor.onerror = () => rej(new Error('Falha ao ler o arquivo'));
        leitor.readAsDataURL(arquivo);
      });
      const { data: resposta, error } = await supabase.functions.invoke('extrair-ata', {
        body: { mediaType: arquivo.type, base64Data },
      });
      if(error || !resposta || resposta.error){
        msg.innerHTML = `<p style="color:var(--erro);font-size:13px;">${esc((resposta && resposta.error) || 'Não foi possível extrair os dados da ata.')}</p>`;
        return;
      }
      const dadosAta = resposta.dados || {};
      const estudantesAta = Array.isArray(dadosAta.estudantes) ? dadosAta.estudantes : [];
      if(!estudantesAta.length){
        msg.innerHTML = `<p style="color:var(--erro);font-size:13px;">Nenhum estudante foi identificado nessa ata.</p>`;
        return;
      }
      msg.innerHTML = `<p style="color:var(--texto-suave);font-size:13px;">${estudantesAta.length} estudante(s) identificado(s) na ata. Confira o casamento abaixo antes de importar.</p>`;
      exibirRevisaoAta(revisao, dadosAta, estudantesAta);
    } catch(err){
      msg.innerHTML = `<p style="color:var(--erro);font-size:13px;">Erro ao processar o anexo: ${esc(err.message)}</p>`;
    }
  });
}

function exibirRevisaoAta(el, dadosAta, estudantesAta){
  const mapaAlunosPorNome = {};
  ESTADO.alunos.forEach(a => { mapaAlunosPorNome[normalizarNomeParaComparacao(a.nome)] = a; });

  const linhas = estudantesAta.map((est, i) => {
    const nomeNorm = normalizarNomeParaComparacao(est.nome);
    const alunoEncontrado = mapaAlunosPorNome[nomeNorm];
    return `
      <tr data-idx="${i}">
        <td>${alunoEncontrado ? `<input type="checkbox" class="ata-check" data-idx="${i}" checked style="width:auto;" />` : ''}</td>
        <td>${esc(est.nome || '—')}</td>
        <td>${alunoEncontrado
          ? `<span style="color:#2E7D32;font-weight:600;">✓ ${esc(alunoEncontrado.nome)}</span>`
          : `<span style="color:var(--erro);">Não encontrado entre os matriculados</span>`}</td>
      </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="grade-2" style="grid-template-columns:repeat(4, 1fr);gap:10px;margin-bottom:12px;">
      <div class="campo" style="margin-bottom:0;"><label>Ano civil</label><input type="number" id="ata-ano-civil" value="${dadosAta.ano_civil || new Date().getFullYear()}" /></div>
      <div class="campo" style="margin-bottom:0;"><label>Série</label><input type="text" id="ata-serie" value="${esc(dadosAta.serie||'')}" /></div>
      <div class="campo" style="margin-bottom:0;"><label>Unidade de ensino</label><input type="text" id="ata-unidade" value="${esc(dadosAta.unidade_ensino||'')}" /></div>
      <div class="campo" style="margin-bottom:0;"><label>Carga horária anual</label><input type="text" id="ata-carga" value="${esc(dadosAta.carga_horaria_anual||'')}" /></div>
    </div>
    <table><thead><tr><th style="width:36px;"></th><th>Nome na ata</th><th>Correspondência</th></tr></thead><tbody>${linhas}</tbody></table>
    <div id="msg-importar-ata" style="margin-top:10px;"></div>
    <button class="botao terracota pequeno" id="btn-importar-ata" style="margin-top:10px;width:auto;">Importar selecionados</button>
  `;

  document.getElementById('btn-importar-ata').addEventListener('click', async () => {
    const btn = document.getElementById('btn-importar-ata');
    const msg = document.getElementById('msg-importar-ata');
    const anoCivil = parseInt(document.getElementById('ata-ano-civil').value, 10);
    const serie = document.getElementById('ata-serie').value.trim() || null;
    const unidade = document.getElementById('ata-unidade').value.trim() || null;
    const carga = document.getElementById('ata-carga').value.trim() || null;
    if(!anoCivil){ msg.innerHTML = `<div class="msg-erro">Informe o ano civil.</div>`; return; }
    const marcados = Array.from(el.querySelectorAll('.ata-check:checked'));
    if(!marcados.length){ msg.innerHTML = `<div class="msg-erro">Nenhum estudante selecionado.</div>`; return; }
    btn.disabled = true; btn.textContent = 'Importando…';

    const mapaAlunosPorNome = {};
    ESTADO.alunos.forEach(a => { mapaAlunosPorNome[normalizarNomeParaComparacao(a.nome)] = a; });

    const linhasParaSalvar = marcados.map(chk => {
      const est = estudantesAta[parseInt(chk.dataset.idx, 10)];
      const aluno = mapaAlunosPorNome[normalizarNomeParaComparacao(est.nome)];
      return {
        aluno_id: aluno.id,
        ano_civil: anoCivil,
        serie, unidade_ensino: unidade, carga_horaria_anual: carga,
        frequencia_anual: est.frequencia_anual || null,
        progressao: est.progressao || null,
        nota_lingua_portuguesa: est.nota_lingua_portuguesa || null,
        nota_arte: est.nota_arte || null,
        nota_educacao_fisica: est.nota_educacao_fisica || null,
        nota_matematica: est.nota_matematica || null,
        nota_ciencias: est.nota_ciencias || null,
        nota_historia: est.nota_historia || null,
        nota_geografia: est.nota_geografia || null,
        nota_ensino_religioso: est.nota_ensino_religioso || null,
        nota_lingua_inglesa: est.nota_lingua_inglesa || null,
        nota_edhc: est.nota_edhc || null,
      };
    });
    const { error } = await supabase.from('historico_escolar_anual').upsert(linhasParaSalvar, { onConflict: 'aluno_id,ano_civil' });
    if(error){ msg.innerHTML = `<div class="msg-erro">${esc(error.message)}</div>`; btn.disabled = false; btn.textContent = 'Importar selecionados'; return; }
    msg.innerHTML = `<div class="msg-ok">${linhasParaSalvar.length} estudante(s) importado(s) com sucesso.</div>`;
    btn.textContent = 'Importado ✓';
  });
}

async function preencherSeriesAutomaticamente(aluno){
  if(!aluno) return { ok:false, motivo:'sem_aluno' };
  const turma = ESTADO.turmas.find(t => t.id === aluno.turma_id);
  if(!turma) return { ok:false, motivo:'sem_turma' };
  const serieTextoAtual = extrairSerie(turma.nome);
  const m = serieTextoAtual.match(/^(\d+)º\s*ANO/i);
  if(!m) return { ok:false, motivo:'serie_nao_reconhecida' };
  const numeroAtual = parseInt(m[1], 10);
  if(numeroAtual < 1 || numeroAtual > 9) return { ok:false, motivo:'fora_do_fundamental' };

  const anoVigente = new Date().getFullYear();
  const { data: existentes } = await supabase.from('historico_escolar_anual').select('id, ano_civil, serie, carga_horaria_anual').eq('aluno_id', aluno.id);
  const mapaExistentes = new Map((existentes||[]).map(r => [r.ano_civil, r]));
  // Números de série que o estudante JÁ TEM registrados (em qualquer ano civil) — importante para não
  // recriar uma série "fantasma" quando o estudante repetiu de ano (a série real já está
  // registrada em outro ano civil diferente do que a fórmula sequencial esperaria).
  const numeroDaSerie = (texto) => { const m = (texto||'').match(/(\d+)/); return m ? parseInt(m[1], 10) : null; };
  const numerosJaRegistrados = new Set((existentes||[]).map(r => numeroDaSerie(r.serie)).filter(n => n !== null));

  const linhasNovas = [];
  const atualizacoesCarga = [];
  for(let numero=1; numero<=numeroAtual; numero++){
    const anoCivil = anoVigente - (numeroAtual - numero);
    const cargaHoraria = numero <= 5 ? '800 h' : '1080 h';
    const existente = mapaExistentes.get(anoCivil);
    const jaTemEssaSerie = numerosJaRegistrados.has(numero);
    if(!existente && !jaTemEssaSerie){
      linhasNovas.push({ aluno_id: aluno.id, ano_civil: anoCivil, serie: `${numero}º ANO`, carga_horaria_anual: cargaHoraria });
    } else if(existente && (!existente.carga_horaria_anual || !existente.carga_horaria_anual.trim())){
      atualizacoesCarga.push({ id: existente.id, carga_horaria_anual: cargaHoraria });
    }
  }
  if(linhasNovas.length){
    await supabase.from('historico_escolar_anual').upsert(linhasNovas, { onConflict: 'aluno_id,ano_civil' });
  }
  for(const atualizacao of atualizacoesCarga){
    await supabase.from('historico_escolar_anual').update({ carga_horaria_anual: atualizacao.carga_horaria_anual }).eq('id', atualizacao.id);
  }
  return { ok:true };
}

async function renderizarBancoHistorico(conteudo, elPai, contexto){

  const arquivoMortoId = contexto?.arquivoMortoId || null;

  const resultadoAuto = alunoId ? await preencherSeriesAutomaticamente(aluno) : { ok:true };
  const query = supabase.from('historico_escolar_anual').select('*').order('ano_civil');
  const { data: anos } = alunoId ? await query.eq('aluno_id', alunoId) : await query.eq('arquivo_morto_id', arquivoMortoId);

  const mensagensAviso = {
    sem_turma: 'Este estudante não tem turma cadastrada, por isso não foi possível gerar automaticamente as séries do 1º ao 9º ano. Cadastre a turma do estudante para habilitar o preenchimento automático.',
    serie_nao_reconhecida: 'Não foi possível identificar a série atual a partir do nome da turma (ex: "5º ANO A"). Ajuste o nome da turma para habilitar o preenchimento automático.',
    fora_do_fundamental: 'A série identificada está fora do intervalo do 1º ao 9º ano (Ensino Fundamental), então o preenchimento automático não foi aplicado.',
  };
  const avisoSerie = !resultadoAuto.ok
    ? `<p style="color:var(--erro);font-size:13px;margin-bottom:10px;">${mensagensAviso[resultadoAuto.motivo] || ''}</p>`
    : '';

  const linhas = registros.map(r => `
    <tr>
      <td>${r.ano_civil}</td>
      <td>${esc(r.serie || '—')}</td>
      <td>${esc(r.unidade_ensino || '—')}</td>
      <td>${r.progressao ? r.progressao.toUpperCase() : '—'}</td>
      <td style="white-space:nowrap;">
        <button class="botao secundario pequeno" data-editar-ano="${r.id}" style="width:auto;padding:4px 10px;">Editar</button>
        <button class="botao secundario pequeno" data-remover-ano="${r.id}" style="width:auto;padding:4px 10px;">Remover</button>
      </td>
    </tr>`).join('');

  conteudo.innerHTML = `
    ${avisoSerie}
    ${registros.length
      ? `<table><thead><tr><th>Ano</th><th>Série</th><th>Unidade de Ensino</th><th>Progressão</th><th></th></tr></thead><tbody>${linhas}</tbody></table>`
      : `<p style="color:var(--texto-suave);font-size:13.5px;">Nenhum ano letivo encontrado para este estudante.</p>`}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
      <button class="botao secundario pequeno" id="btn-novo-ano" style="width:auto;">+ Novo ano letivo</button>
      <button class="botao terracota pequeno" id="btn-gerar-historico" style="width:auto;">Gerar Histórico Escolar</button>
    </div>
    <div id="he-form" style="margin-top:14px;"></div>
    <div id="msg-historico" style="margin-top:8px;"></div>
    <div style="margin-top:22px;border-top:1px solid var(--borda);padding-top:14px;">
      <strong style="font-size:14px;">Documentos anexados (fotos ou PDFs)</strong>
      <p style="font-size:12.5px;color:var(--texto-suave);margin:4px 0 10px;">Fotos de páginas do histórico antigo, atas de notas digitalizadas etc. — ficam salvos aqui permanentemente.</p>
      <div id="he-anexos-lista"></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;">
        <input type="file" id="he-anexo-permanente" accept="image/*,application/pdf" multiple style="flex:1;min-width:200px;" />
        <span id="msg-anexo-permanente" style="font-size:12.5px;color:var(--texto-suave);"></span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
        <button class="botao secundario pequeno" id="btn-novo-ano-2" style="width:auto;">${registros.length ? 'Editar ano letivo' : '+ Novo ano letivo'}</button>
        <button class="botao terracota pequeno" id="btn-gerar-historico-2" style="width:auto;">Gerar Histórico Escolar</button>
      </div>
    </div>
  `;

  document.getElementById('btn-novo-ano').addEventListener('click', () => {
    exibirFormularioAno(document.getElementById('he-form'), null, conteudo, elPai, { alunoId, arquivoMortoId });
  });
  document.getElementById('btn-novo-ano-2').addEventListener('click', () => {
    const registroExistente = registros[registros.length-1] || null;
    exibirFormularioAno(document.getElementById('he-form'), registroExistente, conteudo, elPai, { alunoId, arquivoMortoId });
    document.getElementById('he-form').scrollIntoView({ behavior:'smooth', block:'start' });
  });
  function acionarGerarHistorico(){
    if(!registros.length){
      document.getElementById('msg-historico').innerHTML = `<div class="msg-erro">Cadastre pelo menos um ano letivo antes de gerar o Histórico Escolar.</div>`;
      return;
    }
    if(alunoId) gerarHistoricoEscolarDocumento(aluno, registros);
    else gerarHistoricoEscolarDocumentoArquivoMorto(arquivoMortoId, registros);
  }
  document.getElementById('btn-gerar-historico').addEventListener('click', acionarGerarHistorico);
  document.getElementById('btn-gerar-historico-2').addEventListener('click', acionarGerarHistorico);
  conteudo.querySelectorAll('[data-editar-ano]').forEach(b => b.addEventListener('click', () => {

    await supabase.from('historico_escolar_anual').delete().eq('id', b.dataset.removerAno);
    renderizarBancoHistorico(conteudo, elPai, contexto);
  }));

  renderizarAnexosHistorico(document.getElementById('he-anexos-lista'), { alunoId, arquivoMortoId });
  document.getElementById('he-anexo-permanente').addEventListener('change', async (e) => {
    const arquivos = Array.from(e.target.files || []);

      const { error: erroUpload } = await supabase.storage.from('documentos-historico').upload(caminho, arquivo, { upsert: true });
      if(erroUpload){ msgAnexo.textContent = 'Erro ao enviar: ' + erroUpload.message; continue; }
      const { data: urlAssinada } = await supabase.storage.from('documentos-historico').createSignedUrl(caminho, EXPIRACAO_LINK_STORAGE);
      await supabase.from('historico_escolar_anexos').insert({
        aluno_id: alunoId || null,
        arquivo_morto_id: arquivoMortoId || null,
        nome_arquivo: arquivo.name,
        tipo: arquivo.type.startsWith('image/') ? 'imagem' : 'pdf',
        url: urlAssinada?.signedUrl || null,
        enviado_por: ESTADO.perfil.id,
      });
    }
    msgAnexo.textContent = 'Anexado com sucesso.';
    e.target.value = '';
    renderizarAnexosHistorico(document.getElementById('he-anexos-lista'), { alunoId, arquivoMortoId });
  });

async function renderizarAnexosHistorico(el, { alunoId, arquivoMortoId }){
  el.innerHTML = `<p style="color:var(--texto-suave);font-size:12.5px;">Carregando anexos…</p>`;
